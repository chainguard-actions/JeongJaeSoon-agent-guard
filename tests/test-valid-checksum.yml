name: Test install with a valid sha256 checksum
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Compute checksum for gitleaks archive
        id: sum
        run: |
          set -euo pipefail
          version="8.30.1"
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m)"
          case "$arch" in
            x86_64|amd64) arch="x64" ;;
            arm64|aarch64) arch="arm64" ;;
          esac
          archive="gitleaks_${version}_${os}_${arch}.tar.gz"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" -o "/tmp/${archive}"
          sum="$(sha256sum "/tmp/${archive}" | awk '{print $1}')"
          echo "checksum: $sum"
          echo "checksum=$sum" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        with:
          paths: tests/fixtures/clean
          gitleaks-version: "8.30.1"
          gitleaks-checksum: ${{ steps.sum.outputs.checksum }}
      - name: Assert success and gitleaks installed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if ! gitleaks version | grep -q "8.30.1"; then
            echo "FAIL: expected gitleaks 8.30.1"
            gitleaks version || true
            exit 1
          fi
          echo "PASS"
