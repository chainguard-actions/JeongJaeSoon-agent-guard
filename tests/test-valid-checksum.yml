name: Test install with a correct pinned checksum
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Compute checksum of gitleaks archive
        id: sum
        run: |
          set -euo pipefail
          version=8.30.1
          arch="$(uname -m)"
          case "$arch" in
            x86_64|amd64) arch=x64 ;;
            arm64|aarch64) arch=arm64 ;;
          esac
          archive="gitleaks_${version}_linux_${arch}.tar.gz"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" -o "/tmp/${archive}"
          sum="$(sha256sum "/tmp/${archive}" | awk '{print $1}')"
          rm -f "/tmp/${archive}"
          echo "checksum: $sum"
          echo "checksum=$sum" >> "$GITHUB_OUTPUT"
          rm -rf scan-clean
          mkdir -p scan-clean
          echo "plain text" > scan-clean/a.txt
      - id: action
        uses: .
        with:
          paths: scan-clean
          gitleaks-version: "8.30.1"
          gitleaks-checksum: ${{ steps.sum.outputs.checksum }}
      - name: Assert success
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          command -v gitleaks || { echo "FAIL: gitleaks missing"; exit 1; }
          echo "PASS"
