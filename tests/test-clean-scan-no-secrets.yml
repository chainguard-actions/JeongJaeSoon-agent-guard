name: Test clean scan with no secrets
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Pre-install gitleaks so the action skips the download step entirely.
      - name: Pre-install gitleaks
        run: |
          set -euo pipefail
          VERSION="8.30.1"
          OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
          ARCH="x64"
          ARCHIVE="gitleaks_${VERSION}_${OS}_${ARCH}.tar.gz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ARCHIVE}"
          TMP="$(mktemp -d)"
          curl -fsSL "$URL" -o "$TMP/$ARCHIVE"
          tar -xzf "$TMP/$ARCHIVE" -C "$TMP"
          sudo mv "$TMP/gitleaks" /usr/local/bin/gitleaks
          sudo chmod +x /usr/local/bin/gitleaks
          gitleaks version

      # Create a clean git repository with no secrets to scan.
      - name: Create clean test directory
        run: |
          mkdir -p /tmp/clean-test-dir
          echo "# Hello World" > /tmp/clean-test-dir/README.md
          echo "name: my-project" > /tmp/clean-test-dir/config.yaml
          echo "version: 1.0.0" >> /tmp/clean-test-dir/config.yaml
          git init /tmp/clean-test-dir
          git -C /tmp/clean-test-dir config user.email "test@example.com"
          git -C /tmp/clean-test-dir config user.name "Test"
          git -C /tmp/clean-test-dir add .
          git -C /tmp/clean-test-dir commit -m "initial"

      - id: action
        uses: .
        with:
          paths: /tmp/clean-test-dir
          require-checksum: "false"

      - name: Assert action succeeded on clean directory
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed on a clean directory, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly passed on a clean directory"
