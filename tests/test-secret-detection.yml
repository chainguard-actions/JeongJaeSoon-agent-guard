name: Test secret detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install fake gitleaks that detects test secrets
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fake-bin"
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-gitleaks-detect.sh" "$RUNNER_TEMP/fake-bin/gitleaks"
          chmod +x "$RUNNER_TEMP/fake-bin/gitleaks"
          echo "$RUNNER_TEMP/fake-bin" >> "$GITHUB_PATH"

      - name: Create a subdirectory with a test secret
        run: |
          mkdir -p "$GITHUB_WORKSPACE/secret-scan-target"
          # Use the test secret pattern that the fake gitleaks detects
          echo 'API_KEY=AGENT_GUARD_TEST_SECRET' > "$GITHUB_WORKSPACE/secret-scan-target/config.env"

      - id: action
        name: Run agent-guard on directory with secret
        uses: .
        continue-on-error: true
        with:
          paths: secret-scan-target
          require-checksum: "false"

      - name: Assert action failed (secret detected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly detected a secret and failed"
          else
            echo "FAIL: expected action to fail when a secret is present, but got outcome '$OUTCOME'"
            exit 1
          fi
