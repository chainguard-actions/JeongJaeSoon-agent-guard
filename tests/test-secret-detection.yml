name: Test secret detection blocks scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION="8.30.1"
          OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64|amd64) ARCH="x64" ;;
            arm64|aarch64) ARCH="arm64" ;;
          esac
          ARCHIVE="gitleaks_${VERSION}_${OS}_${ARCH}.tar.gz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ARCHIVE}"
          TMP="$(mktemp -d)"
          curl -fsSL "$URL" -o "$TMP/$ARCHIVE"
          tar -xzf "$TMP/$ARCHIVE" -C "$TMP"
          sudo mv "$TMP/gitleaks" /usr/local/bin/gitleaks
          sudo chmod +x /usr/local/bin/gitleaks
          gitleaks version

      - name: Create directory with a secret-like value
        run: |
          mkdir -p /tmp/dirty-scan
          # Write a fake GitHub PAT: ghp_ followed by exactly 36 alphanumeric chars
          # This matches the agent-guard-vendor-token-shape rule regex: gh[opusr]_[0-9A-Za-z]{36}
          # 36 chars: aAbBcCdDeEfFgGhHiIjJkKlLmMnNoOpPqQrR
          printf 'GITHUB_TOKEN=ghp_%s\n' 'aAbBcCdDeEfFgGhHiIjJkKlLmMnNoOpPqQrR' > /tmp/dirty-scan/secrets.env

      - name: Run Agent Guard on dirty directory (expect failure)
        id: action
        uses: .
        with:
          paths: /tmp/dirty-scan
          require-checksum: "false"
        continue-on-error: true

      - name: Assert action failed (secret detected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when a secret-like value is present, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly detected secret and failed"
