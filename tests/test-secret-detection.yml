name: Test secret detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure setsid is available (required by agent-guard)
        run: |
          if ! command -v setsid > /dev/null 2>&1; then
            echo "setsid not found, installing util-linux..."
            sudo apt-get install -y util-linux 2>/dev/null || true
          fi
          setsid --version || perl -e 'print "perl available\n"' || true

      - name: Pre-install gitleaks to avoid download
        run: |
          VERSION="8.30.1"
          OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64|amd64) ARCH="x64" ;;
            arm64|aarch64) ARCH="arm64" ;;
          esac
          ARCHIVE="gitleaks_${VERSION}_${OS}_${ARCH}.tar.gz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ARCHIVE}"
          TMP="$(mktemp -d)"
          curl -fsSL "$URL" -o "$TMP/$ARCHIVE"
          tar -xzf "$TMP/$ARCHIVE" -C "$TMP"
          sudo mv "$TMP/gitleaks" /usr/local/bin/gitleaks
          sudo chmod +x /usr/local/bin/gitleaks
          gitleaks version

      - name: Create a directory with a secret-like value inside workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/secret-scan-target"
          # Write a file containing a GitHub PAT-shaped token (will be detected by gitleaks)
          # ghp_ prefix followed by exactly 36 alphanumeric chars matches the vendor-token-shape rule
          # ghp_ = 4 chars, then 36 alphanumeric chars = 40 chars total
          printf 'GITHUB_TOKEN=ghp_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\n' \
            > "$GITHUB_WORKSPACE/secret-scan-target/config.env"

      - id: action
        uses: .
        with:
          paths: "${{ github.workspace }}/secret-scan-target"
          require-checksum: "false"
        continue-on-error: true

      - name: Assert action detected the secret (exit non-zero)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly detected secret-like value and exited non-zero"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have detected the secret-shaped token but reported clean"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
