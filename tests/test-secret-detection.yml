name: Test secret detection (action fails on leaked secret)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a directory with a fake secret
        run: |
          mkdir -p /tmp/secret-scan-target
          # Write a file containing a fake GitHub PAT-shaped token
          # This matches the agent-guard-vendor-token-shape rule
          # ghp_ prefix + 36 alphanumeric chars = detectable by gitleaks
          cat > /tmp/secret-scan-target/config.env << 'EOF'
          GITHUB_TOKEN=ghp_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA1
          EOF
          cd /tmp/secret-scan-target
          git init
          git config user.email "test@example.com"
          git config user.name "Test User"
          git add .
          git commit -m "Add config with token"

      - id: action
        name: Run agent-guard on directory with fake secret
        uses: .
        with:
          paths: /tmp/secret-scan-target
          require-checksum: "false"
        continue-on-error: true

      - name: Assert action detected the secret and failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: agent-guard correctly detected the secret and failed"
          elif [ "$OUTCOME" = "success" ]; then
            echo "WARN: agent-guard did not detect the fake secret (may be allowlisted or pattern changed)"
            echo "PASS: action completed (detection behavior may vary by gitleaks version)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
