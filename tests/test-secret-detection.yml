name: Test secret detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AGENT_GUARD_GITLEAKS_BIN: /usr/local/bin/gitleaks
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install jq if missing
        run: |
          command -v jq > /dev/null 2>&1 || sudo apt-get install -y jq

      - name: Install mock gitleaks on PATH
        run: |
          set -euo pipefail
          sudo cp "$GITHUB_WORKSPACE/tests/fixtures/mock-gitleaks" /usr/local/bin/gitleaks
          sudo chmod +x /usr/local/bin/gitleaks
          echo "mock gitleaks installed at $(command -v gitleaks)"

      - name: Create a git repository containing a mock secret
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/secret-scan-target"
          printf 'API_KEY=AGENT_GUARD_TEST_SECRET\n' \
            > "$GITHUB_WORKSPACE/secret-scan-target/config.env"
          git -C "$GITHUB_WORKSPACE/secret-scan-target" init
          git -C "$GITHUB_WORKSPACE/secret-scan-target" config user.email "test@example.com"
          git -C "$GITHUB_WORKSPACE/secret-scan-target" config user.name "Test"
          git -C "$GITHUB_WORKSPACE/secret-scan-target" add .
          git -C "$GITHUB_WORKSPACE/secret-scan-target" commit -m "initial"

      - id: action
        uses: .
        continue-on-error: true
        with:
          paths: "${{ github.workspace }}/secret-scan-target"
          require-checksum: "false"

      - name: Assert action detected secrets and failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when secrets were detected"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have detected secrets and failed"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
