name: Test secret detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install fake gitleaks (always detects secrets)
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\n# Fake gitleaks: always exits 1 (secrets found)\necho "Finding: secret-like value detected" >&2\nexit 1\n' \
            > "$HOME/.local/bin/gitleaks"
          chmod +x "$HOME/.local/bin/gitleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Create directory with a secret-like file
        run: |
          mkdir -p /tmp/dirty-dir
          body="AGENT-GUARD-FIXTURE-NEVER-A-REAL-KEY"
          body="${body}-${body}-${body}-${body}"
          {
            printf '%s%s\n' '-----BEGIN RSA ' 'PRIVATE KEY-----'
            printf '%s\n' "$body"
            printf '%s%s\n' '-----END RSA ' 'PRIVATE KEY-----'
          } > /tmp/dirty-dir/key.pem

      - name: Run Agent Guard on dirty directory (expect failure)
        id: action
        uses: .
        with:
          paths: /tmp/dirty-dir
          require-checksum: "false"
        continue-on-error: true

      - name: Assert action failed (secret detected)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when a secret-like value is present"
            exit 1
          fi
          echo "PASS: action correctly detected secret-like value and failed"
