name: Test secret detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-install gitleaks
        run: |
          version="8.30.1"
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m)"
          case "$arch" in
            x86_64|amd64) arch="x64" ;;
            arm64|aarch64) arch="arm64" ;;
          esac
          archive="gitleaks_${version}_${os}_${arch}.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          tmp="$(mktemp -d)"
          curl -fsSL "$url" -o "$tmp/$archive"
          tar -xzf "$tmp/$archive" -C "$tmp"
          sudo mv "$tmp/gitleaks" /usr/local/bin/gitleaks
          sudo chmod +x /usr/local/bin/gitleaks
          gitleaks version

      - name: Verify fixture file with secrets exists
        run: |
          echo "Checking fixture file contents:"
          cat "$GITHUB_WORKSPACE/tests/fixtures/secret-dir/config.env"

      - id: action
        name: Run Agent Guard on directory with secrets (should fail)
        uses: .
        with:
          paths: tests/fixtures/secret-dir
          require-checksum: "false"
        continue-on-error: true

      - name: Assert action detected secrets and failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: Agent Guard correctly detected secrets and failed"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: Agent Guard should have detected secrets but succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
