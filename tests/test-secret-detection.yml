name: Test secret detection (action fails on secrets found)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a directory with a fake secret
        run: |
          mkdir -p /tmp/secret-scan-target
          git init /tmp/secret-scan-target
          git -C /tmp/secret-scan-target config user.email "test@example.com"
          git -C /tmp/secret-scan-target config user.name "Test"
          # Write a file containing a fake AWS access key (matches gitleaks default rules)
          # AKIAIOSFODNN7EXAMPLE is the AWS docs example key — it is in the allowlist,
          # so use a non-example key shape that gitleaks will flag.
          cat > /tmp/secret-scan-target/config.env << 'EOF'
          AWS_ACCESS_KEY_ID=AKIAIOSFODNN7REALKEY
          AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCYREALKEYHERE
          EOF
          git -C /tmp/secret-scan-target add .
          git -C /tmp/secret-scan-target commit -m "init"

      - id: action
        uses: .
        with:
          paths: /tmp/secret-scan-target
          require-checksum: "false"
        continue-on-error: true

      - name: Assert action failed (secrets detected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly detected secrets and failed"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have detected secrets but succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
