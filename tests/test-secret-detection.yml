name: Test secret detection blocks scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a directory with a fake private key (secret-like content)
        run: |
          mkdir -p /tmp/dirty-scan-target
          # Write a fake RSA private key that gitleaks will detect
          cat > /tmp/dirty-scan-target/key.pem << 'KEYEOF'
          -----BEGIN RSA PRIVATE KEY-----
          MIIEowIBAAKCAQEA2a2rwplBQLzHPZe5TNJT5sGNdSMPnFQMBLFPMHFMVBkFMHFM
          VBkFMHFMVBkFMHFMVBkFMHFMVBkFMHFMVBkFMHFMVBkFMHFMVBkFMHFMVBkFMH
          FMVBkFMHFMVBkFMHFMVBkFMHFMVBkFMHFMVBkFMHFMVBkFMHFMVBkFMHFMVBkF
          MHFMVBkFMHFMVBkFMHFMVBkFMHFMVBkFMHFMVBkFMHFMVBkFMHFMVBkFMHFMVB
          kFMHFMVBkFMHFMVBkFMHFMVBkFMHFMVBkFMHFMVBkFMHFMVBkFMHFMVBkFMHFM
          VBkFMHFMVBkFMHFMVBkFMHFMVBkFMHFMVBkFMHFMVBkFMHFMVBkFMHFMVBkFMH
          FMVBkFMHFMVBkFMHFMVBkFMHFMVBkFMHFMVBkFMHFMVBkFMHFMVBkFMHFMVBkF
          MHFMVBkFMHFMVBkFMHFMVBkFMHFMVBkFMHFMVBkFMHFMVBkFMHFMVBkFMHFMVB
          kFMHFMVBkFMHFMVBkFMHFMVBkFMHFMVBkFMHFMVBkFMHFMVBkFMHFMVBkFMHFM
          VBkFMHFMVBkFMHFMVBkFMHFMVBkFMHFMVBkFMHFMVBkFMHFMVBkFMHFMVBkFMH
          FMVBkFMHFMVBkFMHFMVBkFMHFMVBkFMHFMVBkFMHFMVBkFMHFMVBkFMHFMVBkF
          -----END RSA PRIVATE KEY-----
          KEYEOF

      - name: Install gitleaks (pre-install to avoid checksum requirement)
        run: |
          version="8.30.1"
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m)"
          case "$arch" in
            x86_64|amd64) arch="x64" ;;
            arm64|aarch64) arch="arm64" ;;
          esac
          archive="gitleaks_${version}_${os}_${arch}.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          tmp="$(mktemp -d)"
          curl -fsSL "$url" -o "$tmp/$archive"
          tar -xzf "$tmp/$archive" -C "$tmp"
          sudo mv "$tmp/gitleaks" /usr/local/bin/gitleaks
          sudo chmod +x /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Agent Guard on dirty directory (expect failure)
        id: action
        uses: .
        with:
          paths: /tmp/dirty-scan-target
          require-checksum: "false"
        continue-on-error: true

      - name: Assert action failed (secret detected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when a secret-like value is present, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: Agent Guard correctly detected secret-like content and failed"
