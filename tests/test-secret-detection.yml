name: Test secret detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mock gitleaks on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/mock-bin"
          cp "$GITHUB_WORKSPACE/tests/fixtures/mock-gitleaks" "$RUNNER_TEMP/mock-bin/gitleaks"
          chmod +x "$RUNNER_TEMP/mock-bin/gitleaks"
          echo "$RUNNER_TEMP/mock-bin" >> "$GITHUB_PATH"

      - name: Create a directory with a secret-like value
        run: |
          mkdir -p /tmp/dirty-scan-target
          # Write a file containing the mock-gitleaks trigger string
          echo "AGENT_GUARD_TEST_SECRET=supersecretvalue" > /tmp/dirty-scan-target/secret-fixture.txt

      - name: Run Agent Guard on directory with secret (expect failure)
        id: action
        uses: .
        with:
          paths: /tmp/dirty-scan-target
          require-checksum: "false"
        continue-on-error: true

      - name: Assert action failed (secret detected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when a secret-like value is present, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly detected secret-like value and failed"
