name: Test secret detection blocks scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-install mock gitleaks so the action skips the download step
        run: |
          mkdir -p "$RUNNER_TEMP/mock-bin"
          cp "$GITHUB_WORKSPACE/tests/fixtures/mock-gitleaks" "$RUNNER_TEMP/mock-bin/gitleaks"
          chmod +x "$RUNNER_TEMP/mock-bin/gitleaks"
          echo "$RUNNER_TEMP/mock-bin" >> "$GITHUB_PATH"

      - name: Create a directory with a secret-like file
        run: |
          mkdir -p /tmp/dirty-scan
          # The mock-gitleaks binary detects the string AGENT_GUARD_TEST_SECRET
          printf '%s\n' 'AGENT_GUARD_TEST_SECRET=supersecretvalue' > /tmp/dirty-scan/secrets.env

      - name: Run Agent Guard on dirty directory (expect failure)
        id: action
        uses: .
        with:
          paths: /tmp/dirty-scan
          require-checksum: "false"
        continue-on-error: true

      - name: Assert action failed due to secret detection
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when scanning directory with secret-like content, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when secret-like content was detected"
