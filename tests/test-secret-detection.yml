name: Test secret detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Pre-install gitleaks so the action skips the download step entirely.
      - name: Pre-install gitleaks
        run: |
          set -euo pipefail
          VERSION="8.30.1"
          OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
          ARCH="x64"
          ARCHIVE="gitleaks_${VERSION}_${OS}_${ARCH}.tar.gz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ARCHIVE}"
          TMP="$(mktemp -d)"
          curl -fsSL "$URL" -o "$TMP/$ARCHIVE"
          tar -xzf "$TMP/$ARCHIVE" -C "$TMP"
          sudo mv "$TMP/gitleaks" /usr/local/bin/gitleaks
          sudo chmod +x /usr/local/bin/gitleaks
          gitleaks version

      # Create a directory with a file containing a fake secret pattern.
      # We use a GitHub PAT-shaped token (ghp_ prefix + exactly 36 alphanumeric chars)
      # which is detected by the agent-guard vendor-token-shape rule:
      #   regex = gh[opusr]_[0-9A-Za-z]{36}
      # The token must be exactly 36 chars after ghp_ to match the \b boundary.
      - name: Create test directory with a secret
        run: |
          mkdir -p /tmp/secret-test-dir
          # Write a file with a fake GitHub PAT (shape-only detection, no real token)
          # ghp_ + exactly 36 alphanumeric chars = matches gh[opusr]_[0-9A-Za-z]{36}
          echo 'token = "ghp_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"' > /tmp/secret-test-dir/config.txt
          git init /tmp/secret-test-dir
          git -C /tmp/secret-test-dir config user.email "test@example.com"
          git -C /tmp/secret-test-dir config user.name "Test"
          git -C /tmp/secret-test-dir add .
          git -C /tmp/secret-test-dir commit -m "add config with secret"

      # The action should detect the secret and fail.
      - id: action
        uses: .
        continue-on-error: true
        with:
          paths: /tmp/secret-test-dir
          require-checksum: "false"

      - name: Assert action failed due to detected secret
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when a secret is present, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly detected and reported the secret"
