name: Test secret detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a directory with a fake secret
        run: |
          mkdir -p /tmp/secret-scan-target
          # Write a file containing a fake AWS access key pattern
          # AKIA followed by 16 uppercase alphanumeric chars is the AWS key shape
          # This is a synthetic key that matches the vendor-token-shape rule
          cat > /tmp/secret-scan-target/config.env << 'EOF'
          AWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE
          EOF
          # Note: AKIAIOSFODNN7EXAMPLE ends with EXAMPLE so it's in the allowlist
          # Use a non-example key shape to trigger detection
          cat > /tmp/secret-scan-target/leaked.env << 'EOF'
          AWS_ACCESS_KEY_ID=AKIAIOSFODNN7ABCDEFG
          AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          EOF

      - id: action
        name: Run Agent Guard on directory with secrets
        uses: .
        with:
          paths: /tmp/secret-scan-target
          require-checksum: "false"
        continue-on-error: true

      - name: Assert action detected secrets and failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: agent-guard correctly detected secrets and failed"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: agent-guard should have detected secrets but reported success"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
