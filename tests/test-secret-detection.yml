name: Test secret detection (action fails when secrets found)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.30.1
          OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64|amd64) ARCH="x64" ;;
            arm64|aarch64) ARCH="arm64" ;;
          esac
          ARCHIVE="gitleaks_${VERSION}_${OS}_${ARCH}.tar.gz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ARCHIVE}"
          TMP="$(mktemp -d)"
          curl -fsSL "$URL" -o "$TMP/$ARCHIVE"
          tar -xzf "$TMP/$ARCHIVE" -C "$TMP"
          sudo mv "$TMP/gitleaks" /usr/local/bin/gitleaks
          sudo chmod +x /usr/local/bin/gitleaks
          gitleaks version

      - name: Create a directory with a secret-like file
        run: |
          mkdir -p /tmp/dirty-scan-dir
          # Write a fake RSA private key (fixture pattern used by agent-guard smoke tests)
          BODY="AGENT-GUARD-FIXTURE-NEVER-A-REAL-KEY"
          BODY="${BODY}-${BODY}-${BODY}-${BODY}"
          {
            printf '%s%s\n' '-----BEGIN RSA ' 'PRIVATE KEY-----'
            printf '%s\n' "$BODY"
            printf '%s%s\n' '-----END RSA ' 'PRIVATE KEY-----'
          } > /tmp/dirty-scan-dir/key.pem

      - name: Run Agent Guard on directory with secrets (expect failure)
        id: action
        uses: .
        with:
          paths: /tmp/dirty-scan-dir
          require-checksum: "false"
        continue-on-error: true

      - name: Assert action failed (secrets detected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when secrets are detected, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when a secret-like value was detected"
