name: Test secret detection in dirty directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Pre-install the mock gitleaks so the action skips the download step.
      # The mock exits 1 when it finds AGENT_GUARD_TEST_SECRET in a file/directory.
      # Under act, $GITHUB_WORKSPACE is the action directory itself.
      - name: Install mock gitleaks
        run: |
          MOCK="$GITHUB_WORKSPACE/tests/fixtures/mock-gitleaks"
          if [ ! -f "$MOCK" ]; then
            # Fallback: try repo-root-relative path (real GitHub Actions runner)
            MOCK="$GITHUB_WORKSPACE/pristine/JeongJaeSoon--agent-guard/v1.3.7/tests/fixtures/mock-gitleaks"
          fi
          sudo cp "$MOCK" /usr/local/bin/gitleaks
          sudo chmod +x /usr/local/bin/gitleaks
          gitleaks version

      # Create a directory containing a file with a secret-like value
      - name: Create dirty test directory
        run: |
          mkdir -p /tmp/dirty-test
          echo "AGENT_GUARD_TEST_SECRET=supersecret123" > /tmp/dirty-test/secrets.env

      - name: Run Agent Guard on dirty directory (expect failure)
        id: action
        uses: .
        with:
          paths: /tmp/dirty-test
          require-checksum: "false"
        continue-on-error: true

      - name: Assert scan failed (exit 1 means secrets were detected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when secrets are present, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: Agent Guard correctly detected secrets and failed"
