name: Test secret detection blocks scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a directory containing a fake private key
        run: |
          mkdir -p /tmp/dirty-scan-dir
          # Write a fixture private key (same pattern as agent-guard smoke-test)
          BODY="AGENT-GUARD-FIXTURE-NEVER-A-REAL-KEY"
          BODY="${BODY}-${BODY}-${BODY}-${BODY}"
          {
            printf '%s%s\n' '-----BEGIN RSA ' 'PRIVATE KEY-----'
            printf '%s\n' "$BODY"
            printf '%s%s\n' '-----END RSA ' 'PRIVATE KEY-----'
          } > /tmp/dirty-scan-dir/key.pem

      - name: Install gitleaks for the test
        run: |
          VERSION=8.30.1
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64|amd64) ARCH="x64" ;;
            arm64|aarch64) ARCH="arm64" ;;
          esac
          ARCHIVE="gitleaks_${VERSION}_${OS}_${ARCH}.tar.gz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ARCHIVE}"
          TMP=$(mktemp -d)
          curl -fsSL "$URL" -o "$TMP/$ARCHIVE"
          tar -xzf "$TMP/$ARCHIVE" -C "$TMP"
          sudo mv "$TMP/gitleaks" /usr/local/bin/gitleaks
          sudo chmod +x /usr/local/bin/gitleaks
          gitleaks version

      - id: action
        name: Run agent-guard on dirty directory (expect failure)
        uses: .
        with:
          paths: /tmp/dirty-scan-dir
          require-checksum: "false"
        continue-on-error: true

      - name: Assert action failed due to secret detection
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when a secret-like value is present, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly detected and blocked the secret-like value"
