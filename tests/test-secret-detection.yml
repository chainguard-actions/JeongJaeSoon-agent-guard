name: Test secret detection (action fails on leaked secret)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare mock gitleaks
        run: |
          mkdir -p "$RUNNER_TEMP/mock-bin"
          cp "$GITHUB_WORKSPACE/tests/fixtures/mock-gitleaks.sh" "$RUNNER_TEMP/mock-bin/gitleaks"
          chmod +x "$RUNNER_TEMP/mock-bin/gitleaks"
          echo "$RUNNER_TEMP/mock-bin" >> "$GITHUB_PATH"

      - name: Create a directory with a fake secret
        run: |
          mkdir -p /tmp/secret-scan-target
          # Write a file containing the test secret pattern recognized by the mock.
          # AGENT_GUARD_TEST_SECRET is the pattern used by the action's own test fixtures.
          echo 'token = "AGENT_GUARD_TEST_SECRET"' > /tmp/secret-scan-target/config.txt
          cd /tmp/secret-scan-target
          git init
          git config user.email "test@example.com"
          git config user.name "Test User"
          git add .
          git commit -m "Add config with secret"

      - id: action
        name: Run Agent Guard on directory with secret
        uses: .
        with:
          paths: /tmp/secret-scan-target
          require-checksum: "false"
        env:
          AGENT_GUARD_GITLEAKS_BIN: ${{ runner.temp }}/mock-bin/gitleaks
        continue-on-error: true

      - name: Assert action failed (secret was detected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: Agent Guard correctly detected the secret and failed"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: Agent Guard should have detected the secret but succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
