name: Test secret detection blocks scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install gitleaks for testing
        run: |
          set -euo pipefail
          version="8.30.1"
          os="linux"
          arch="x64"
          archive="gitleaks_${version}_${os}_${arch}.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          tmp="$(mktemp -d)"
          curl -fsSL "$url" -o "$tmp/$archive"
          tar -xzf "$tmp/$archive" -C "$tmp"
          sudo mv "$tmp/gitleaks" /usr/local/bin/gitleaks
          sudo chmod +x /usr/local/bin/gitleaks
          gitleaks version

      - name: Create directory with a secret-like file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-dirty"
          # Write a fake RSA private key (fixture, not a real key)
          {
            printf '%s%s\n' '-----BEGIN RSA ' 'PRIVATE KEY-----'
            printf '%s\n' 'AGENT-GUARD-FIXTURE-NEVER-A-REAL-KEY-AGENT-GUARD-FIXTURE-NEVER-A-REAL-KEY-AGENT-GUARD-FIXTURE-NEVER-A-REAL-KEY-AGENT-GUARD-FIXTURE-NEVER-A-REAL-KEY'
            printf '%s%s\n' '-----END RSA ' 'PRIVATE KEY-----'
          } > "$GITHUB_WORKSPACE/test-dirty/key.pem"

      - id: action
        uses: .
        with:
          paths: "${{ github.workspace }}/test-dirty"
          require-checksum: "false"
        continue-on-error: true

      - name: Assert action failed (secret detected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when a secret-like value is present, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly detected secret-like value and failed"
