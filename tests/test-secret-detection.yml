name: Test secret detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create directory with a secret-like file
        run: |
          mkdir -p /tmp/dirty-scan-target
          # Write a fake RSA private key (same pattern as the smoke test)
          body="AGENT-GUARD-FIXTURE-NEVER-A-REAL-KEY"
          body="${body}-${body}-${body}-${body}"
          {
            printf '%s%s\n' '-----BEGIN RSA ' 'PRIVATE KEY-----'
            printf '%s\n' "$body"
            printf '%s%s\n' '-----END RSA ' 'PRIVATE KEY-----'
          } > /tmp/dirty-scan-target/key.pem

      - name: Run Agent Guard on dirty directory (should fail)
        id: action
        uses: .
        with:
          paths: /tmp/dirty-scan-target
          require-checksum: "false"
        continue-on-error: true

      - name: Assert action failed due to secret detection
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when scanning a directory with a secret-like file"
            exit 1
          fi
          echo "PASS: action correctly detected secret-like content and failed"
