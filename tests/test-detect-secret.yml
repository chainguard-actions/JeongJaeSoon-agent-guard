name: Test secret is detected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Resolve gitleaks checksum
        id: sum
        run: |
          set -euo pipefail
          version=8.30.1
          arch="$(uname -m)"
          case "$arch" in
            x86_64|amd64) arch=x64 ;;
            arm64|aarch64) arch=arm64 ;;
          esac
          archive="gitleaks_${version}_linux_${arch}.tar.gz"
          sum="$(curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_checksums.txt" | awk -v a="$archive" '$2 == a {print $1; exit}')"
          echo "checksum: $sum"
          [ -n "$sum" ] || { echo "FAIL: could not resolve checksum"; exit 1; }
          echo "checksum=$sum" >> "$GITHUB_OUTPUT"
      - name: Create directory containing a fake secret
        run: |
          mkdir -p ag-leaky
          # Generate realistic-looking tokens at runtime so nothing is committed.
          rand() { LC_ALL=C tr -dc "$1" < /dev/urandom | head -c "$2"; }
          ghp="ghp_$(rand 'A-Za-z0-9' 36)"
          aws="AKIA$(rand 'A-Z2-7' 16)"
          {
            echo "GITHUB_TOKEN=${ghp}"
            echo "aws_access_key_id = ${aws}"
          } > ag-leaky/config.env
          echo "Wrote fake secrets to ag-leaky/config.env"
      - id: action
        uses: .
        continue-on-error: true
        with:
          paths: ag-leaky
          gitleaks-checksum: ${{ steps.sum.outputs.checksum }}
      - name: Assert scan failed because of the secret
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if ! command -v gitleaks >/dev/null; then
            echo "FAIL: gitleaks not installed, failure was not from the scan"
            exit 1
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the scan to fail on a leaked secret"
            exit 1
          fi
          echo "PASS"
