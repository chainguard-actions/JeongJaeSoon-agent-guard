name: Test leaked secret fails the scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Resolve gitleaks checksum
        id: sum
        shell: bash
        run: |
          set -euo pipefail
          v=8.30.1
          case "$(uname -m)" in
            x86_64|amd64) a=x64 ;;
            arm64|aarch64) a=arm64 ;;
          esac
          sum=$(curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_checksums.txt" \
            | awk -v f="gitleaks_${v}_linux_${a}.tar.gz" '$2==f{print $1}')
          [ -n "$sum" ] || { echo "could not resolve checksum"; exit 1; }
          echo "checksum=$sum" >> "$GITHUB_OUTPUT"
      - name: Create scan targets
        shell: bash
        run: |
          mkdir -p scan-target/clean scan-target/leaky
          printf 'nothing to see here\n' > scan-target/clean/app.txt
          # Build the fake token at runtime so no token shape is committed.
          prefix="gh""p_"
          token="${prefix}R7kQ2mZx9VbN4pLs8TfW1yHc6JdG3eUa5XoK"
          printf 'const t = "%s";\n' "$token" > scan-target/leaky/config.js
      - name: Control run on clean path (also installs gitleaks)
        id: clean
        uses: .
        with:
          paths: scan-target/clean
          gitleaks-checksum: ${{ steps.sum.outputs.checksum }}
      - id: action
        uses: .
        continue-on-error: true
        with:
          paths: scan-target/leaky
          gitleaks-checksum: ${{ steps.sum.outputs.checksum }}
      - name: Assert clean passed and leak failed
        env:
          CLEAN: ${{ steps.clean.outcome }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "clean outcome: $CLEAN"
          echo "leak outcome: $OUTCOME"
          if [ "$CLEAN" != "success" ]; then
            echo "FAIL: clean control scan should succeed"
            exit 1
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected leak scan to fail"
            exit 1
          fi
          echo "PASS"
