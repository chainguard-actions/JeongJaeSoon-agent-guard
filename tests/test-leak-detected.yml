name: Test leaked secret fails the scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install gitleaks via action on a clean path first (sanity)
        id: clean
        uses: .
        with:
          paths: tests/fixtures/clean
          require-checksum: "false"
      - name: Create a file containing a synthetic secret
        run: |
          mkdir -p "$GITHUB_WORKSPACE/leak-dir"
          # Build the synthetic GitHub PAT at runtime so no secret is committed.
          rand="$(head -c 512 /dev/urandom | tr -dc 'A-Za-z0-9' | head -c 36)"
          prefix="gh""p_"
          printf 'GITHUB_TOKEN=%s%s\n' "$prefix" "$rand" > "$GITHUB_WORKSPACE/leak-dir/config.env"
          # Also a private key header block for good measure
          {
            echo "-----BEGIN RSA PRIVATE""-----"
            head -c 600 /dev/urandom | base64 -w 64
            echo "-----END RSA PRIVATE""-----"
          } > "$GITHUB_WORKSPACE/leak-dir/id_rsa"
          ls -la "$GITHUB_WORKSPACE/leak-dir"
      - id: action
        uses: .
        continue-on-error: true
        with:
          paths: leak-dir
          require-checksum: "false"
      - name: Assert clean scan passed and leak scan failed
        env:
          CLEAN: ${{ steps.clean.outcome }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "clean outcome: $CLEAN"
          echo "leak outcome: $OUTCOME"
          if [ "$CLEAN" != "success" ]; then
            echo "FAIL: clean scan should succeed"
            exit 1
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the scan to fail on a leaked secret"
            exit 1
          fi
          echo "PASS"
