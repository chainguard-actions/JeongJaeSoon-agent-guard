name: Test multiple clean paths with require-checksum false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create clean scan targets
        run: |
          mkdir -p target-a target-b
          echo "alpha" > target-a/one.txt
          echo "beta" > target-b/two.md
      - id: action
        uses: .
        with:
          paths: "target-a target-b"
          require-checksum: "false"
      - name: Assert success
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          command -v gitleaks >/dev/null || { echo "FAIL: gitleaks missing"; exit 1; }
          echo "PASS"
