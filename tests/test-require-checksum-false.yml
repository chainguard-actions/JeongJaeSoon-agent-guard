name: Test install without checksum when require-checksum is false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create clean scan targets
        run: |
          mkdir -p "$GITHUB_WORKSPACE/ag-nochk-a" "$GITHUB_WORKSPACE/ag-nochk-b"
          printf 'first harmless file\n' > "$GITHUB_WORKSPACE/ag-nochk-a/one.txt"
          printf 'second harmless file\n' > "$GITHUB_WORKSPACE/ag-nochk-b/two.txt"
      - id: action
        uses: .
        with:
          paths: ag-nochk-a ag-nochk-b
          require-checksum: "false"
      - name: Assert success and gitleaks installed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if ! command -v gitleaks >/dev/null; then
            echo "FAIL: gitleaks not on PATH"
            exit 1
          fi
          gitleaks version
          echo "PASS"
      - name: Cleanup
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/ag-nochk-a" "$GITHUB_WORKSPACE/ag-nochk-b"
