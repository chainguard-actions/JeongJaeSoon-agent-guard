name: Test require-checksum=false allows install without checksum
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a clean directory to scan
        run: |
          mkdir -p /tmp/no-checksum-scan-target
          echo "# No secrets here" > /tmp/no-checksum-scan-target/README.md

      - id: action
        uses: .
        with:
          paths: /tmp/no-checksum-scan-target
          require-checksum: "false"
          # No gitleaks-checksum provided — should succeed because require-checksum=false
          # The action will either use a pre-installed gitleaks or download it without
          # checksum verification (since require-checksum=false)

      - name: Assert action succeeded without checksum
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with require-checksum=false and no checksum provided"
          else
            echo "FAIL: expected success but got '$OUTCOME'"
            exit 1
          fi
