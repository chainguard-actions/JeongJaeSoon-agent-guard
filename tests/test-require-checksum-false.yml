name: Test require-checksum false allows scan without checksum
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Agent Guard with require-checksum=false
        id: action
        uses: .
        with:
          paths: "."
          gitleaks-version: "8.30.1"
          require-checksum: "false"
          # No checksum provided; require-checksum=false allows this

      - name: Assert action succeeded without checksum
        run: |
          echo "PASS: Agent Guard completed successfully with require-checksum=false and no checksum"
