name: Test require-checksum false allows scan without checksum
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a clean directory to scan
        run: |
          mkdir -p /tmp/no-checksum-scan-target
          echo "export const greeting = 'hello';" > /tmp/no-checksum-scan-target/index.js

      - name: Run Agent Guard with require-checksum=false and no checksum
        id: action
        uses: .
        with:
          paths: /tmp/no-checksum-scan-target
          gitleaks-checksum: ""
          require-checksum: "false"

      - name: Assert action succeeded without providing a checksum
        run: |
          echo "PASS: action completed successfully with require-checksum=false and no checksum provided"
