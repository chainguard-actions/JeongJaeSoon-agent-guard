name: Test require-checksum=false allows scan without checksum
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a clean directory to scan
        run: |
          mkdir -p /tmp/no-checksum-scan-target
          echo "# Safe file" > /tmp/no-checksum-scan-target/README.md
          echo "x = 1 + 1" > /tmp/no-checksum-scan-target/math.py

      - name: Install gitleaks (pre-install to avoid network download in action)
        run: |
          version="8.30.1"
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m)"
          case "$arch" in
            x86_64|amd64) arch="x64" ;;
            arm64|aarch64) arch="arm64" ;;
          esac
          archive="gitleaks_${version}_${os}_${arch}.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          tmp="$(mktemp -d)"
          curl -fsSL "$url" -o "$tmp/$archive"
          tar -xzf "$tmp/$archive" -C "$tmp"
          sudo mv "$tmp/gitleaks" /usr/local/bin/gitleaks
          sudo chmod +x /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Agent Guard with require-checksum=false and no checksum
        id: action
        uses: .
        with:
          paths: /tmp/no-checksum-scan-target
          require-checksum: "false"
          gitleaks-checksum: ""

      - name: Assert action succeeded (require-checksum=false allows missing checksum)
        run: |
          echo "PASS: Agent Guard completed successfully with require-checksum=false and no checksum"
