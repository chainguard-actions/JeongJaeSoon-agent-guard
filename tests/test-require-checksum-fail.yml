name: Test require-checksum enforcement
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Ensure gitleaks is NOT on PATH so the install step runs
      - name: Verify gitleaks is absent
        run: |
          if command -v gitleaks > /dev/null 2>&1; then
            echo "SKIP: gitleaks already installed, cannot test require-checksum enforcement"
            exit 0
          fi
          echo "gitleaks not found — install step will run"

      - name: Run Agent Guard without checksum (should fail)
        id: action
        uses: .
        with:
          paths: "."
          require-checksum: "true"
          gitleaks-checksum: ""
        continue-on-error: true

      - name: Assert action failed due to missing checksum
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when require-checksum=true and no checksum provided"
            exit 1
          fi
          echo "PASS: action correctly failed when checksum was missing"
