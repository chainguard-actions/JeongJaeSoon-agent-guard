name: Test scan workspace default path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AGENT_GUARD_GITLEAKS_BIN: /usr/local/bin/gitleaks
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install jq if missing
        run: |
          command -v jq > /dev/null 2>&1 || sudo apt-get install -y jq

      - name: Install mock gitleaks on PATH
        run: |
          set -euo pipefail
          sudo cp "$GITHUB_WORKSPACE/tests/fixtures/mock-gitleaks" /usr/local/bin/gitleaks
          sudo chmod +x /usr/local/bin/gitleaks
          echo "mock gitleaks installed at $(command -v gitleaks)"

      - name: Create a clean workspace subdirectory to scan
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/workspace-scan-target"
          echo "# Workspace scan test" > "$GITHUB_WORKSPACE/workspace-scan-target/README.md"
          echo "version: 1.0.0" > "$GITHUB_WORKSPACE/workspace-scan-target/config.yaml"
          git -C "$GITHUB_WORKSPACE/workspace-scan-target" init
          git -C "$GITHUB_WORKSPACE/workspace-scan-target" config user.email "test@example.com"
          git -C "$GITHUB_WORKSPACE/workspace-scan-target" config user.name "Test"
          git -C "$GITHUB_WORKSPACE/workspace-scan-target" add .
          git -C "$GITHUB_WORKSPACE/workspace-scan-target" commit -m "initial"

      - id: action
        uses: .
        with:
          paths: "${{ github.workspace }}/workspace-scan-target"
          require-checksum: "false"

      - name: Assert action succeeded scanning workspace subdirectory
        run: |
          echo "Action completed successfully - workspace scan found no secrets"
          echo "PASS"
