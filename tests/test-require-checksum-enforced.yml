name: Test require-checksum enforcement
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure gitleaks is absent so checksum enforcement is exercised
        run: |
          # Remove gitleaks from all common locations so the action's install
          # step runs and the require-checksum guard is triggered.
          for loc in /usr/local/bin /usr/bin /bin /usr/local/sbin /usr/sbin; do
            if [ -f "$loc/gitleaks" ]; then
              sudo rm -f "$loc/gitleaks"
              echo "Removed gitleaks from $loc"
            fi
          done
          # Also remove from RUNNER_TEMP if present from a prior step
          if [ -n "${RUNNER_TEMP:-}" ] && [ -f "$RUNNER_TEMP/agent-guard-bin/gitleaks" ]; then
            rm -f "$RUNNER_TEMP/agent-guard-bin/gitleaks"
          fi
          if command -v gitleaks > /dev/null 2>&1; then
            echo "WARNING: gitleaks still found at $(command -v gitleaks) — test may not exercise checksum guard"
          else
            echo "gitleaks not on PATH — checksum enforcement will be tested"
          fi

      - name: Run Agent Guard without checksum (expect failure)
        id: action
        uses: .
        with:
          paths: /tmp
          require-checksum: "true"
          gitleaks-checksum: ""
        continue-on-error: true

      - name: Assert action failed due to missing checksum
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when require-checksum=true and no checksum provided"
            exit 1
          fi
          echo "PASS: action correctly enforced checksum requirement"
