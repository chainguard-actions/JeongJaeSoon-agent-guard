name: Test require-checksum enforcement
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure gitleaks is NOT on PATH
        run: |
          # Verify gitleaks is not pre-installed (if it is, skip this test gracefully)
          if command -v gitleaks > /dev/null 2>&1; then
            echo "gitleaks is already installed at $(command -v gitleaks)"
            echo "SKIP: cannot test require-checksum enforcement when gitleaks is pre-installed"
            echo "skip=true" >> "$GITHUB_ENV"
          else
            echo "gitleaks not found — proceeding with require-checksum test"
            echo "skip=false" >> "$GITHUB_ENV"
          fi

      - name: Run action without checksum (expect failure when gitleaks not installed)
        id: action
        uses: .
        with:
          paths: "."
          require-checksum: "true"
          gitleaks-checksum: ""
        continue-on-error: true
        if: env.skip == 'false'

      - name: Assert action failed due to missing checksum
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SKIP: ${{ env.skip }}
        run: |
          if [ "$SKIP" = "true" ]; then
            echo "SKIP: gitleaks was pre-installed, skipping require-checksum enforcement test"
            exit 0
          fi
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when require-checksum=true and no checksum provided, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when require-checksum=true and gitleaks-checksum is empty"
