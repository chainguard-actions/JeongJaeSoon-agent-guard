name: Test require-checksum enforcement
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-install gitleaks so the checksum step is reached
        run: |
          # Remove gitleaks if present so the action tries to install it
          # and hits the checksum enforcement gate
          sudo rm -f "$(command -v gitleaks 2>/dev/null)" || true

      - name: Run Agent Guard without checksum (expect failure due to require-checksum=true)
        id: action
        uses: .
        with:
          paths: "."
          gitleaks-checksum: ""
          require-checksum: "true"
        continue-on-error: true

      - name: Assert action failed due to missing checksum
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when gitleaks-checksum is empty and require-checksum=true, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly enforced checksum requirement"
