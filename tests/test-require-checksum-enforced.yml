name: Test require-checksum enforcement
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Ensure gitleaks is NOT available so the action attempts to install it
      # and hits the checksum enforcement check.
      - name: Ensure gitleaks is not pre-installed
        run: |
          # Remove gitleaks from common locations if present
          sudo rm -f /usr/local/bin/gitleaks /usr/bin/gitleaks || true
          # Verify it's gone
          if command -v gitleaks > /dev/null 2>&1; then
            echo "WARNING: gitleaks still found at $(command -v gitleaks), test may not exercise checksum enforcement"
          else
            echo "gitleaks not found — checksum enforcement will be triggered"
          fi

      # When require-checksum=true (default) and no gitleaks-checksum is given,
      # the action must fail with a clear error message.
      - id: action
        uses: .
        continue-on-error: true
        with:
          require-checksum: "true"
          # gitleaks-checksum intentionally omitted

      - name: Assert action failed due to missing checksum
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when require-checksum=true and no checksum provided, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when checksum was missing"
