name: Test require-checksum enforcement
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Do NOT pre-install gitleaks so the action tries to install it.
      # With require-checksum=true (default) and no checksum provided,
      # the action must fail before attempting any download.

      - name: Run Agent Guard without checksum (expect failure)
        id: action
        uses: .
        with:
          paths: "."
          require-checksum: "true"
        continue-on-error: true

      - name: Assert action failed due to missing checksum
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when require-checksum=true and no checksum provided, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly enforced require-checksum=true"
