name: Test require-checksum enforcement
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure gitleaks is NOT on PATH (simulate fresh environment)
        run: |
          # Remove any pre-existing gitleaks from PATH by creating a wrapper
          # that shadows it with a non-existent binary name check
          # We verify gitleaks is absent; if it is present we skip this test
          if command -v gitleaks > /dev/null 2>&1; then
            echo "gitleaks already installed; skipping require-checksum test"
            echo "SKIP=true" >> "$GITHUB_ENV"
          else
            echo "gitleaks not found; proceeding with require-checksum test"
            echo "SKIP=false" >> "$GITHUB_ENV"
          fi

      - name: Run Agent Guard without checksum (expect failure due to require-checksum=true)
        id: action
        if: env.SKIP == 'false'
        uses: .
        with:
          paths: "."
          require-checksum: "true"
          gitleaks-checksum: ""
        continue-on-error: true

      - name: Assert action failed due to missing checksum
        if: env.SKIP == 'false'
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when require-checksum=true and no checksum provided, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when checksum was required but not provided"

      - name: Skip notice
        if: env.SKIP == 'true'
        run: |
          echo "Skipped: gitleaks was already installed in this environment"
          echo "PASS (skipped)"
