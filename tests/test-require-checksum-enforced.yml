name: Test require-checksum enforcement
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Remove gitleaks from PATH if present (simulate missing gitleaks)
        run: |
          # Hide gitleaks so the action must install it
          if command -v gitleaks > /dev/null 2>&1; then
            sudo mv "$(command -v gitleaks)" /tmp/gitleaks-backup || true
          fi
          echo "gitleaks available: $(command -v gitleaks || echo 'no')"

      - name: Run Agent Guard without checksum (require-checksum=true by default, expect failure)
        id: action
        uses: .
        with:
          paths: /tmp
          gitleaks-checksum: ""
          require-checksum: "true"
        continue-on-error: true

      - name: Restore gitleaks if we moved it
        if: always()
        run: |
          if [ -f /tmp/gitleaks-backup ]; then
            sudo mv /tmp/gitleaks-backup "$(dirname $(which ls))/gitleaks" || true
          fi

      - name: Assert action failed due to missing checksum
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when gitleaks-checksum is empty and require-checksum=true, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when checksum was required but not provided"
