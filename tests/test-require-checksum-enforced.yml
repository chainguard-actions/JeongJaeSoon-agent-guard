name: Test require-checksum enforcement
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Remove gitleaks if present so install path is exercised
        run: |
          # Temporarily hide gitleaks from PATH so the install step runs
          if command -v gitleaks > /dev/null 2>&1; then
            sudo mv "$(command -v gitleaks)" /tmp/gitleaks-backup || true
          fi

      - name: Run Agent Guard with require-checksum=true and no checksum
        id: scan
        uses: .
        with:
          paths: "."
          require-checksum: "true"
          gitleaks-checksum: ""
        continue-on-error: true

      - name: Restore gitleaks if it was moved
        if: always()
        run: |
          if [ -f /tmp/gitleaks-backup ]; then
            sudo mv /tmp/gitleaks-backup "$(dirname $(which git))/gitleaks" || true
          fi

      - name: Assert action failed due to missing checksum
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: Agent Guard correctly failed when checksum was required but not provided"
          elif [ "$OUTCOME" = "success" ]; then
            echo "INFO: gitleaks was already installed, checksum check was skipped (acceptable)"
            echo "PASS"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
