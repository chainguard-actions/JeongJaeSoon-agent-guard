name: Test require-checksum enforcement
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Hide gitleaks from PATH
        run: |
          # Move any installed gitleaks binaries so the action must attempt to install
          for loc in /usr/local/bin/gitleaks /usr/bin/gitleaks /opt/homebrew/bin/gitleaks "$HOME/.local/bin/gitleaks" "$RUNNER_TEMP/agent-guard-bin/gitleaks"; do
            if [ -f "$loc" ]; then
              sudo mv "$loc" "${loc}.hidden" 2>/dev/null || mv "$loc" "${loc}.hidden" 2>/dev/null || true
              echo "Hid gitleaks at: $loc"
            fi
          done
          # Verify gitleaks is not accessible
          if command -v gitleaks > /dev/null 2>&1; then
            echo "WARNING: gitleaks still found at $(command -v gitleaks) - test may not work as expected"
          else
            echo "gitleaks successfully hidden from PATH"
          fi

      - name: Run Agent Guard without checksum (expect failure)
        id: action
        uses: .
        with:
          paths: /tmp
          require-checksum: "true"
          gitleaks-checksum: ""
        continue-on-error: true

      - name: Restore gitleaks if it was hidden
        if: always()
        run: |
          for loc in /usr/local/bin/gitleaks /usr/bin/gitleaks /opt/homebrew/bin/gitleaks "$HOME/.local/bin/gitleaks" "$RUNNER_TEMP/agent-guard-bin/gitleaks"; do
            if [ -f "${loc}.hidden" ]; then
              sudo mv "${loc}.hidden" "$loc" 2>/dev/null || mv "${loc}.hidden" "$loc" 2>/dev/null || true
              echo "Restored gitleaks at: $loc"
            fi
          done

      - name: Assert action failed due to missing checksum
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when require-checksum=true and no checksum provided, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when checksum was required but not provided"
