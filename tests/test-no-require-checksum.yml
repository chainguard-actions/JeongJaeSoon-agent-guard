name: Test install without checksum when require-checksum=false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create clean directory
        run: |
          mkdir -p ag-norequire
          echo "nothing to see" > ag-norequire/a.txt
      - id: action
        uses: .
        with:
          paths: ag-norequire
          require-checksum: "false"
      - name: Assert success and gitleaks installed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if ! command -v gitleaks >/dev/null; then
            echo "FAIL: gitleaks not on PATH"
            exit 1
          fi
          gitleaks version
          echo "PASS"
