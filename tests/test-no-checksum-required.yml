name: Test require-checksum false installs without checksum
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create clean directory
        run: |
          mkdir -p ag-clean
          printf 'just some text\n' > ag-clean/notes.md
          git add ag-clean || true
      - id: action
        uses: .
        with:
          paths: ag-clean
          require-checksum: "false"
      - name: Assert success
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          command -v gitleaks || { echo "FAIL: gitleaks missing"; exit 1; }
          echo "PASS"
