name: Test custom gitleaks config-path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Resolve gitleaks checksum
        id: sum
        run: |
          set -euo pipefail
          v=8.30.1
          arch="$(uname -m)"
          case "$arch" in x86_64|amd64) arch=x64 ;; arm64|aarch64) arch=arm64 ;; esac
          sum="$(curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_checksums.txt" \
            | awk -v a="gitleaks_${v}_linux_${arch}.tar.gz" '$2==a{print $1}')"
          [ -n "$sum" ] || { echo "FAIL: could not resolve checksum"; exit 1; }
          echo "checksum=$sum" >> "$GITHUB_OUTPUT"
      - name: Write custom config and targets
        run: |
          set -euo pipefail
          mkdir -p agent-guard-custom/hit agent-guard-custom/miss
          cat > agent-guard-custom/gitleaks.toml <<'EOF'
          title = "custom-test"

          [[rules]]
          id = "custom-agtest-token"
          description = "Custom test token"
          regex = '''AGTEST-[0-9]{12}'''
          keywords = ["agtest-"]
          EOF
          printf 'value = AGTEST-%s\n' "839201746512" > agent-guard-custom/hit/token.txt
          printf 'just a normal file\n' > agent-guard-custom/miss/readme.txt
          cat agent-guard-custom/gitleaks.toml
      - id: hit
        uses: .
        continue-on-error: true
        with:
          paths: agent-guard-custom/hit
          gitleaks-checksum: ${{ steps.sum.outputs.checksum }}
          config-path: ${{ github.workspace }}/agent-guard-custom/gitleaks.toml
      - id: miss
        uses: .
        with:
          paths: agent-guard-custom/miss
          gitleaks-checksum: ${{ steps.sum.outputs.checksum }}
          config-path: ${{ github.workspace }}/agent-guard-custom/gitleaks.toml
      - name: Assert custom rule applied
        env:
          HIT: ${{ steps.hit.outcome }}
          MISS: ${{ steps.miss.outcome }}
        run: |
          echo "hit outcome: $HIT"
          echo "miss outcome: $MISS"
          if [ "$HIT" != "failure" ]; then
            echo "FAIL: custom rule should have flagged AGTEST token"
            exit 1
          fi
          if [ "$MISS" != "success" ]; then
            echo "FAIL: clean dir should pass with custom config"
            exit 1
          fi
          echo "PASS"
