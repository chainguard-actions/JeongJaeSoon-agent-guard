name: Test custom gitleaks config-path is honored
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create scan target matching only the custom rule
        run: |
          rm -rf scan-custom
          mkdir -p scan-custom
          printf 'value = AGTEST_ABCDEFGHIJKLMNOPQRSTUVWX\n' > scan-custom/data.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          paths: scan-custom
          require-checksum: "false"
          config-path: ${{ github.workspace }}/tests/fixtures/custom-gitleaks.toml
      - name: Assert custom rule triggered a failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the custom rule to detect the synthetic token"
            exit 1
          fi
          echo "PASS"
