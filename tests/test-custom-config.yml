name: Test custom gitleaks config path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a clean directory to scan
        run: |
          mkdir -p /tmp/custom-config-scan
          echo "# Test project" > /tmp/custom-config-scan/README.md
          echo "debug: false" > /tmp/custom-config-scan/settings.yaml
          cd /tmp/custom-config-scan
          git init
          git config user.email "test@example.com"
          git config user.name "Test User"
          git add .
          git commit -m "Initial commit"

      - id: action
        name: Run agent-guard with explicit bundled config path
        uses: .
        with:
          paths: /tmp/custom-config-scan
          require-checksum: "false"
          config-path: ${{ github.workspace }}/plugins/agent-guard/config/gitleaks.toml

      - name: Assert action succeeded with custom config
        run: |
          echo "PASS: agent-guard completed successfully with explicit config path"
