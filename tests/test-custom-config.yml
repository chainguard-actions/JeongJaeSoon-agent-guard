name: Test custom gitleaks config path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-install gitleaks so the action skips the download step
        run: |
          set -euo pipefail
          VERSION="8.30.1"
          OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64|amd64) ARCH="x64" ;;
            arm64|aarch64) ARCH="arm64" ;;
          esac
          ARCHIVE="gitleaks_${VERSION}_${OS}_${ARCH}.tar.gz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ARCHIVE}"
          TMP="$(mktemp -d)"
          curl -fsSL "$URL" -o "$TMP/$ARCHIVE"
          tar -xzf "$TMP/$ARCHIVE" -C "$TMP"
          sudo mv "$TMP/gitleaks" /usr/local/bin/gitleaks
          sudo chmod +x /usr/local/bin/gitleaks
          gitleaks version

      - name: Create a minimal custom gitleaks config
        run: |
          mkdir -p /tmp/custom-config
          cat > /tmp/custom-config/gitleaks.toml << 'EOF'
          title = "custom-test-config"

          [extend]
          useDefault = true
          EOF

      - name: Create a clean directory to scan
        run: |
          mkdir -p /tmp/custom-config-scan-target
          echo "# Test file with no secrets" > /tmp/custom-config-scan-target/README.md

      - id: action
        uses: .
        with:
          paths: /tmp/custom-config-scan-target
          config-path: /tmp/custom-config/gitleaks.toml
          require-checksum: "false"

      - name: Assert scan completed successfully with custom config
        run: |
          echo "PASS: action completed successfully using custom gitleaks config"
