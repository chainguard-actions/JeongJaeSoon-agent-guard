name: Test custom gitleaks config path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a clean directory and a minimal custom gitleaks config
        run: |
          mkdir -p /tmp/custom-config-scan
          echo "# Safe content only" > /tmp/custom-config-scan/notes.txt
          echo "name: my-project" > /tmp/custom-config-scan/package.json

          # Write a minimal custom gitleaks config that extends the default ruleset
          cat > /tmp/custom-gitleaks.toml << 'EOF'
          title = "custom-agent-guard-test"
          [extend]
          useDefault = true
          EOF

      - name: Run Agent Guard with explicit custom config path
        id: action
        uses: .
        with:
          paths: /tmp/custom-config-scan
          config-path: /tmp/custom-gitleaks.toml
          require-checksum: "false"

      - name: Assert action succeeded with custom config
        run: |
          echo "PASS: action completed successfully using explicit custom config path"
