name: Test custom gitleaks config-path is honored
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create custom config and target
        run: |
          set -euo pipefail
          mkdir -p ag-custom-cfg ag-scan-custom
          cat > ag-custom-cfg/gitleaks.toml <<'EOF'
          title = "custom-test"

          [[rules]]
          id = "custom-marker"
          description = "Custom test marker"
          regex = '''AGTESTMARKER_[0-9]{8}'''
          keywords = ["agtestmarker_"]
          EOF
          printf 'value: AGTESTMARKER_12345678\n' > ag-scan-custom/data.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          paths: ag-scan-custom
          require-checksum: "false"
          config-path: ag-custom-cfg/gitleaks.toml
      - name: Assert custom rule caused failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected custom rule to flag the marker"
            exit 1
          fi
          if ! command -v gitleaks >/dev/null; then
            echo "FAIL: gitleaks not installed; failure not due to detection"
            exit 1
          fi
          echo "PASS"
