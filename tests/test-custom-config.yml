name: Test custom config path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Install a mock gitleaks that always exits 0 (no findings)
      - name: Install mock gitleaks
        run: |
          mkdir -p "$RUNNER_TEMP/mock-bin"
          cat > "$RUNNER_TEMP/mock-bin/gitleaks" << 'EOF'
          #!/usr/bin/env sh
          # Mock gitleaks: always reports clean
          case "${1:-}" in
            version) printf 'v8.30.1\n'; exit 0 ;;
            dir)     exit 0 ;;
            stdin)   exit 0 ;;
            *)       exit 0 ;;
          esac
          EOF
          chmod +x "$RUNNER_TEMP/mock-bin/gitleaks"
          echo "$RUNNER_TEMP/mock-bin" >> "$GITHUB_PATH"

      - name: Create custom gitleaks config
        run: |
          mkdir -p /tmp/custom-config
          cat > /tmp/custom-config/gitleaks.toml << 'EOF'
          title = "custom-test-config"

          [extend]
          useDefault = true

          [[allowlists]]
          description = "Allow test placeholders"
          regexes = [
            '''(?i)test[_-]?(token|key|secret)'''
          ]
          EOF

      - name: Create clean scan target
        run: |
          mkdir -p /tmp/clean-target
          echo "# Clean project" > /tmp/clean-target/README.md

      - name: Run Agent Guard with custom config
        id: action
        uses: .
        with:
          paths: /tmp/clean-target
          config-path: /tmp/custom-config/gitleaks.toml
          require-checksum: "false"

      - name: Assert action succeeded with custom config
        run: |
          echo "Action completed successfully with custom config"
          echo "PASS"
