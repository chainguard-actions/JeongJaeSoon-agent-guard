name: Test custom gitleaks config path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a custom gitleaks config that extends default
        run: |
          mkdir -p /tmp/custom-config
          cat > /tmp/custom-config/gitleaks.toml << 'TOMLEOF'
          title = "custom-agent-guard-test"

          [extend]
          useDefault = true

          [[allowlists]]
          description = "Allow all test patterns"
          regexes = [
            '''(?i)test[_-]?(token|key|secret|password)'''
          ]
          TOMLEOF

      - name: Create a clean directory to scan
        run: |
          mkdir -p /tmp/custom-config-scan-target
          echo "# Test file" > /tmp/custom-config-scan-target/README.md
          echo "export TEST_KEY=test-value" > /tmp/custom-config-scan-target/config.sh

      - name: Install gitleaks (pre-install to avoid checksum requirement)
        run: |
          version="8.30.1"
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m)"
          case "$arch" in
            x86_64|amd64) arch="x64" ;;
            arm64|aarch64) arch="arm64" ;;
          esac
          archive="gitleaks_${version}_${os}_${arch}.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          tmp="$(mktemp -d)"
          curl -fsSL "$url" -o "$tmp/$archive"
          tar -xzf "$tmp/$archive" -C "$tmp"
          sudo mv "$tmp/gitleaks" /usr/local/bin/gitleaks
          sudo chmod +x /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Agent Guard with custom config path
        id: action
        uses: .
        with:
          paths: /tmp/custom-config-scan-target
          config-path: /tmp/custom-config/gitleaks.toml
          require-checksum: "false"

      - name: Assert action succeeded with custom config
        run: |
          echo "PASS: Agent Guard completed successfully with custom gitleaks config"
