name: Test custom gitleaks config path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a custom gitleaks config and clean scan target
        run: |
          # Create a minimal custom gitleaks config
          mkdir -p /tmp/custom-config
          cat > /tmp/custom-config/gitleaks.toml << 'EOF'
          title = "custom-test-config"

          [extend]
          useDefault = true
          EOF

          # Create a clean directory to scan
          mkdir -p /tmp/custom-scan-target
          echo "# Clean file with no secrets" > /tmp/custom-scan-target/README.md

      - id: action
        name: Run Agent Guard with custom config on clean directory
        uses: .
        with:
          paths: /tmp/custom-scan-target
          config-path: /tmp/custom-config/gitleaks.toml
          require-checksum: "false"

      - name: Assert scan succeeded with custom config
        run: |
          echo "PASS: Agent Guard scan with custom config completed successfully"
