name: Test custom config path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a clean directory to scan and a custom gitleaks config
        run: |
          mkdir -p /tmp/custom-config-scan-target
          echo "# Clean project" > /tmp/custom-config-scan-target/README.md
          echo "version: 2.0.0" > /tmp/custom-config-scan-target/package.json

          # Write a minimal custom gitleaks config
          cat > /tmp/custom-gitleaks.toml << 'EOF'
          title = "custom-test-config"

          [extend]
          useDefault = true
          EOF

      - id: action
        name: Run Agent Guard with custom gitleaks config
        uses: .
        with:
          paths: /tmp/custom-config-scan-target
          require-checksum: "false"
          config-path: /tmp/custom-gitleaks.toml

      - name: Assert action succeeded with custom config
        run: |
          echo "PASS: agent-guard scan completed successfully with custom config path"
