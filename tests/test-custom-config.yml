name: Test custom gitleaks config path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare mock gitleaks
        run: |
          mkdir -p "$RUNNER_TEMP/mock-bin"
          cp "$GITHUB_WORKSPACE/tests/fixtures/mock-gitleaks.sh" "$RUNNER_TEMP/mock-bin/gitleaks"
          chmod +x "$RUNNER_TEMP/mock-bin/gitleaks"
          echo "$RUNNER_TEMP/mock-bin" >> "$GITHUB_PATH"

      - name: Create custom gitleaks config and scan target
        run: |
          mkdir -p /tmp/custom-config
          printf 'title = "custom-test-config"\n\n[extend]\nuseDefault = false\n' \
            > /tmp/custom-config/gitleaks.toml

          mkdir -p /tmp/custom-scan-target
          echo "# Custom config test" > /tmp/custom-scan-target/README.md
          cd /tmp/custom-scan-target
          git init
          git config user.email "test@example.com"
          git config user.name "Test User"
          git add .
          git commit -m "Initial commit"

      - id: action
        name: Run Agent Guard with custom config
        uses: .
        with:
          paths: /tmp/custom-scan-target
          config-path: /tmp/custom-config/gitleaks.toml
          require-checksum: "false"
        env:
          AGENT_GUARD_GITLEAKS_BIN: ${{ runner.temp }}/mock-bin/gitleaks

      - name: Assert action succeeded with custom config
        run: |
          echo "PASS: Agent Guard completed successfully with custom gitleaks config"
