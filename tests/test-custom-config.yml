name: Test custom gitleaks config path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install gitleaks before action runs (to avoid download)
        run: |
          set -euo pipefail
          VERSION="8.30.1"
          OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64|amd64) ARCH="x64" ;;
            arm64|aarch64) ARCH="arm64" ;;
          esac
          ARCHIVE="gitleaks_${VERSION}_${OS}_${ARCH}.tar.gz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ARCHIVE}"
          TMP="$(mktemp -d)"
          curl -fsSL "$URL" -o "$TMP/$ARCHIVE"
          tar -xzf "$TMP/$ARCHIVE" -C "$TMP"
          sudo mv "$TMP/gitleaks" /usr/local/bin/gitleaks
          sudo chmod +x /usr/local/bin/gitleaks
          gitleaks version

      - name: Write a minimal custom gitleaks config
        run: |
          mkdir -p "$RUNNER_TEMP/custom-config"
          cat > "$RUNNER_TEMP/custom-config/gitleaks.toml" <<'EOF'
          title = "custom-test-config"

          [extend]
          useDefault = true
          EOF
          echo "CUSTOM_CONFIG=$RUNNER_TEMP/custom-config/gitleaks.toml" >> "$GITHUB_ENV"

      - id: scan
        name: Run Agent Guard with custom config
        uses: .
        with:
          paths: "."
          config-path: ${{ env.CUSTOM_CONFIG }}
          require-checksum: "false"

      - name: Assert scan succeeded with custom config
        run: |
          echo "PASS: Agent Guard scan completed with custom config path"
