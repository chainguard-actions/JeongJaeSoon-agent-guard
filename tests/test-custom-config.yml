name: Test custom gitleaks config path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install gitleaks for testing
        run: |
          set -euo pipefail
          version="8.30.1"
          os="linux"
          arch="x64"
          archive="gitleaks_${version}_${os}_${arch}.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          tmp="$(mktemp -d)"
          curl -fsSL "$url" -o "$tmp/$archive"
          tar -xzf "$tmp/$archive" -C "$tmp"
          sudo mv "$tmp/gitleaks" /usr/local/bin/gitleaks
          sudo chmod +x /usr/local/bin/gitleaks
          gitleaks version

      - name: Create custom gitleaks config and test directory
        run: |
          # Create a minimal custom config that extends defaults
          mkdir -p "$GITHUB_WORKSPACE/test-custom-config"
          cat > "$GITHUB_WORKSPACE/test-custom-config/gitleaks.toml" << 'EOF'
          title = "custom-test-config"

          [extend]
          useDefault = true

          [[allowlists]]
          description = "Allow all for testing"
          regexes = [
            '''.*'''
          ]
          EOF

          # Create a clean test directory to scan
          mkdir -p "$GITHUB_WORKSPACE/test-scan-dir"
          echo "console.log('hello');" > "$GITHUB_WORKSPACE/test-scan-dir/app.js"

      - id: action
        uses: .
        with:
          paths: "${{ github.workspace }}/test-scan-dir"
          config-path: "${{ github.workspace }}/test-custom-config/gitleaks.toml"
          require-checksum: "false"

      - name: Assert action succeeded with custom config
        run: |
          echo "Action completed successfully with custom gitleaks config"
          echo "PASS"
