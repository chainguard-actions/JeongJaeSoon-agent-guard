name: Test custom gitleaks config path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-install gitleaks
        run: |
          version="8.30.1"
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m)"
          case "$arch" in
            x86_64|amd64) arch="x64" ;;
            arm64|aarch64) arch="arm64" ;;
          esac
          archive="gitleaks_${version}_${os}_${arch}.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          tmp="$(mktemp -d)"
          curl -fsSL "$url" -o "$tmp/$archive"
          tar -xzf "$tmp/$archive" -C "$tmp"
          sudo mv "$tmp/gitleaks" /usr/local/bin/gitleaks
          sudo chmod +x /usr/local/bin/gitleaks
          gitleaks version

      - name: Create custom gitleaks config and clean scan target
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/custom-config"
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/custom-scan-dir"

          # Write a minimal custom gitleaks config
          cat > "$GITHUB_WORKSPACE/tests/fixtures/custom-config/gitleaks.toml" << 'EOF'
          title = "custom-test-config"

          [extend]
          useDefault = true
          EOF

          # Write a clean file to scan
          echo "# Clean project" > "$GITHUB_WORKSPACE/tests/fixtures/custom-scan-dir/README.md"
          echo "version: 1.0.0" > "$GITHUB_WORKSPACE/tests/fixtures/custom-scan-dir/config.yml"

      - id: action
        name: Run Agent Guard with custom config on clean directory
        uses: .
        with:
          paths: tests/fixtures/custom-scan-dir
          config-path: tests/fixtures/custom-config/gitleaks.toml
          require-checksum: "false"

      - name: Assert action succeeded with custom config
        run: |
          echo "PASS: Agent Guard completed successfully with custom gitleaks config"
