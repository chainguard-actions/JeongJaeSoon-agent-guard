name: Test custom gitleaks config path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install gitleaks
        run: |
          set -euo pipefail
          if command -v gitleaks > /dev/null 2>&1; then
            echo "gitleaks already installed: $(gitleaks version)"
            exit 0
          fi
          OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64|amd64) ARCH="x64" ;;
            arm64|aarch64) ARCH="arm64" ;;
          esac
          VERSION="8.30.1"
          ARCHIVE="gitleaks_${VERSION}_${OS}_${ARCH}.tar.gz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ARCHIVE}"
          TMP="$(mktemp -d)"
          curl -fsSL "$URL" -o "$TMP/$ARCHIVE"
          tar -xzf "$TMP/$ARCHIVE" -C "$TMP"
          sudo mv "$TMP/gitleaks" /usr/local/bin/gitleaks
          sudo chmod +x /usr/local/bin/gitleaks
          echo "Installed gitleaks: $(gitleaks version)"

      - name: Create clean test directory and custom gitleaks config
        run: |
          mkdir -p /tmp/custom-config-test
          echo "# safe content only" > /tmp/custom-config-test/safe.txt
          printf 'title = "custom-test-config"\n\n[extend]\nuseDefault = true\n' > /tmp/custom-gitleaks.toml

      - name: Run Agent Guard with custom config path
        id: action
        uses: .
        with:
          paths: /tmp/custom-config-test
          config-path: /tmp/custom-gitleaks.toml
          require-checksum: "false"

      - name: Assert scan passed with custom config
        run: |
          echo "PASS: scan completed successfully with custom gitleaks config"
