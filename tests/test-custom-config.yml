name: Test custom gitleaks config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create custom config and target
        run: |
          mkdir -p "$GITHUB_WORKSPACE/scan-target-custom"
          cat > "$RUNNER_TEMP/custom-gitleaks.toml" <<'EOF'
          title = "custom test config"

          [[rules]]
          id = "agtest-custom-token"
          description = "Custom test token"
          regex = '''AGTESTTOKEN_[A-Z0-9]{24}'''
          keywords = ["agtesttoken_"]
          EOF
          printf 'value: AGTESTTOKEN_%s\n' "Q7W2E9R4T1Y8U3I6O5P0ZXCV" > "$GITHUB_WORKSPACE/scan-target-custom/conf.yaml"
          echo "CUSTOM_CONFIG=$RUNNER_TEMP/custom-gitleaks.toml" >> "$GITHUB_ENV"
      - id: action
        uses: .
        continue-on-error: true
        with:
          paths: scan-target-custom
          require-checksum: "false"
          config-path: ${{ env.CUSTOM_CONFIG }}
      - name: Assert custom rule triggered a failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected custom rule to detect token"
            exit 1
          fi
          if ! command -v gitleaks >/dev/null; then
            echo "FAIL: gitleaks not installed; failure not from scan"
            exit 1
          fi
          echo "PASS"
