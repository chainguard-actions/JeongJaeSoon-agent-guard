name: Test custom config-path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a file containing the custom marker token
        run: |
          dir="$RUNNER_TEMP/agent-guard-marker"
          rm -rf "$dir"
          mkdir -p "$dir"
          m1="AGENTGUARD"
          m2="MARKER"
          echo "value = ${m1}${m2}48213957" > "$dir/data.txt"
      - name: Warm-up clean scan with custom config (must succeed)
        id: clean
        uses: .
        with:
          paths: tests/fixtures/clean
          require-checksum: "false"
          config-path: ${{ github.workspace }}/tests/fixtures/custom-gitleaks.toml
      - id: action
        uses: .
        continue-on-error: true
        with:
          paths: ${{ runner.temp }}/agent-guard-marker
          require-checksum: "false"
          config-path: ${{ github.workspace }}/tests/fixtures/custom-gitleaks.toml
      - name: Assert custom rule triggered
        env:
          CLEAN: ${{ steps.clean.outcome }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "clean outcome: $CLEAN"
          echo "marker outcome: $OUTCOME"
          if [ "$CLEAN" != "success" ]; then
            echo "FAIL: clean scan with custom config should succeed"
            exit 1
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected custom rule to detect the marker token"
            exit 1
          fi
          echo "PASS"
