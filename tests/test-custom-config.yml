name: Test custom gitleaks config path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-install gitleaks
        run: |
          set -euo pipefail
          version="8.30.1"
          os="linux"
          arch="x64"
          archive="gitleaks_${version}_${os}_${arch}.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          tmp="$(mktemp -d)"
          curl -fsSL "$url" -o "$tmp/$archive"
          tar -xzf "$tmp/$archive" -C "$tmp"
          sudo mv "$tmp/gitleaks" /usr/local/bin/gitleaks
          sudo chmod +x /usr/local/bin/gitleaks
          gitleaks version

      - name: Create custom gitleaks config and clean scan target
        run: |
          # Write a minimal custom gitleaks config that extends defaults
          cat > /tmp/custom-gitleaks.toml << 'EOF'
          title = "custom-test-config"

          [extend]
          useDefault = true
          EOF

          # Create a clean directory to scan
          mkdir -p /tmp/custom-config-scan
          echo "# Safe file with no secrets" > /tmp/custom-config-scan/safe.txt

      - id: action
        name: Run agent-guard with custom config on clean directory
        uses: .
        with:
          paths: /tmp/custom-config-scan
          config-path: /tmp/custom-gitleaks.toml
          require-checksum: "false"

      - name: Assert action succeeded with custom config
        run: |
          echo "PASS: action completed successfully with custom gitleaks config"
