name: Test custom gitleaks config-path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: clean
        uses: .
        with:
          paths: tests/fixtures/clean
          require-checksum: "false"
          config-path: ${{ github.workspace }}/tests/fixtures/custom-gitleaks.toml
      - name: Create file matching the custom rule
        run: |
          mkdir -p "$GITHUB_WORKSPACE/custom-leak"
          tok="$(head -c 512 /dev/urandom | tr -dc 'A-Z0-9' | head -c 24)"
          printf 'value = "AGENTGUARDTEST_%s"\n' "$tok" > "$GITHUB_WORKSPACE/custom-leak/app.conf"
          cat "$GITHUB_WORKSPACE/custom-leak/app.conf"
      - id: action
        uses: .
        continue-on-error: true
        with:
          paths: custom-leak
          require-checksum: "false"
          config-path: ${{ github.workspace }}/tests/fixtures/custom-gitleaks.toml
      - name: Assert custom config was honored
        env:
          CLEAN: ${{ steps.clean.outcome }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "clean outcome: $CLEAN"
          echo "custom-rule outcome: $OUTCOME"
          if [ "$CLEAN" != "success" ]; then
            echo "FAIL: clean scan with custom config should succeed"
            exit 1
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected custom rule to detect the synthetic token"
            exit 1
          fi
          echo "PASS"
