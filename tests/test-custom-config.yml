name: Test custom config-path is used
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Resolve gitleaks checksum
        id: sum
        shell: bash
        run: |
          set -euo pipefail
          v=8.30.1
          case "$(uname -m)" in
            x86_64|amd64) a=x64 ;;
            arm64|aarch64) a=arm64 ;;
          esac
          sum=$(curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_checksums.txt" \
            | awk -v f="gitleaks_${v}_linux_${a}.tar.gz" '$2==f{print $1}')
          [ -n "$sum" ] || { echo "could not resolve checksum"; exit 1; }
          echo "checksum=$sum" >> "$GITHUB_OUTPUT"
      - name: Create scan targets
        shell: bash
        run: |
          mkdir -p scan-target/clean scan-target/canary
          printf 'nothing here\n' > scan-target/clean/a.txt
          m="AGCANARY"
          printf 'marker=%s_%s\n' "$m" "12345678" > scan-target/canary/b.txt
      - name: Custom config on clean path
        id: clean
        uses: .
        with:
          paths: scan-target/clean
          config-path: ${{ github.workspace }}/tests/fixtures/custom-gitleaks.toml
          gitleaks-checksum: ${{ steps.sum.outputs.checksum }}
      - name: Custom config on canary path
        id: action
        uses: .
        continue-on-error: true
        with:
          paths: scan-target/canary
          config-path: ${{ github.workspace }}/tests/fixtures/custom-gitleaks.toml
          gitleaks-checksum: ${{ steps.sum.outputs.checksum }}
      - name: Assert custom rule was applied
        env:
          CLEAN: ${{ steps.clean.outcome }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "clean outcome: $CLEAN"
          echo "canary outcome: $OUTCOME"
          if [ "$CLEAN" != "success" ]; then
            echo "FAIL: custom config on clean path should pass"
            exit 1
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: custom canary rule should have flagged the file"
            exit 1
          fi
          echo "PASS"
