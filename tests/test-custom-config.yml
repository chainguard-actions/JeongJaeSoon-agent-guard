name: Test custom gitleaks config path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-install gitleaks
        run: |
          set -euo pipefail
          if ! command -v gitleaks > /dev/null 2>&1; then
            VERSION="8.30.1"
            OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
            ARCH="$(uname -m)"
            case "$ARCH" in
              x86_64|amd64) ARCH="x64" ;;
              arm64|aarch64) ARCH="arm64" ;;
            esac
            ARCHIVE="gitleaks_${VERSION}_${OS}_${ARCH}.tar.gz"
            URL="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ARCHIVE}"
            TMP="$(mktemp -d)"
            curl -fsSL "$URL" -o "$TMP/$ARCHIVE"
            tar -xzf "$TMP/$ARCHIVE" -C "$TMP"
            sudo mv "$TMP/gitleaks" /usr/local/bin/gitleaks
            sudo chmod +x /usr/local/bin/gitleaks
          fi
          gitleaks version

      - name: Create custom gitleaks config and clean scan target
        run: |
          mkdir -p /tmp/custom-config
          printf '%s\n' 'title = "custom-agent-guard-test"' > /tmp/custom-config/gitleaks.toml
          printf '%s\n' '' >> /tmp/custom-config/gitleaks.toml
          printf '%s\n' '[extend]' >> /tmp/custom-config/gitleaks.toml
          printf '%s\n' 'useDefault = true' >> /tmp/custom-config/gitleaks.toml
          printf '%s\n' '' >> /tmp/custom-config/gitleaks.toml
          printf '%s\n' '[[allowlists]]' >> /tmp/custom-config/gitleaks.toml
          printf '%s\n' 'description = "Allow test placeholders"' >> /tmp/custom-config/gitleaks.toml
          printf '%s\n' 'regexes = [' >> /tmp/custom-config/gitleaks.toml
          printf '%s\n' "  '''(?i)example[_-]?(token|key|secret|password)'''," >> /tmp/custom-config/gitleaks.toml
          printf '%s\n' "  '''(?i)test[_-]?(token|key|secret|password)'''" >> /tmp/custom-config/gitleaks.toml
          printf '%s\n' ']' >> /tmp/custom-config/gitleaks.toml

          mkdir -p /tmp/custom-config-scan
          echo "# Clean project" > /tmp/custom-config-scan/README.md
          echo "version: 1.0.0" > /tmp/custom-config-scan/config.yaml

      - name: Run Agent Guard with custom config
        id: action
        uses: .
        with:
          paths: /tmp/custom-config-scan
          config-path: /tmp/custom-config/gitleaks.toml
          require-checksum: "false"

      - name: Assert action succeeded with custom config
        run: |
          echo "Action completed successfully using custom gitleaks config"
          echo "PASS"
