name: Test scanning a specific path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install gitleaks pre-emptively
        run: |
          set -euo pipefail
          VERSION="8.30.1"
          OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64|amd64) ARCH="x64" ;;
            arm64|aarch64) ARCH="arm64" ;;
          esac
          ARCHIVE="gitleaks_${VERSION}_${OS}_${ARCH}.tar.gz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ARCHIVE}"
          TMP="$(mktemp -d)"
          curl -fsSL "$URL" -o "$TMP/$ARCHIVE"
          tar -xzf "$TMP/$ARCHIVE" -C "$TMP"
          sudo mv "$TMP/gitleaks" /usr/local/bin/gitleaks
          sudo chmod +x /usr/local/bin/gitleaks
          gitleaks version

      - name: Create a clean test directory with no secrets
        run: |
          mkdir -p /tmp/scan-target
          echo "# Safe file with no secrets" > /tmp/scan-target/README.md
          echo "hello=world" > /tmp/scan-target/config.txt
          echo "Test directory created at /tmp/scan-target"

      - id: action
        name: Run agent-guard on specific path
        uses: .
        with:
          paths: "/tmp/scan-target"
          require-checksum: "false"

      - name: Assert action succeeded scanning specific path
        run: |
          echo "PASS: agent-guard scan of specific path completed successfully"
