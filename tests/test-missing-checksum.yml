name: Test missing checksum is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Record whether gitleaks preexists
        id: pre
        run: |
          if command -v gitleaks >/dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
          mkdir -p ag-nochecksum
          echo "clean" > ag-nochecksum/a.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          paths: ag-nochecksum
      - name: Assert action refused to install without checksum
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PRESENT: ${{ steps.pre.outputs.present }}
        run: |
          echo "outcome: $OUTCOME (gitleaks preinstalled: $PRESENT)"
          if [ "$PRESENT" = "true" ]; then
            if [ "$OUTCOME" != "success" ]; then
              echo "FAIL: gitleaks preinstalled, install step should be skipped and scan pass"
              exit 1
            fi
            echo "PASS (gitleaks preinstalled; checksum not needed)"
            exit 0
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when checksum missing and require-checksum=true"
            exit 1
          fi
          if command -v gitleaks >/dev/null; then
            echo "FAIL: gitleaks should not have been installed"
            exit 1
          fi
          echo "PASS"
