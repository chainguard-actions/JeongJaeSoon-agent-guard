name: Test missing checksum is rejected by default
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Record whether gitleaks is preinstalled
        id: pre
        run: |
          rm -rf scan-clean
          mkdir -p scan-clean
          echo "nothing here" > scan-clean/a.txt
          if command -v gitleaks >/dev/null; then
            echo "preinstalled=true" >> "$GITHUB_OUTPUT"
          else
            echo "preinstalled=false" >> "$GITHUB_OUTPUT"
          fi
      - id: action
        uses: .
        continue-on-error: true
        with:
          paths: scan-clean
      - name: Assert checksum requirement enforced
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PRE: ${{ steps.pre.outputs.preinstalled }}
        run: |
          echo "outcome: $OUTCOME preinstalled: $PRE"
          if [ "$PRE" = "true" ]; then
            if [ "$OUTCOME" != "success" ]; then
              echo "FAIL: gitleaks preinstalled, expected install to be skipped and scan to succeed"
              exit 1
            fi
          else
            if [ "$OUTCOME" != "failure" ]; then
              echo "FAIL: expected failure when gitleaks-checksum is empty and require-checksum=true"
              exit 1
            fi
            if command -v gitleaks >/dev/null; then
              echo "FAIL: gitleaks should not have been installed"
              exit 1
            fi
          fi
          echo "PASS"
