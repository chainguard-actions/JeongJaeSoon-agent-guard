name: Test missing checksum is rejected by default
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare scan target and record whether gitleaks preexists
        id: pre
        run: |
          rm -rf "$GITHUB_WORKSPACE/ag-nochk-target"
          mkdir -p "$GITHUB_WORKSPACE/ag-nochk-target"
          echo "hello" > "$GITHUB_WORKSPACE/ag-nochk-target/a.txt"
          if command -v gitleaks >/dev/null; then
            echo "preinstalled=true" >> "$GITHUB_OUTPUT"
          else
            echo "preinstalled=false" >> "$GITHUB_OUTPUT"
          fi
      - id: action
        uses: .
        continue-on-error: true
        with:
          paths: ag-nochk-target
      - name: Assert outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PRE: ${{ steps.pre.outputs.preinstalled }}
        run: |
          echo "outcome: $OUTCOME, gitleaks preinstalled: $PRE"
          if [ "$PRE" = "true" ]; then
            if [ "$OUTCOME" != "success" ]; then
              echo "FAIL: gitleaks preinstalled, install should be skipped and scan should pass"
              exit 1
            fi
          else
            if [ "$OUTCOME" != "failure" ]; then
              echo "FAIL: expected failure without gitleaks-checksum when require-checksum=true"
              exit 1
            fi
            if [ -x "$RUNNER_TEMP/agent-guard-bin/gitleaks" ]; then
              echo "FAIL: gitleaks should not have been installed"
              exit 1
            fi
          fi
          echo "PASS"
