name: Test missing checksum is rejected by default
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Record whether gitleaks is preinstalled
        id: pre
        run: |
          if command -v gitleaks >/dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create clean scan target
        run: |
          mkdir -p agent-guard-clean
          printf 'nothing secret here\n' > agent-guard-clean/readme.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          paths: agent-guard-clean
      - name: Assert action refused to install without checksum
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PRESENT: ${{ steps.pre.outputs.present }}
        run: |
          echo "outcome: $OUTCOME (gitleaks preinstalled: $PRESENT)"
          if [ "$PRESENT" = "true" ]; then
            if [ "$OUTCOME" != "success" ]; then
              echo "FAIL: gitleaks was preinstalled, expected success"
              exit 1
            fi
            echo "PASS: install skipped since gitleaks already present"
            exit 0
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when gitleaks-checksum is empty and require-checksum=true"
            exit 1
          fi
          if [ -x "$RUNNER_TEMP/agent-guard-bin/gitleaks" ]; then
            echo "FAIL: gitleaks should not have been installed"
            exit 1
          fi
          echo "PASS"
