name: Test missing checksum is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Record whether gitleaks is preinstalled
        run: |
          mkdir -p "$RUNNER_TEMP/clean-scan"
          echo "nothing here" > "$RUNNER_TEMP/clean-scan/file.txt"
          echo "CLEAN_DIR=$RUNNER_TEMP/clean-scan" >> "$GITHUB_ENV"
          if command -v gitleaks >/dev/null; then
            echo "PREINSTALLED=true" >> "$GITHUB_ENV"
          else
            echo "PREINSTALLED=false" >> "$GITHUB_ENV"
          fi
      - id: action
        uses: .
        continue-on-error: true
        with:
          paths: ${{ env.CLEAN_DIR }}
      - name: Assert checksum requirement enforced
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME preinstalled: $PREINSTALLED"
          if [ "$PREINSTALLED" = "true" ]; then
            if [ "$OUTCOME" != "success" ]; then
              echo "FAIL: gitleaks preinstalled; install is skipped so scan should succeed"
              exit 1
            fi
          else
            if [ "$OUTCOME" != "failure" ]; then
              echo "FAIL: expected failure without gitleaks-checksum and require-checksum=true"
              exit 1
            fi
            if [ -x "$RUNNER_TEMP/agent-guard-bin/gitleaks" ]; then
              echo "FAIL: gitleaks should not have been installed"
              exit 1
            fi
          fi
          echo "PASS"
