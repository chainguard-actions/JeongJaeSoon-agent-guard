name: Test missing checksum is rejected by default
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Record whether gitleaks is preinstalled
        id: pre
        run: |
          if command -v gitleaks >/dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
          mkdir -p ag-scan-clean
          printf 'nothing to see here\n' > ag-scan-clean/a.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          paths: ag-scan-clean
      - name: Assert outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PRESENT: ${{ steps.pre.outputs.present }}
        run: |
          echo "outcome: $OUTCOME, gitleaks preinstalled: $PRESENT"
          if [ "$PRESENT" = "true" ]; then
            if [ "$OUTCOME" != "success" ]; then
              echo "FAIL: gitleaks preinstalled, install skipped, clean scan should succeed"
              exit 1
            fi
          else
            if [ "$OUTCOME" != "failure" ]; then
              echo "FAIL: expected failure when gitleaks-checksum is empty and require-checksum=true"
              exit 1
            fi
            if command -v gitleaks >/dev/null; then
              echo "FAIL: gitleaks should not have been installed without a checksum"
              exit 1
            fi
          fi
          echo "PASS"
