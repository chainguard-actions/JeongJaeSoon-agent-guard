name: Test missing checksum is rejected when gitleaks must be installed
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Record whether gitleaks is preinstalled
        id: pre
        run: |
          if command -v gitleaks >/dev/null; then
            echo "preinstalled=true" >> "$GITHUB_OUTPUT"
          else
            echo "preinstalled=false" >> "$GITHUB_OUTPUT"
          fi
          mkdir -p scan-target/clean
          printf 'hello\n' > scan-target/clean/a.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          paths: scan-target/clean
      - name: Assert failure without checksum
        env:
          PRE: ${{ steps.pre.outputs.preinstalled }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "preinstalled: $PRE"
          echo "outcome: $OUTCOME"
          if [ "$PRE" = "true" ]; then
            if [ "$OUTCOME" != "success" ]; then
              echo "FAIL: gitleaks preinstalled, install skipped, scan should pass"
              exit 1
            fi
            echo "PASS (gitleaks preinstalled; checksum not needed)"
            exit 0
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when checksum missing and require-checksum=true"
            exit 1
          fi
          if [ -e "$RUNNER_TEMP/agent-guard-bin/gitleaks" ]; then
            echo "FAIL: gitleaks should not have been installed"
            exit 1
          fi
          echo "PASS"
