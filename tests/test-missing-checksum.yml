name: Test missing checksum is rejected by default
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Record whether gitleaks is preinstalled
        id: pre
        run: |
          if command -v gitleaks >/dev/null; then
            echo "preinstalled=true" >> "$GITHUB_OUTPUT"
          else
            echo "preinstalled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create clean directory
        run: |
          mkdir -p agent-guard-clean
          printf 'hello world\n' > agent-guard-clean/readme.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          paths: agent-guard-clean
      - name: Assert action refused to install without checksum
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PRE: ${{ steps.pre.outputs.preinstalled }}
        run: |
          echo "outcome: $OUTCOME preinstalled: $PRE"
          if [ "$PRE" = "true" ]; then
            if [ "$OUTCOME" != "success" ]; then
              echo "FAIL: gitleaks preinstalled; install is skipped so scan should succeed"
              exit 1
            fi
            echo "PASS (gitleaks preinstalled, checksum not needed)"
            exit 0
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when gitleaks-checksum is empty and require-checksum=true"
            exit 1
          fi
          if command -v gitleaks >/dev/null; then
            echo "FAIL: gitleaks should not have been installed"
            exit 1
          fi
          echo "PASS"
