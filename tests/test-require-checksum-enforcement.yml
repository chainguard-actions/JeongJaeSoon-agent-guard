name: Test require-checksum enforcement
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Uninstall gitleaks if present (to force install path)
        run: |
          # Remove gitleaks from PATH so the action tries to install it
          if command -v gitleaks > /dev/null 2>&1; then
            sudo rm -f "$(command -v gitleaks)" || true
          fi

      - name: Run Agent Guard without checksum (expect failure)
        id: action
        uses: .
        with:
          paths: /tmp
          require-checksum: "true"
          gitleaks-checksum: ""
        continue-on-error: true

      - name: Assert action failed due to missing checksum
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when require-checksum=true and no checksum provided"
            exit 1
          fi
          echo "PASS: action correctly enforced checksum requirement"
