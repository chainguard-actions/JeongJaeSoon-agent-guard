name: Test require-checksum enforcement
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure gitleaks is NOT on PATH
        run: |
          # Remove gitleaks if present so the action tries to install it
          if command -v gitleaks > /dev/null 2>&1; then
            GITLEAKS_PATH=$(command -v gitleaks)
            sudo rm -f "$GITLEAKS_PATH"
          fi
          echo "gitleaks present: $(command -v gitleaks 2>/dev/null || echo 'not found')"

      - name: Run Agent Guard without checksum (expect failure due to require-checksum=true)
        id: action
        uses: .
        with:
          paths: "."
          require-checksum: "true"
          gitleaks-checksum: ""
        continue-on-error: true

      - name: Assert action failed due to missing checksum
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when require-checksum=true and no checksum provided, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when checksum was required but not provided"
