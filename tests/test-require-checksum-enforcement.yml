name: Test require-checksum enforcement
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure gitleaks is NOT on PATH
        run: |
          # Remove gitleaks from PATH if present so the action tries to install it
          if command -v gitleaks > /dev/null 2>&1; then
            GITLEAKS_PATH=$(command -v gitleaks)
            echo "Found gitleaks at: $GITLEAKS_PATH — temporarily hiding it"
            sudo mv "$GITLEAKS_PATH" "${GITLEAKS_PATH}.bak" || true
          fi
          echo "gitleaks available: $(command -v gitleaks || echo 'not found')"

      - id: action
        name: Run agent-guard without checksum (expect failure)
        uses: .
        with:
          paths: "."
          require-checksum: "true"
          gitleaks-checksum: ""
        continue-on-error: true

      - name: Restore gitleaks if it was hidden
        if: always()
        run: |
          if [ -f /usr/local/bin/gitleaks.bak ]; then
            sudo mv /usr/local/bin/gitleaks.bak /usr/local/bin/gitleaks || true
          fi

      - name: Assert action failed due to missing checksum
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when require-checksum=true and no checksum is provided, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly enforced checksum requirement"
