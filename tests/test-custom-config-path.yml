name: Test custom config path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a clean directory to scan
        run: |
          mkdir -p /tmp/custom-config-scan
          echo "# Just a readme" > /tmp/custom-config-scan/README.md

      - name: Create a minimal custom gitleaks config
        run: |
          mkdir -p /tmp/custom-gitleaks-config
          cat > /tmp/custom-gitleaks-config/gitleaks.toml << 'EOF'
          title = "custom-agent-guard-test"

          [extend]
          useDefault = true
          EOF

      - name: Install gitleaks (pre-install to avoid checksum requirement)
        run: |
          VERSION=8.30.1
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64|amd64) ARCH="x64" ;;
            arm64|aarch64) ARCH="arm64" ;;
          esac
          ARCHIVE="gitleaks_${VERSION}_${OS}_${ARCH}.tar.gz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ARCHIVE}"
          TMP=$(mktemp -d)
          curl -fsSL "$URL" -o "$TMP/$ARCHIVE"
          tar -xzf "$TMP/$ARCHIVE" -C "$TMP"
          sudo mv "$TMP/gitleaks" /usr/local/bin/gitleaks
          sudo chmod +x /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Agent Guard with custom config path
        id: action
        uses: .
        with:
          paths: /tmp/custom-config-scan
          config-path: /tmp/custom-gitleaks-config/gitleaks.toml
          require-checksum: "false"

      - name: Assert action succeeded with custom config
        run: |
          echo "Action completed successfully with custom config path"
          echo "PASS"
