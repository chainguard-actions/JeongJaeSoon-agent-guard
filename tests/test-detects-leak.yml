name: Test leak detection fails the scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create scan target with a leaked token
        run: |
          mkdir -p "$GITHUB_WORKSPACE/scan-target-leak"
          prefix="ghp_"
          body="R8kqZ2mX7vN4pL9sT1wY6bC3dF5gH0jK2aQe"
          printf 'GITHUB_TOKEN=%s%s\n' "$prefix" "$body" > "$GITHUB_WORKSPACE/scan-target-leak/deploy.env"
          prefix2="AKIA"
          body2="Z7Q4M2XK9PLR3TWB"
          printf 'aws_access_key_id = %s%s\n' "$prefix2" "$body2" >> "$GITHUB_WORKSPACE/scan-target-leak/deploy.env"
      - id: action
        uses: .
        continue-on-error: true
        with:
          paths: scan-target-leak
          require-checksum: "false"
      - name: Assert action failed due to leak
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when a secret is present"
            exit 1
          fi
          if ! command -v gitleaks >/dev/null; then
            echo "FAIL: gitleaks was not installed, so failure was not from the scan"
            exit 1
          fi
          echo "PASS"
