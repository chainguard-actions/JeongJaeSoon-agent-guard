name: Test basic scan - no secrets found
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mock gitleaks that reports no findings
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mock-bin"
          printf '#!/bin/sh\ncase "${1:-}" in\n  version) echo "v8.30.1" ;;\n  detect)  exit 0 ;;\n  *)       exit 0 ;;\nesac\n' > "$RUNNER_TEMP/mock-bin/gitleaks"
          chmod +x "$RUNNER_TEMP/mock-bin/gitleaks"
          echo "$RUNNER_TEMP/mock-bin" >> "$GITHUB_PATH"

      - name: Create a clean git repository to scan
        run: |
          set -euo pipefail
          rm -rf /tmp/clean-scan-target
          mkdir -p /tmp/clean-scan-target
          cd /tmp/clean-scan-target
          git init
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo "# Hello World" > README.md
          echo "name: my-project" > config.yaml
          echo "version: 1.0.0" >> config.yaml
          git add .
          git commit -m "initial commit"

      - id: action
        uses: .
        with:
          paths: /tmp/clean-scan-target
          require-checksum: "false"

      - name: Assert action succeeded (no secrets found)
        run: |
          echo "Action completed successfully - no secrets detected in clean directory"
          echo "PASS"
