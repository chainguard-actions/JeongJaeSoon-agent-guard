name: Test basic scan (no secrets, pre-installed gitleaks)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-install gitleaks so action skips download
        run: |
          set -euo pipefail
          VERSION="8.30.1"
          OS="linux"
          ARCH="x64"
          ARCHIVE="gitleaks_${VERSION}_${OS}_${ARCH}.tar.gz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ARCHIVE}"
          TMP="$(mktemp -d)"
          curl -fsSL "$URL" -o "$TMP/$ARCHIVE"
          tar -xzf "$TMP/$ARCHIVE" -C "$TMP"
          sudo mv "$TMP/gitleaks" /usr/local/bin/gitleaks
          sudo chmod +x /usr/local/bin/gitleaks
          gitleaks version
          rm -rf "$TMP"

      - name: Run Agent Guard scan on the repo
        id: action
        uses: .
        with:
          paths: "."
          gitleaks-version: "8.30.1"
          require-checksum: "false"

      - name: Assert scan completed successfully
        run: |
          echo "PASS: Agent Guard scan completed without detecting secrets"
