name: Test secret detection fails the scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Resolve gitleaks checksum
        id: sum
        run: |
          set -euo pipefail
          v=8.30.1
          arch="$(uname -m)"
          case "$arch" in x86_64|amd64) arch=x64 ;; arm64|aarch64) arch=arm64 ;; esac
          sum="$(curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_checksums.txt" \
            | awk -v a="gitleaks_${v}_linux_${arch}.tar.gz" '$2==a{print $1}')"
          [ -n "$sum" ] || { echo "FAIL: could not resolve checksum"; exit 1; }
          echo "checksum=$sum" >> "$GITHUB_OUTPUT"
      - name: Create scan target with a fake GitHub token
        run: |
          set -euo pipefail
          mkdir -p agent-guard-leaky
          rand="$(head -c 400 /dev/urandom | tr -dc 'A-Za-z0-9' | head -c 36)"
          printf 'export GH_TOKEN=%s%s\n' "ghp_" "$rand" > agent-guard-leaky/env.sh
          echo "wrote token of length $(( ${#rand} + 4 ))"
      - id: action
        uses: .
        continue-on-error: true
        with:
          paths: agent-guard-leaky
          gitleaks-checksum: ${{ steps.sum.outputs.checksum }}
      - name: Assert scan failed on leaked secret
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the scan to fail on a leaked token"
            exit 1
          fi
          echo "PASS"
