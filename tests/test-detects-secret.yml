name: Test secret detection fails the scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Resolve gitleaks checksum from the official release
        id: sum
        run: |
          set -euo pipefail
          VERSION=8.30.1
          case "$(uname -m)" in
            x86_64|amd64) arch=x64 ;;
            arm64|aarch64) arch=arm64 ;;
          esac
          tmp="$(mktemp -d)"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_checksums.txt" -o "$tmp/sums.txt"
          sha="$(awk -v f="gitleaks_${VERSION}_linux_${arch}.tar.gz" '$2==f {print $1}' "$tmp/sums.txt")"
          echo "sha: $sha"
          [ -n "$sha" ] || { echo "FAIL: could not resolve checksum"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Create scan target containing a synthetic GitHub token
        run: |
          mkdir -p "$GITHUB_WORKSPACE/ag-secret-scan"
          # Randomly generated at runtime so no secret-shaped literal is committed.
          rand="$(head -c 4000 /dev/urandom | tr -dc 'A-Za-z0-9' | head -c 36)"
          printf 'DEPLOY_TOKEN=ghp_%s\n' "$rand" > "$GITHUB_WORKSPACE/ag-secret-scan/deploy.env"
      - id: action
        uses: .
        continue-on-error: true
        with:
          paths: ag-secret-scan
          gitleaks-checksum: ${{ steps.sum.outputs.sha }}
      - name: Assert action failed due to the finding
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the scan to fail on a leaked token"
            exit 1
          fi
          if ! command -v gitleaks >/dev/null; then
            echo "FAIL: gitleaks was not installed, so failure was not from the scan"
            exit 1
          fi
          echo "PASS"
      - name: Cleanup
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/ag-secret-scan"
