name: Test scan fails when a secret is present
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a directory containing a synthetic GitHub token
        run: |
          mkdir -p leak-dir
          rand="$(head -c 4000 /dev/urandom | tr -dc 'A-Za-z0-9' | head -c 36)"
          printf 'github_token = "ghp_%s"\n' "$rand" > leak-dir/config.env
          echo "created leak-dir/config.env"
      - id: action
        uses: .
        continue-on-error: true
        with:
          paths: leak-dir
          require-checksum: "false"
      - name: Assert action failed due to detected secret
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when a secret is present"
            exit 1
          fi
          echo "PASS"
