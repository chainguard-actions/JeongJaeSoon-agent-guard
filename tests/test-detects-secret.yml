name: Test scan detects a leaked secret
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Resolve gitleaks checksum
        id: sum
        run: |
          set -euo pipefail
          version=8.30.1
          arch="$(uname -m)"
          case "$arch" in
            x86_64|amd64) arch=x64 ;;
            arm64|aarch64) arch=arm64 ;;
          esac
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_checksums.txt" -o "$RUNNER_TEMP/gl-checksums.txt"
          sum="$(grep " gitleaks_${version}_linux_${arch}.tar.gz\$" "$RUNNER_TEMP/gl-checksums.txt" | awk '{print $1}')"
          echo "checksum: $sum"
          [ -n "$sum" ] || { echo "FAIL: could not resolve checksum"; exit 1; }
          echo "checksum=$sum" >> "$GITHUB_OUTPUT"
      - name: Create scan target containing a fake GitHub token
        run: |
          mkdir -p agent-guard-leak
          prefix="ghp"
          body="R7kq2Lx9Vb4Nz8Wm3Tp6Yc1Hd5Fg0Js2AeQu"
          printf 'GITHUB_TOKEN=%s_%s\n' "$prefix" "$body" > agent-guard-leak/deploy.env
      - id: action
        uses: .
        continue-on-error: true
        with:
          paths: agent-guard-leak
          gitleaks-checksum: ${{ steps.sum.outputs.checksum }}
      - name: Assert action failed due to detected secret
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the scan to fail on a leaked secret"
            exit 1
          fi
          if ! command -v gitleaks >/dev/null; then
            echo "FAIL: gitleaks was not installed, failure was not from the scan"
            exit 1
          fi
          echo "PASS"
