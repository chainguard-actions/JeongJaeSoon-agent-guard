name: Test nonexistent config-path fails closed
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Resolve gitleaks checksum
        id: sum
        shell: bash
        run: |
          set -euo pipefail
          v=8.30.1
          case "$(uname -m)" in
            x86_64|amd64) a=x64 ;;
            arm64|aarch64) a=arm64 ;;
          esac
          sum=$(curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_checksums.txt" \
            | awk -v f="gitleaks_${v}_linux_${a}.tar.gz" '$2==f{print $1}')
          [ -n "$sum" ] || { echo "could not resolve checksum"; exit 1; }
          echo "checksum=$sum" >> "$GITHUB_OUTPUT"
      - name: Create clean scan target
        run: |
          mkdir -p scan-target/clean
          printf 'nothing here\n' > scan-target/clean/a.txt
      - name: Control run with default config
        id: clean
        uses: .
        with:
          paths: scan-target/clean
          gitleaks-checksum: ${{ steps.sum.outputs.checksum }}
      - id: action
        uses: .
        continue-on-error: true
        with:
          paths: scan-target/clean
          config-path: ${{ github.workspace }}/does-not-exist/gitleaks.toml
          gitleaks-checksum: ${{ steps.sum.outputs.checksum }}
      - name: Assert missing config fails
        env:
          CLEAN: ${{ steps.clean.outcome }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "clean outcome: $CLEAN"
          echo "missing-config outcome: $OUTCOME"
          if [ "$CLEAN" != "success" ]; then
            echo "FAIL: default config control run should pass"
            exit 1
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: nonexistent config should fail the scan"
            exit 1
          fi
          echo "PASS"
