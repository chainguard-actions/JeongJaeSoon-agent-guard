name: Test multiple whitespace-separated paths
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create two clean scan targets
        run: |
          mkdir -p path-a path-b
          echo "nothing to see here" > path-a/a.txt
          echo "still nothing here" > path-b/b.txt
      - id: clean
        uses: .
        with:
          paths: path-a path-b
          require-checksum: "false"
      - name: Put a secret only in the second path
        run: |
          tok="ghp_$(head -c 4000 /dev/urandom | tr -dc 'A-Za-z0-9' | head -c 36)"
          printf 'token: %s\n' "$tok" > path-b/leak.yml
      - id: dirty
        uses: .
        continue-on-error: true
        with:
          paths: path-a path-b
          require-checksum: "false"
      - name: Assert clean scan passed and second path was scanned
        env:
          CLEAN: ${{ steps.clean.outcome }}
          DIRTY: ${{ steps.dirty.outcome }}
        run: |
          echo "clean: $CLEAN dirty: $DIRTY"
          if [ "$CLEAN" != "success" ]; then
            echo "FAIL: expected clean multi-path scan to succeed"
            exit 1
          fi
          if [ "$DIRTY" != "failure" ]; then
            echo "FAIL: expected secret in second path to fail the scan"
            exit 1
          fi
          echo "PASS"
