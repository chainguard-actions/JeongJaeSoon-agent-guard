name: Test multiple whitespace-separated paths
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Resolve gitleaks checksum
        id: sum
        run: |
          set -euo pipefail
          version=8.30.1
          arch="$(uname -m)"
          case "$arch" in
            x86_64|amd64) arch=x64 ;;
            arm64|aarch64) arch=arm64 ;;
          esac
          archive="gitleaks_${version}_linux_${arch}.tar.gz"
          sum="$(curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_checksums.txt" | awk -v a="$archive" '$2 == a {print $1; exit}')"
          echo "checksum: $sum"
          [ -n "$sum" ] || { echo "FAIL: could not resolve checksum"; exit 1; }
          echo "checksum=$sum" >> "$GITHUB_OUTPUT"
      - name: Create clean dir and leaky dir
        run: |
          mkdir -p ag-multi-clean ag-multi-leaky
          echo "just text" > ag-multi-clean/a.txt
          rand() { LC_ALL=C tr -dc "$1" < /dev/urandom | head -c "$2"; }
          echo "token: ghp_$(rand 'A-Za-z0-9' 36)" > ag-multi-leaky/b.txt
      - id: clean
        uses: .
        with:
          paths: ag-multi-clean
          gitleaks-checksum: ${{ steps.sum.outputs.checksum }}
      - id: both
        uses: .
        continue-on-error: true
        with:
          paths: "ag-multi-clean   ag-multi-leaky"
          gitleaks-checksum: ${{ steps.sum.outputs.checksum }}
      - name: Assert second path in the list was scanned
        env:
          CLEAN: ${{ steps.clean.outcome }}
          BOTH: ${{ steps.both.outcome }}
        run: |
          echo "clean outcome: $CLEAN"
          echo "both outcome: $BOTH"
          if [ "$CLEAN" != "success" ]; then
            echo "FAIL: clean-only scan should succeed"
            exit 1
          fi
          if [ "$BOTH" != "failure" ]; then
            echo "FAIL: scan of both paths should detect secret in the second path"
            exit 1
          fi
          echo "PASS"
