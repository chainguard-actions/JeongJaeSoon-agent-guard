name: Test multiple paths scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-install gitleaks so the action skips download
        run: |
          set -euo pipefail
          VERSION="8.30.1"
          OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64|amd64) ARCH="x64" ;;
            arm64|aarch64) ARCH="arm64" ;;
          esac
          ARCHIVE="gitleaks_${VERSION}_${OS}_${ARCH}.tar.gz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ARCHIVE}"
          TMP="$(mktemp -d)"
          curl -fsSL "$URL" -o "$TMP/$ARCHIVE"
          tar -xzf "$TMP/$ARCHIVE" -C "$TMP"
          sudo mv "$TMP/gitleaks" /usr/local/bin/gitleaks
          sudo chmod +x /usr/local/bin/gitleaks
          gitleaks version

      - name: Create multiple clean directories to scan
        run: |
          mkdir -p /tmp/multi-scan-a
          mkdir -p /tmp/multi-scan-b
          echo "# Directory A" > /tmp/multi-scan-a/README.md
          echo "foo=bar" > /tmp/multi-scan-a/settings.conf
          echo "# Directory B" > /tmp/multi-scan-b/README.md
          echo "baz=qux" > /tmp/multi-scan-b/settings.conf

      - id: action
        uses: .
        with:
          paths: "/tmp/multi-scan-a /tmp/multi-scan-b"
          require-checksum: "false"

      - name: Assert action succeeded scanning multiple paths
        run: |
          echo "PASS: action completed successfully scanning multiple paths"
