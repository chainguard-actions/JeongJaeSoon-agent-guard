name: Test scanning multiple paths
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create two clean directories to scan
      - name: Create clean test directories
        run: |
          mkdir -p /tmp/multi-path-test/dir1
          mkdir -p /tmp/multi-path-test/dir2
          echo "# Dir 1 readme" > /tmp/multi-path-test/dir1/README.md
          echo "# Dir 2 readme" > /tmp/multi-path-test/dir2/README.md
          echo "key: value" > /tmp/multi-path-test/dir2/config.yaml

      # Scan multiple paths (whitespace-separated)
      - id: action
        uses: .
        with:
          paths: "/tmp/multi-path-test/dir1 /tmp/multi-path-test/dir2"
          gitleaks-version: "8.30.1"
          require-checksum: "false"

      - name: Assert multi-path scan succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected multi-path scan to succeed on clean directories, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: multi-path scan completed successfully"
