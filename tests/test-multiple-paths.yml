name: Test multiple whitespace-separated paths
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Resolve gitleaks checksum
        id: sum
        run: |
          set -euo pipefail
          v=8.30.1
          arch="$(uname -m)"
          case "$arch" in x86_64|amd64) arch=x64 ;; arm64|aarch64) arch=arm64 ;; esac
          sum="$(curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_checksums.txt" \
            | awk -v a="gitleaks_${v}_linux_${arch}.tar.gz" '$2==a{print $1}')"
          [ -n "$sum" ] || { echo "FAIL: could not resolve checksum"; exit 1; }
          echo "checksum=$sum" >> "$GITHUB_OUTPUT"
      - name: Create targets
        run: |
          set -euo pipefail
          mkdir -p agent-guard-multi/a agent-guard-multi/b agent-guard-multi/c
          printf 'alpha\n' > agent-guard-multi/a/one.txt
          printf 'beta\n' > agent-guard-multi/b/two.txt
          rand="$(head -c 400 /dev/urandom | tr -dc 'A-Za-z0-9' | head -c 36)"
          printf 'token: %s%s\n' "ghp_" "$rand" > agent-guard-multi/c/leak.txt
      - id: clean
        uses: .
        with:
          paths: agent-guard-multi/a agent-guard-multi/b
          gitleaks-checksum: ${{ steps.sum.outputs.checksum }}
      - id: leaky
        uses: .
        continue-on-error: true
        with:
          paths: agent-guard-multi/a agent-guard-multi/b agent-guard-multi/c
          gitleaks-checksum: ${{ steps.sum.outputs.checksum }}
      - name: Assert outcomes
        env:
          CLEAN: ${{ steps.clean.outcome }}
          LEAKY: ${{ steps.leaky.outcome }}
        run: |
          echo "clean: $CLEAN leaky: $LEAKY"
          if [ "$CLEAN" != "success" ]; then
            echo "FAIL: clean multi-path scan should succeed"
            exit 1
          fi
          if [ "$LEAKY" != "failure" ]; then
            echo "FAIL: scan including leaky path should fail"
            exit 1
          fi
          echo "PASS"
