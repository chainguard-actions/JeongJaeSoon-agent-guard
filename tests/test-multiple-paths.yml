name: Test multiple whitespace-separated paths (secret in second path)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create two directories
        run: |
          mkdir -p "$RUNNER_TEMP/p1" "$RUNNER_TEMP/p2"
          echo "clean content" > "$RUNNER_TEMP/p1/a.txt"
          body="$(head -c 1200 /dev/urandom | base64 -w 64)"
          {
            echo "-----BEGIN RSA PRIVATE KEY-----"
            echo "$body"
            echo "-----END RSA PRIVATE KEY-----"
          } > "$RUNNER_TEMP/p2/id_rsa"
      - id: clean
        uses: .
        with:
          paths: ${{ runner.temp }}/p1
          require-checksum: "false"
      - id: action
        uses: .
        continue-on-error: true
        with:
          paths: |
            ${{ runner.temp }}/p1
            ${{ runner.temp }}/p2
          require-checksum: "false"
      - name: Assert second path was scanned
        env:
          CLEAN: ${{ steps.clean.outcome }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "clean: $CLEAN multi: $OUTCOME"
          if [ "$CLEAN" != "success" ]; then
            echo "FAIL: clean path alone should succeed"
            exit 1
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure since second path contains a secret"
            exit 1
          fi
          echo "PASS"
