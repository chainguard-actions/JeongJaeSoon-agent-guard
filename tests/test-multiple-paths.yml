name: Test scanning multiple paths
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create multiple clean directories to scan
        run: |
          mkdir -p /tmp/multi-scan-a
          mkdir -p /tmp/multi-scan-b
          echo "export const greeting = 'hello';" > /tmp/multi-scan-a/index.js
          echo "# Documentation" > /tmp/multi-scan-b/docs.md
          echo "No secrets here." >> /tmp/multi-scan-b/docs.md

      - name: Run Agent Guard on multiple clean paths
        id: action
        uses: .
        with:
          paths: /tmp/multi-scan-a /tmp/multi-scan-b
          require-checksum: "false"

      - name: Assert action succeeded for multiple paths
        run: |
          echo "Agent Guard scan completed successfully on multiple clean directories"
          echo "PASS"
