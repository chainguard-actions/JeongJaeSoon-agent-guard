name: Test scanning multiple paths
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create multiple clean directories to scan
        run: |
          mkdir -p /tmp/multi-scan-a
          echo "export function greet() { return 'hello'; }" > /tmp/multi-scan-a/index.js
          echo "# Project A" > /tmp/multi-scan-a/README.md

          mkdir -p /tmp/multi-scan-b
          echo "def main(): pass" > /tmp/multi-scan-b/main.py
          echo "# Project B" > /tmp/multi-scan-b/README.md

      - name: Run Agent Guard on multiple paths
        id: action
        uses: .
        with:
          paths: /tmp/multi-scan-a /tmp/multi-scan-b
          require-checksum: "false"

      - name: Assert action succeeded on multiple paths
        run: |
          echo "PASS: action completed successfully scanning multiple paths"
