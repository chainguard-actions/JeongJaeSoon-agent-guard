name: Test scanning multiple paths
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create multiple clean directories to scan
        run: |
          mkdir -p "$RUNNER_TEMP/multi-scan-a"
          echo "export const greeting = 'hello';" > "$RUNNER_TEMP/multi-scan-a/index.js"
          echo "version: 1.0.0" > "$RUNNER_TEMP/multi-scan-a/config.yaml"

          mkdir -p "$RUNNER_TEMP/multi-scan-b"
          echo "# Documentation" > "$RUNNER_TEMP/multi-scan-b/README.md"
          echo "PORT=8080" > "$RUNNER_TEMP/multi-scan-b/settings.txt"

      - name: Run Agent Guard on multiple clean paths
        id: action
        uses: .
        with:
          paths: ${{ runner.temp }}/multi-scan-a ${{ runner.temp }}/multi-scan-b
          gitleaks-checksum: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

      - name: Assert action succeeded scanning multiple paths
        run: |
          echo "PASS: action completed successfully scanning multiple clean paths"
