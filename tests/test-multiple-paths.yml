name: Test multiple paths scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create multiple clean directories to scan
        run: |
          mkdir -p /tmp/multi-scan/dir1
          mkdir -p /tmp/multi-scan/dir2
          echo "export const API_URL = 'https://api.example.com';" > /tmp/multi-scan/dir1/config.js
          echo "# Documentation" > /tmp/multi-scan/dir2/docs.md
          echo "version: 1.0.0" > /tmp/multi-scan/dir2/version.txt

      - name: Install gitleaks (pre-install to avoid checksum requirement)
        run: |
          VERSION=8.30.1
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64|amd64) ARCH="x64" ;;
            arm64|aarch64) ARCH="arm64" ;;
          esac
          ARCHIVE="gitleaks_${VERSION}_${OS}_${ARCH}.tar.gz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ARCHIVE}"
          TMP=$(mktemp -d)
          curl -fsSL "$URL" -o "$TMP/$ARCHIVE"
          tar -xzf "$TMP/$ARCHIVE" -C "$TMP"
          sudo mv "$TMP/gitleaks" /usr/local/bin/gitleaks
          sudo chmod +x /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Agent Guard on multiple paths
        id: action
        uses: .
        with:
          paths: /tmp/multi-scan/dir1 /tmp/multi-scan/dir2
          require-checksum: "false"

      - name: Assert action succeeded scanning multiple paths
        run: |
          echo "Action completed successfully scanning multiple paths"
          echo "PASS"
