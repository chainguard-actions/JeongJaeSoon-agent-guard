name: Test scanning multiple paths
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install gitleaks for testing
        run: |
          set -euo pipefail
          version="8.30.1"
          os="linux"
          arch="x64"
          archive="gitleaks_${version}_${os}_${arch}.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          tmp="$(mktemp -d)"
          curl -fsSL "$url" -o "$tmp/$archive"
          tar -xzf "$tmp/$archive" -C "$tmp"
          sudo mv "$tmp/gitleaks" /usr/local/bin/gitleaks
          sudo chmod +x /usr/local/bin/gitleaks
          gitleaks version

      - name: Create multiple clean test directories
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-path-a"
          echo "# Module A" > "$GITHUB_WORKSPACE/test-path-a/README.md"
          echo "export default function a() { return 'a'; }" > "$GITHUB_WORKSPACE/test-path-a/index.js"

          mkdir -p "$GITHUB_WORKSPACE/test-path-b"
          echo "# Module B" > "$GITHUB_WORKSPACE/test-path-b/README.md"
          echo "export default function b() { return 'b'; }" > "$GITHUB_WORKSPACE/test-path-b/index.js"

      - id: action
        uses: .
        with:
          paths: "${{ github.workspace }}/test-path-a ${{ github.workspace }}/test-path-b"
          require-checksum: "false"

      - name: Assert action succeeded scanning multiple paths
        run: |
          echo "Action completed successfully scanning multiple clean paths"
          echo "PASS"
