name: Test scanning multiple paths
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install gitleaks for testing
        run: |
          set -euo pipefail
          version="8.30.1"
          os="linux"
          arch="x64"
          archive="gitleaks_${version}_${os}_${arch}.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          tmp="$(mktemp -d)"
          curl -fsSL "$url" -o "$tmp/$archive"
          tar -xzf "$tmp/$archive" -C "$tmp"
          sudo mv "$tmp/gitleaks" /usr/local/bin/gitleaks
          sudo chmod +x /usr/local/bin/gitleaks
          gitleaks version

      - name: Create multiple clean directories to scan
        run: |
          mkdir -p /tmp/multi-scan-a
          mkdir -p /tmp/multi-scan-b
          echo "export function greet(name) { return 'Hello ' + name; }" > /tmp/multi-scan-a/greet.js
          echo "# Module B" > /tmp/multi-scan-b/README.md
          echo "version: 1.0.0" > /tmp/multi-scan-b/config.yaml

      - name: Run Agent Guard on multiple clean paths
        id: action
        uses: .
        with:
          paths: /tmp/multi-scan-a /tmp/multi-scan-b
          require-checksum: "false"

      - name: Assert action succeeded (no secrets in any path)
        run: |
          echo "Action completed successfully - no secrets detected in multiple clean paths"
          echo "PASS"
