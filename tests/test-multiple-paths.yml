name: Test multiple whitespace-separated clean paths
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create two clean directories
        run: |
          mkdir -p ag-scan-one ag-scan-two
          printf 'alpha\n' > ag-scan-one/a.txt
          printf 'beta\n' > ag-scan-two/b.txt
      - id: action
        uses: .
        with:
          paths: "ag-scan-one   ag-scan-two"
          require-checksum: "false"
      - name: Assert success
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          echo "PASS"
