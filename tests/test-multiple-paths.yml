name: Test multiple whitespace-separated paths are all scanned
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Resolve gitleaks checksum
        id: sum
        shell: bash
        run: |
          set -euo pipefail
          v=8.30.1
          case "$(uname -m)" in
            x86_64|amd64) a=x64 ;;
            arm64|aarch64) a=arm64 ;;
          esac
          sum=$(curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_checksums.txt" \
            | awk -v f="gitleaks_${v}_linux_${a}.tar.gz" '$2==f{print $1}')
          [ -n "$sum" ] || { echo "could not resolve checksum"; exit 1; }
          echo "checksum=$sum" >> "$GITHUB_OUTPUT"
      - name: Create scan targets
        shell: bash
        run: |
          mkdir -p scan-target/a scan-target/b scan-target/c
          printf 'alpha\n' > scan-target/a/one.txt
          printf 'beta\n' > scan-target/b/two.txt
          prefix="gh""p_"
          token="${prefix}R7kQ2mZx9VbN4pLs8TfW1yHc6JdG3eUa5XoK"
          printf 'TOKEN=%s\n' "$token" > scan-target/c/three.env
      - name: Two clean paths
        id: clean
        uses: .
        with:
          paths: "scan-target/a scan-target/b"
          gitleaks-checksum: ${{ steps.sum.outputs.checksum }}
      - name: Clean path followed by leaky path
        id: action
        uses: .
        continue-on-error: true
        with:
          paths: |
            scan-target/a
            scan-target/c
          gitleaks-checksum: ${{ steps.sum.outputs.checksum }}
      - name: Assert outcomes
        env:
          CLEAN: ${{ steps.clean.outcome }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "clean outcome: $CLEAN"
          echo "mixed outcome: $OUTCOME"
          if [ "$CLEAN" != "success" ]; then
            echo "FAIL: two clean paths should pass"
            exit 1
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: leak in the second path should fail the scan"
            exit 1
          fi
          echo "PASS"
