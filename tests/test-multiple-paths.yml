name: Test multiple paths scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create multiple clean directories to scan
        run: |
          mkdir -p /tmp/multi-scan-a /tmp/multi-scan-b
          echo "export const greet = (name) => 'Hello, ' + name;" > /tmp/multi-scan-a/utils.js
          echo "# Project B" > /tmp/multi-scan-b/README.md
          echo "version: 1.0.0" > /tmp/multi-scan-b/config.yaml

      - name: Run Agent Guard on multiple clean paths
        id: action
        uses: .
        with:
          paths: /tmp/multi-scan-a /tmp/multi-scan-b
          require-checksum: "false"

      - name: Assert action succeeded (no secrets in any path)
        run: |
          echo "PASS: action completed without detecting secrets across multiple clean directories"
