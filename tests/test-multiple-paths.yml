name: Test multiple paths scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="8.30.1"
          OS="linux"
          ARCH="x64"
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_${OS}_${ARCH}.tar.gz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ARCHIVE}"
          TMP=$(mktemp -d)
          curl -fsSL "$URL" -o "$TMP/$ARCHIVE"
          tar -xzf "$TMP/$ARCHIVE" -C "$TMP"
          sudo mv "$TMP/gitleaks" /usr/local/bin/gitleaks
          sudo chmod +x /usr/local/bin/gitleaks
          gitleaks version

      - name: Create multiple clean directories to scan
        run: |
          mkdir -p /tmp/multi-scan/dir1
          mkdir -p /tmp/multi-scan/dir2
          echo "export const greeting = 'hello';" > /tmp/multi-scan/dir1/index.js
          echo "# Documentation" > /tmp/multi-scan/dir2/README.md
          echo "version: 1.0.0" > /tmp/multi-scan/dir2/config.yaml

      - name: Run Agent Guard on multiple paths
        id: action
        uses: .
        with:
          paths: /tmp/multi-scan/dir1 /tmp/multi-scan/dir2
          require-checksum: "false"

      - name: Assert action succeeded for multiple clean paths
        run: |
          echo "PASS: action completed successfully scanning multiple clean paths"
