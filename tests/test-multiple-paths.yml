name: Test multiple paths scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create multiple clean directories to scan
        run: |
          mkdir -p /tmp/multi-scan-dir1
          mkdir -p /tmp/multi-scan-dir2
          echo "console.log('app1');" > /tmp/multi-scan-dir1/app.js
          echo "console.log('app2');" > /tmp/multi-scan-dir2/app.js
          echo "# Config" > /tmp/multi-scan-dir1/config.yaml
          echo "# Config" > /tmp/multi-scan-dir2/config.yaml

      - name: Run Agent Guard on multiple clean directories
        id: action
        uses: .
        with:
          paths: /tmp/multi-scan-dir1 /tmp/multi-scan-dir2
          require-checksum: "false"

      - name: Assert multiple path scan succeeded
        run: |
          echo "PASS: multiple path scan completed successfully with no secrets detected"
