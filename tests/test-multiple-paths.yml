name: Test scanning multiple paths
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-install gitleaks
        run: |
          set -euo pipefail
          if ! command -v gitleaks > /dev/null 2>&1; then
            VERSION="8.30.1"
            OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
            ARCH="$(uname -m)"
            case "$ARCH" in
              x86_64|amd64) ARCH="x64" ;;
              arm64|aarch64) ARCH="arm64" ;;
            esac
            ARCHIVE="gitleaks_${VERSION}_${OS}_${ARCH}.tar.gz"
            URL="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ARCHIVE}"
            TMP="$(mktemp -d)"
            curl -fsSL "$URL" -o "$TMP/$ARCHIVE"
            tar -xzf "$TMP/$ARCHIVE" -C "$TMP"
            sudo mv "$TMP/gitleaks" /usr/local/bin/gitleaks
            sudo chmod +x /usr/local/bin/gitleaks
          fi
          gitleaks version

      - name: Create multiple clean directories to scan
        run: |
          mkdir -p /tmp/multi-scan-a
          mkdir -p /tmp/multi-scan-b
          echo "export const greet = (name) => 'Hello ' + name;" > /tmp/multi-scan-a/greet.js
          echo "# Module A" > /tmp/multi-scan-a/README.md
          echo "def add(a, b): return a + b" > /tmp/multi-scan-b/math.py
          echo "# Module B" > /tmp/multi-scan-b/README.md

      - name: Run Agent Guard on multiple clean paths
        id: action
        uses: .
        with:
          paths: /tmp/multi-scan-a /tmp/multi-scan-b
          require-checksum: "false"

      - name: Assert action succeeded for multiple clean paths
        run: |
          echo "Action completed successfully - no secrets detected in multiple clean directories"
          echo "PASS"
