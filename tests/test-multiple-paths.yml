name: Test multiple whitespace-separated paths, one containing a secret
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create directories
        run: |
          mkdir -p agent-guard-a agent-guard-b
          printf 'clean file\n' > agent-guard-a/readme.txt
          tok="ghp_$(LC_ALL=C tr -dc 'A-Za-z0-9' </dev/urandom | head -c 36)"
          printf 'GITHUB_TOKEN=%s\n' "$tok" > agent-guard-b/secrets.env
      - id: clean
        name: Scan only clean path
        uses: .
        with:
          paths: agent-guard-a
          require-checksum: "false"
      - id: both
        name: Scan both paths (second contains a secret)
        uses: .
        continue-on-error: true
        with:
          paths: |
            agent-guard-a
            agent-guard-b
          require-checksum: "false"
      - name: Assert outcomes
        env:
          CLEAN: ${{ steps.clean.outcome }}
          BOTH: ${{ steps.both.outcome }}
        run: |
          echo "clean: $CLEAN both: $BOTH"
          if [ "$CLEAN" != "success" ]; then
            echo "FAIL: clean-only scan should succeed"
            exit 1
          fi
          if [ "$BOTH" != "failure" ]; then
            echo "FAIL: scan including the secret path should fail"
            exit 1
          fi
          echo "PASS"
