name: Test multiple paths scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install fake gitleaks (always clean)
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\n# Fake gitleaks: always exits 0 (no secrets found)\nexit 0\n' \
            > "$HOME/.local/bin/gitleaks"
          chmod +x "$HOME/.local/bin/gitleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Create multiple clean directories to scan
        run: |
          mkdir -p /tmp/path-a
          echo "console.log('path a');" > /tmp/path-a/app.js

          mkdir -p /tmp/path-b
          echo "# Path B README" > /tmp/path-b/README.md
          echo "version: 1.0.0" > /tmp/path-b/config.yaml

      - name: Run Agent Guard on multiple paths
        id: action
        uses: .
        with:
          paths: /tmp/path-a /tmp/path-b
          require-checksum: "false"

      - name: Assert action succeeded scanning multiple paths
        run: |
          echo "Action completed successfully scanning multiple paths"
          echo "PASS"
