name: Test scan of a clean path succeeds
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Resolve gitleaks checksum
        id: sum
        run: |
          set -euo pipefail
          version=8.30.1
          arch="$(uname -m)"
          case "$arch" in
            x86_64|amd64) arch=x64 ;;
            arm64|aarch64) arch=arm64 ;;
          esac
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_checksums.txt" -o "$RUNNER_TEMP/gl-checksums.txt"
          sum="$(grep " gitleaks_${version}_linux_${arch}.tar.gz\$" "$RUNNER_TEMP/gl-checksums.txt" | awk '{print $1}')"
          echo "checksum: $sum"
          [ -n "$sum" ] || { echo "FAIL: could not resolve checksum"; exit 1; }
          echo "checksum=$sum" >> "$GITHUB_OUTPUT"
      - name: Create clean scan target
        run: |
          mkdir -p agent-guard-clean
          printf 'hello world\nthis file has no secrets\n' > agent-guard-clean/readme.txt
          printf 'name: demo\nvalue: 42\n' > agent-guard-clean/config.yml
      - id: action
        uses: .
        with:
          paths: agent-guard-clean
          gitleaks-version: "8.30.1"
          gitleaks-checksum: ${{ steps.sum.outputs.checksum }}
      - name: Assert gitleaks available and action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if ! command -v gitleaks >/dev/null; then
            echo "FAIL: gitleaks not on PATH after action"
            exit 1
          fi
          gitleaks version || true
          echo "PASS"
