name: Test clean path scan with pinned checksum
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Record whether gitleaks is preinstalled
        id: pre
        run: |
          if command -v gitleaks >/dev/null; then
            echo "preinstalled=true" >> "$GITHUB_OUTPUT"
          else
            echo "preinstalled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Resolve gitleaks checksum
        id: sum
        run: |
          set -euo pipefail
          v=8.30.1
          arch="$(uname -m)"
          case "$arch" in x86_64|amd64) arch=x64 ;; arm64|aarch64) arch=arm64 ;; esac
          sum="$(curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_checksums.txt" \
            | awk -v a="gitleaks_${v}_linux_${arch}.tar.gz" '$2==a{print $1}')"
          echo "checksum: $sum"
          [ -n "$sum" ] || { echo "FAIL: could not resolve checksum"; exit 1; }
          echo "checksum=$sum" >> "$GITHUB_OUTPUT"
      - name: Create clean scan target
        run: |
          mkdir -p agent-guard-clean
          printf 'hello world\nthis file has no secrets\n' > agent-guard-clean/readme.txt
          printf 'name: demo\nversion: 1.0.0\n' > agent-guard-clean/config.yml
      - id: action
        uses: .
        with:
          paths: agent-guard-clean
          gitleaks-checksum: ${{ steps.sum.outputs.checksum }}
      - name: Assert gitleaks available and action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PRE: ${{ steps.pre.outputs.preinstalled }}
        run: |
          echo "outcome: $OUTCOME preinstalled: $PRE"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if ! command -v gitleaks >/dev/null; then
            echo "FAIL: gitleaks not on PATH after action"
            exit 1
          fi
          if [ "$PRE" = "false" ] && [ ! -x "$RUNNER_TEMP/agent-guard-bin/gitleaks" ]; then
            echo "FAIL: gitleaks not installed into RUNNER_TEMP/agent-guard-bin"
            exit 1
          fi
          gitleaks version || true
          echo "PASS"
