name: Test clean path scan passes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create clean scan target
        run: |
          mkdir -p agent-guard-clean
          printf 'hello world\nnothing secret here\n' > agent-guard-clean/readme.txt
          printf 'export const answer = 42;\n' > agent-guard-clean/index.js
      - id: action
        uses: .
        with:
          paths: agent-guard-clean
          require-checksum: "false"
      - name: Assert scan succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          echo "PASS"
