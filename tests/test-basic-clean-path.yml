name: Test basic clean path scan with pinned checksum
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Resolve official gitleaks checksum
        id: sum
        run: |
          set -euo pipefail
          version=8.30.1
          case "$(uname -m)" in
            x86_64|amd64) arch=x64 ;;
            arm64|aarch64) arch=arm64 ;;
          esac
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_checksums.txt" -o "$RUNNER_TEMP/gl-sums.txt"
          sum="$(awk -v f="gitleaks_${version}_linux_${arch}.tar.gz" '$2==f {print $1}' "$RUNNER_TEMP/gl-sums.txt")"
          echo "checksum: $sum"
          if [ -z "$sum" ]; then echo "FAIL: could not resolve checksum"; exit 1; fi
          echo "checksum=$sum" >> "$GITHUB_OUTPUT"
      - name: Create clean directory
        run: |
          mkdir -p agent-guard-clean
          printf 'hello world\nnothing secret here\n' > agent-guard-clean/readme.txt
          printf 'name = "demo"\nversion = "1.0.0"\n' > agent-guard-clean/config.toml
      - id: action
        uses: .
        with:
          paths: agent-guard-clean
          gitleaks-checksum: ${{ steps.sum.outputs.checksum }}
      - name: Assert action succeeded and gitleaks is available
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if ! command -v gitleaks >/dev/null; then
            echo "FAIL: gitleaks not on PATH after action"
            exit 1
          fi
          gitleaks version
          echo "PASS"
