name: Test basic clean scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a clean directory to scan
        run: |
          mkdir -p /tmp/clean-scan-dir
          echo "console.log('hello world');" > /tmp/clean-scan-dir/app.js
          echo "# README" > /tmp/clean-scan-dir/README.md
          echo "name: my-app" > /tmp/clean-scan-dir/package.json

      - name: Run Agent Guard on clean directory
        id: action
        uses: .
        with:
          paths: /tmp/clean-scan-dir
          require-checksum: "false"

      - name: Assert clean scan succeeded
        run: |
          echo "PASS: clean directory scan completed without secrets detected"
