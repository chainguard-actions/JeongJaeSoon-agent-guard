name: Test basic clean path scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-install mock gitleaks so the action skips the download step
        run: |
          mkdir -p "$RUNNER_TEMP/mock-bin"
          cp "$GITHUB_WORKSPACE/tests/fixtures/mock-gitleaks" "$RUNNER_TEMP/mock-bin/gitleaks"
          chmod +x "$RUNNER_TEMP/mock-bin/gitleaks"
          echo "$RUNNER_TEMP/mock-bin" >> "$GITHUB_PATH"

      - name: Create a clean directory to scan
        run: |
          mkdir -p /tmp/clean-scan
          echo "console.log('hello world');" > /tmp/clean-scan/app.js
          echo "# README" > /tmp/clean-scan/README.md

      - name: Run Agent Guard on clean directory
        id: action
        uses: .
        with:
          paths: /tmp/clean-scan
          require-checksum: "false"

      - name: Assert action succeeded (clean directory should not trigger findings)
        run: |
          echo "Action completed successfully on clean directory"
          echo "PASS"
