name: Test basic clean scan (no secrets)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a clean directory to scan
        run: |
          mkdir -p /tmp/clean-scan-target
          echo "# Hello World" > /tmp/clean-scan-target/README.md
          echo "name: my-project" > /tmp/clean-scan-target/config.yaml
          echo "version: 1.0.0" >> /tmp/clean-scan-target/config.yaml
          git init /tmp/clean-scan-target
          git -C /tmp/clean-scan-target config user.email "test@example.com"
          git -C /tmp/clean-scan-target config user.name "Test"
          git -C /tmp/clean-scan-target add .
          git -C /tmp/clean-scan-target commit -m "init"

      - id: action
        uses: .
        with:
          paths: /tmp/clean-scan-target
          require-checksum: "false"

      - name: Assert action succeeded (no secrets found)
        run: |
          echo "PASS: action completed successfully with no secrets detected"
