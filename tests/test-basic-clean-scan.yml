name: Test basic clean scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Agent Guard on clean fixture directory
        id: action
        uses: .
        with:
          paths: "tests/fixtures/clean-dir"
          require-checksum: "false"

      - name: Assert scan completed successfully
        run: |
          echo "PASS: Agent Guard scan completed with no secrets detected"
