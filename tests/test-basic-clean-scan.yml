name: Test basic clean scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a clean directory with no secrets
        run: |
          mkdir -p /tmp/clean-scan-target
          echo "console.log('hello world');" > /tmp/clean-scan-target/app.js
          echo "# README" > /tmp/clean-scan-target/README.md
          echo "name: my-package" > /tmp/clean-scan-target/package.json

      - name: Install gitleaks (pre-install to avoid checksum requirement)
        run: |
          version="8.30.1"
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m)"
          case "$arch" in
            x86_64|amd64) arch="x64" ;;
            arm64|aarch64) arch="arm64" ;;
          esac
          archive="gitleaks_${version}_${os}_${arch}.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          tmp="$(mktemp -d)"
          curl -fsSL "$url" -o "$tmp/$archive"
          tar -xzf "$tmp/$archive" -C "$tmp"
          sudo mv "$tmp/gitleaks" /usr/local/bin/gitleaks
          sudo chmod +x /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Agent Guard on clean directory
        id: action
        uses: .
        with:
          paths: /tmp/clean-scan-target
          require-checksum: "false"

      - name: Assert action succeeded (clean scan exits 0)
        run: |
          echo "PASS: Agent Guard completed successfully on clean directory"
