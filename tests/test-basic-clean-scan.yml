name: Test basic clean scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install fake gitleaks to avoid network download
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fake-bin"
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-gitleaks-clean.sh" "$RUNNER_TEMP/fake-bin/gitleaks"
          chmod +x "$RUNNER_TEMP/fake-bin/gitleaks"
          echo "$RUNNER_TEMP/fake-bin" >> "$GITHUB_PATH"

      - name: Create a clean scan target directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/clean-scan-target"
          echo "# Hello World" > "$GITHUB_WORKSPACE/clean-scan-target/README.md"
          echo "name: my-project" > "$GITHUB_WORKSPACE/clean-scan-target/config.yaml"
          echo "version: 1.0.0" >> "$GITHUB_WORKSPACE/clean-scan-target/config.yaml"

      - id: action
        name: Run agent-guard on clean subdirectory
        uses: .
        with:
          paths: clean-scan-target
          require-checksum: "false"

      - name: Assert action succeeded (no secrets found)
        run: |
          echo "PASS: action completed successfully with no secrets detected"
