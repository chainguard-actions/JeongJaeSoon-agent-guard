name: Test basic clean scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install fake gitleaks (always clean)
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\n# Fake gitleaks: always exits 0 (no secrets found)\nexit 0\n' \
            > "$HOME/.local/bin/gitleaks"
          chmod +x "$HOME/.local/bin/gitleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Create clean directory to scan
        run: |
          mkdir -p /tmp/clean-dir
          echo "console.log('hello world');" > /tmp/clean-dir/app.js
          echo "# README" > /tmp/clean-dir/README.md
          echo "name: my-app" > /tmp/clean-dir/package.json

      - name: Run Agent Guard on clean directory
        id: action
        uses: .
        with:
          paths: /tmp/clean-dir
          require-checksum: "false"

      - name: Assert action succeeded (no secrets found)
        run: |
          echo "Action completed successfully - no secrets detected in clean directory"
          echo "PASS"
