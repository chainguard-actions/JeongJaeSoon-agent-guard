name: Test clean scan (no secrets)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a clean directory to scan
        run: |
          mkdir -p "$GITHUB_WORKSPACE/scan-target"
          echo "console.log('hello world');" > "$GITHUB_WORKSPACE/scan-target/app.js"
          echo "# README" > "$GITHUB_WORKSPACE/scan-target/README.md"
          echo "name=myapp" > "$GITHUB_WORKSPACE/scan-target/config.txt"

      - name: Run Agent Guard on clean directory
        id: action
        uses: .
        with:
          paths: "${{ github.workspace }}/scan-target"
          require-checksum: "false"

      - name: Assert action succeeded (no secrets found)
        run: |
          echo "PASS: action completed without detecting secrets in clean directory"
