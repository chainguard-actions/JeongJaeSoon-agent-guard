name: Test clean directory scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create clean scan target
        run: |
          mkdir -p "$GITHUB_WORKSPACE/scan-target-clean"
          printf 'hello world\nThis file contains no secrets.\n' > "$GITHUB_WORKSPACE/scan-target-clean/readme.txt"
          printf 'def add(a, b):\n    return a + b\n' > "$GITHUB_WORKSPACE/scan-target-clean/math.py"
      - id: action
        uses: .
        with:
          paths: scan-target-clean
          require-checksum: "false"
      - name: Assert action succeeded and gitleaks is available
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if ! command -v gitleaks >/dev/null; then
            echo "FAIL: gitleaks not on PATH after action"
            exit 1
          fi
          gitleaks version || true
          echo "PASS"
