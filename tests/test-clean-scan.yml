name: Test clean directory scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Pre-install the mock gitleaks so the action skips the download step.
      # Under act, $GITHUB_WORKSPACE is the action directory itself.
      - name: Install mock gitleaks
        run: |
          MOCK="$GITHUB_WORKSPACE/tests/fixtures/mock-gitleaks"
          if [ ! -f "$MOCK" ]; then
            # Fallback: try repo-root-relative path (real GitHub Actions runner)
            MOCK="$GITHUB_WORKSPACE/pristine/JeongJaeSoon--agent-guard/v1.3.7/tests/fixtures/mock-gitleaks"
          fi
          sudo cp "$MOCK" /usr/local/bin/gitleaks
          sudo chmod +x /usr/local/bin/gitleaks
          gitleaks version

      # Create a clean directory with no secrets
      - name: Create clean test directory
        run: |
          mkdir -p /tmp/clean-test
          echo "console.log('hello world');" > /tmp/clean-test/app.js
          echo "# README" > /tmp/clean-test/README.md

      - name: Run Agent Guard on clean directory
        id: action
        uses: .
        with:
          paths: /tmp/clean-test
          require-checksum: "false"

      - name: Assert scan passed (exit 0 means no secrets found)
        run: |
          echo "PASS: Agent Guard completed without detecting secrets in clean directory"
