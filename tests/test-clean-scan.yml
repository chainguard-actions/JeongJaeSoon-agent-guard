name: Test clean scan passes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Resolve gitleaks checksum
        id: sum
        shell: bash
        run: |
          set -euo pipefail
          v=8.30.1
          case "$(uname -m)" in
            x86_64|amd64) a=x64 ;;
            arm64|aarch64) a=arm64 ;;
          esac
          sum=$(curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_checksums.txt" \
            | awk -v f="gitleaks_${v}_linux_${a}.tar.gz" '$2==f{print $1}')
          [ -n "$sum" ] || { echo "could not resolve checksum"; exit 1; }
          echo "checksum: $sum"
          echo "checksum=$sum" >> "$GITHUB_OUTPUT"
      - name: Create clean scan target
        run: |
          mkdir -p scan-target/clean
          printf 'hello world\nconst answer = 42;\n' > scan-target/clean/app.js
          printf '# Readme\nNothing secret here.\n' > scan-target/clean/README.md
      - id: action
        uses: .
        with:
          paths: scan-target/clean
          gitleaks-checksum: ${{ steps.sum.outputs.checksum }}
      - name: Assert gitleaks installed and scan passed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if ! command -v gitleaks >/dev/null && [ ! -x "$RUNNER_TEMP/agent-guard-bin/gitleaks" ]; then
            echo "FAIL: gitleaks not available after action"
            exit 1
          fi
          echo "PASS"
