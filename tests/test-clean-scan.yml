name: Test clean scan passes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Resolve gitleaks checksum
        id: sum
        run: |
          set -euo pipefail
          version=8.30.1
          arch="$(uname -m)"
          case "$arch" in
            x86_64|amd64) arch=x64 ;;
            arm64|aarch64) arch=arm64 ;;
          esac
          archive="gitleaks_${version}_linux_${arch}.tar.gz"
          sum="$(curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_checksums.txt" | awk -v a="$archive" '$2 == a {print $1; exit}')"
          echo "checksum: $sum"
          [ -n "$sum" ] || { echo "FAIL: could not resolve checksum"; exit 1; }
          echo "checksum=$sum" >> "$GITHUB_OUTPUT"
      - name: Create clean directory
        run: |
          mkdir -p ag-clean-scan
          printf 'hello world\nnothing secret here\n' > ag-clean-scan/readme.txt
          printf 'def add(a, b):\n    return a + b\n' > ag-clean-scan/main.py
      - id: action
        uses: .
        with:
          paths: ag-clean-scan
          gitleaks-checksum: ${{ steps.sum.outputs.checksum }}
      - name: Assert gitleaks available and scan succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if ! command -v gitleaks >/dev/null; then
            echo "FAIL: gitleaks not on PATH after action"
            exit 1
          fi
          gitleaks version
          echo "PASS"
