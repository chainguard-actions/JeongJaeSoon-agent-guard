name: Test clean directory scan with verified checksum
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Compute gitleaks archive checksum
        id: sum
        run: |
          set -euo pipefail
          version=8.30.1
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          case "$(uname -m)" in
            x86_64|amd64) arch=x64 ;;
            arm64|aarch64) arch=arm64 ;;
          esac
          archive="gitleaks_${version}_${os}_${arch}.tar.gz"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" -o "/tmp/${archive}"
          sum="$(sha256sum "/tmp/${archive}" | awk '{print $1}')"
          echo "checksum: $sum"
          echo "checksum=$sum" >> "$GITHUB_OUTPUT"
      - name: Create clean scan target
        run: |
          mkdir -p clean-target/sub
          echo "hello world" > clean-target/readme.txt
          printf 'name = "demo"\nversion = "1.0.0"\n' > clean-target/sub/config.toml
      - id: action
        uses: .
        with:
          paths: clean-target
          gitleaks-checksum: ${{ steps.sum.outputs.checksum }}
      - name: Assert action succeeded and gitleaks available
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if ! command -v gitleaks >/dev/null; then
            echo "FAIL: gitleaks not on PATH after action"
            exit 1
          fi
          gitleaks version
          echo "PASS"
