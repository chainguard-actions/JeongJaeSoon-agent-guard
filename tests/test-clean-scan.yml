name: Test clean directory scan passes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create clean scan target
        run: |
          rm -rf scan-clean
          mkdir -p scan-clean/sub
          printf 'hello world\nnothing secret here\n' > scan-clean/readme.txt
          printf 'def add(a, b):\n    return a + b\n' > scan-clean/sub/code.py
      - id: action
        uses: .
        with:
          paths: scan-clean
          require-checksum: "false"
      - name: Assert action succeeded and gitleaks available
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if ! command -v gitleaks >/dev/null; then
            echo "FAIL: gitleaks not on PATH after action"
            exit 1
          fi
          gitleaks version
          echo "PASS"
