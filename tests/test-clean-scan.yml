name: Test clean directory scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install gitleaks for testing
        run: |
          set -euo pipefail
          version="8.30.1"
          os="linux"
          arch="x64"
          archive="gitleaks_${version}_${os}_${arch}.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          tmp="$(mktemp -d)"
          curl -fsSL "$url" -o "$tmp/$archive"
          tar -xzf "$tmp/$archive" -C "$tmp"
          sudo mv "$tmp/gitleaks" /usr/local/bin/gitleaks
          sudo chmod +x /usr/local/bin/gitleaks
          gitleaks version

      - name: Create clean test directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-clean"
          echo "console.log('hello world');" > "$GITHUB_WORKSPACE/test-clean/app.js"
          echo "# README" > "$GITHUB_WORKSPACE/test-clean/README.md"
          echo "name: my-app" > "$GITHUB_WORKSPACE/test-clean/package.json"

      - id: action
        uses: .
        with:
          paths: "${{ github.workspace }}/test-clean"
          require-checksum: "false"

      - name: Assert action succeeded (no secrets found)
        run: |
          echo "Action completed successfully - no secrets detected in clean directory"
          echo "PASS"
