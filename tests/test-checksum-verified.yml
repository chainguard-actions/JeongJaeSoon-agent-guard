name: Test install with verified checksum
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Compute checksum of gitleaks archive and prepare target
        id: sum
        run: |
          set -euo pipefail
          version=8.30.1
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          case "$(uname -m)" in
            x86_64|amd64) arch=x64 ;;
            arm64|aarch64) arch=arm64 ;;
          esac
          archive="gitleaks_${version}_${os}_${arch}.tar.gz"
          tmp="$(mktemp -d)"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" -o "$tmp/$archive"
          sum="$(sha256sum "$tmp/$archive" | awk '{print $1}')"
          echo "checksum: $sum"
          echo "checksum=$sum" >> "$GITHUB_OUTPUT"
          rm -rf "$tmp"
          rm -rf "$GITHUB_WORKSPACE/ag-chk-target"
          mkdir -p "$GITHUB_WORKSPACE/ag-chk-target"
          echo "nothing secret here" > "$GITHUB_WORKSPACE/ag-chk-target/notes.txt"
      - id: action
        uses: .
        with:
          paths: ag-chk-target
          gitleaks-version: "8.30.1"
          gitleaks-checksum: ${{ steps.sum.outputs.checksum }}
      - name: Assert success
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          command -v gitleaks || { echo "FAIL: gitleaks missing"; exit 1; }
          echo "PASS"
