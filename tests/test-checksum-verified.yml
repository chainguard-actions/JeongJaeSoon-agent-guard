name: Test gitleaks auto-install without checksum
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure gitleaks is NOT on PATH (force install path)
        run: |
          set -euo pipefail
          sudo rm -f /usr/local/bin/gitleaks 2>/dev/null || true
          sudo rm -f /usr/bin/gitleaks 2>/dev/null || true
          if command -v gitleaks > /dev/null 2>&1; then
            echo "WARNING: gitleaks still found at $(command -v gitleaks)"
          else
            echo "gitleaks not on PATH — good"
          fi

      - name: Create fake gitleaks archive and intercept curl download
        run: |
          set -euo pipefail

          # Build a minimal fake gitleaks binary from the committed fixture
          mkdir -p /tmp/fake-gitleaks-pkg
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-gitleaks-clean" /tmp/fake-gitleaks-pkg/gitleaks
          chmod +x /tmp/fake-gitleaks-pkg/gitleaks

          # Package it as the tar.gz the action expects
          tar -czf /tmp/fake-gitleaks.tar.gz -C /tmp/fake-gitleaks-pkg gitleaks

          # Install a fake curl that intercepts the gitleaks download URL
          # and serves the fake archive. Supports both pipe form (stdout) and
          # hardened form (-o FILE).
          printf '%s\n' '#!/bin/sh' \
            'out=""' \
            'prev=""' \
            'for arg in "$@"; do' \
            '  case "$prev" in' \
            '    -o|--output) out="$arg" ;;' \
            '  esac' \
            '  prev="$arg"' \
            'done' \
            'case "$*" in' \
            '  *gitleaks*)' \
            '    if [ -n "$out" ]; then' \
            '      cp /tmp/fake-gitleaks.tar.gz "$out"' \
            '    else' \
            '      cat /tmp/fake-gitleaks.tar.gz' \
            '    fi' \
            '    exit 0' \
            '    ;;' \
            'esac' \
            'exec /usr/bin/curl "$@"' \
            > /usr/local/bin/curl
          chmod +x /usr/local/bin/curl

      - name: Run Agent Guard — action should install gitleaks automatically
        id: scan
        uses: .
        with:
          paths: "."
          gitleaks-version: "8.30.1"
          gitleaks-checksum: ""
          require-checksum: "false"

      - name: Assert scan completed successfully
        run: |
          echo "PASS: Agent Guard installed gitleaks and completed the scan successfully"
