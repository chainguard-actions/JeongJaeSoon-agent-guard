name: Test checksum required guard
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Remove gitleaks from PATH to force install path
        run: |
          # Create a PATH that excludes gitleaks so the action must install it
          CLEAN_PATH=$(echo "$PATH" | tr ':' '\n' | grep -v gitleaks | tr '\n' ':' | sed 's/:$//')
          echo "CLEAN_PATH=$CLEAN_PATH" >> "$GITHUB_ENV"
          # Verify gitleaks is gone from the clean path
          if PATH="$CLEAN_PATH" command -v gitleaks > /dev/null 2>&1; then
            echo "gitleaks still found in clean path, test may not exercise install guard"
          else
            echo "gitleaks not found in clean path — install guard will be triggered"
          fi

      - name: Run Agent Guard without checksum (should fail)
        id: action
        uses: .
        with:
          paths: "."
          require-checksum: "true"
          gitleaks-checksum: ""
        continue-on-error: true
        env:
          PATH: ${{ env.CLEAN_PATH }}

      - name: Assert action failed with checksum error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when require-checksum=true and no checksum provided"
            exit 1
          fi
          echo "PASS: action correctly failed when checksum was required but not provided"
