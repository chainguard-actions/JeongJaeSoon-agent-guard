name: Test require-checksum enforcement
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check if gitleaks is pre-installed
        id: check-gitleaks
        run: |
          if command -v gitleaks > /dev/null 2>&1; then
            echo "pre_installed=true" >> "$GITHUB_OUTPUT"
            echo "gitleaks is pre-installed at: $(which gitleaks)"
          else
            echo "pre_installed=false" >> "$GITHUB_OUTPUT"
            echo "gitleaks is not pre-installed - test will proceed"
          fi

      - name: Run Agent Guard without checksum (expect failure due to require-checksum=true)
        id: action
        if: steps.check-gitleaks.outputs.pre_installed == 'false'
        uses: .
        with:
          paths: "."
          require-checksum: "true"
          gitleaks-checksum: ""
        continue-on-error: true

      - name: Assert action failed due to missing checksum
        if: steps.check-gitleaks.outputs.pre_installed == 'false'
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when require-checksum=true and no checksum provided"
            exit 1
          fi
          echo "PASS: action correctly failed when checksum was required but not provided"

      - name: Skip assertion (gitleaks pre-installed)
        if: steps.check-gitleaks.outputs.pre_installed == 'true'
        run: |
          echo "SKIP: gitleaks is pre-installed; require-checksum check is bypassed by the action"
          echo "The require-checksum guard only applies when gitleaks needs to be installed."
          echo "PASS (skipped)"
