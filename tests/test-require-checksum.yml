name: Test require-checksum enforcement
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check if gitleaks is pre-installed
        id: check-gitleaks
        run: |
          if command -v gitleaks > /dev/null 2>&1; then
            echo "preinstalled=true" >> "$GITHUB_OUTPUT"
            echo "gitleaks is already installed; checksum enforcement will be bypassed"
          else
            echo "preinstalled=false" >> "$GITHUB_OUTPUT"
            echo "gitleaks not found; require-checksum enforcement will be tested"
          fi

      - name: Create a clean scan target
        run: |
          mkdir -p "$RUNNER_TEMP/checksum-test"
          echo "# test file" > "$RUNNER_TEMP/checksum-test/README.md"

      - name: Run Agent Guard without checksum (expect failure when gitleaks missing)
        id: action
        uses: .
        with:
          paths: ${{ runner.temp }}/checksum-test
          require-checksum: "true"
          gitleaks-checksum: ""
        continue-on-error: true

      - name: Assert behavior based on gitleaks availability
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PREINSTALLED: ${{ steps.check-gitleaks.outputs.preinstalled }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gitleaks preinstalled: $PREINSTALLED"
          if [ "$PREINSTALLED" = "true" ]; then
            # gitleaks was already installed; action skips the checksum check
            # It may succeed or fail on the scan itself, but NOT due to checksum enforcement
            echo "PASS: gitleaks was pre-installed; checksum enforcement was bypassed as expected"
          else
            # gitleaks not installed; action must fail because checksum is required
            if [ "$OUTCOME" != "failure" ]; then
              echo "FAIL: expected action to fail when gitleaks is missing and require-checksum=true but no checksum provided"
              exit 1
            fi
            echo "PASS: action correctly failed when checksum was required but not provided"
          fi
