name: Test require-checksum enforcement
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure gitleaks is NOT on PATH
        run: |
          # Verify gitleaks is not pre-installed in this environment
          if command -v gitleaks > /dev/null 2>&1; then
            echo "gitleaks is already installed; hiding it for this test"
            sudo mv "$(command -v gitleaks)" /tmp/gitleaks-hidden || true
          fi
          echo "gitleaks not on PATH: confirmed"

      - name: Run agent-guard without checksum (expect failure)
        id: no_checksum
        uses: .
        with:
          paths: .
          require-checksum: "true"
          gitleaks-checksum: ""
        continue-on-error: true

      - name: Assert action failed due to missing checksum
        env:
          OUTCOME: ${{ steps.no_checksum.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when require-checksum=true and no checksum provided, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when checksum was required but not provided"

      - name: Restore gitleaks if it was hidden
        if: always()
        run: |
          if [ -f /tmp/gitleaks-hidden ]; then
            sudo mv /tmp/gitleaks-hidden "$(dirname $(which git))/gitleaks" || true
          fi
