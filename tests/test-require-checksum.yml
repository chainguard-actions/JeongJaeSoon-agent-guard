name: Test checksum required by default
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare clean directory and detect preinstalled gitleaks
        id: pre
        run: |
          rm -rf ag-cksum
          mkdir -p ag-cksum
          echo "clean" > ag-cksum/file.txt
          if command -v gitleaks >/dev/null; then
            echo "preinstalled=true" >> "$GITHUB_OUTPUT"
          else
            echo "preinstalled=false" >> "$GITHUB_OUTPUT"
          fi
      - id: action
        uses: .
        continue-on-error: true
        with:
          paths: ag-cksum
      - name: Assert install refused without checksum
        env:
          PRE: ${{ steps.pre.outputs.preinstalled }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "gitleaks preinstalled: $PRE"
          echo "outcome: $OUTCOME"
          if [ "$PRE" = "true" ]; then
            if [ "$OUTCOME" != "success" ]; then
              echo "FAIL: gitleaks was preinstalled, install should be skipped and clean scan succeed"
              exit 1
            fi
            echo "PASS: install skipped (gitleaks preinstalled)"
          else
            if [ "$OUTCOME" != "failure" ]; then
              echo "FAIL: expected failure when checksum missing and require-checksum=true"
              exit 1
            fi
            if [ -x "$RUNNER_TEMP/agent-guard-bin/gitleaks" ]; then
              echo "FAIL: gitleaks should not have been installed"
              exit 1
            fi
            echo "PASS: refused to install without checksum"
          fi
      - name: Cleanup
        if: always()
        run: rm -rf ag-cksum
