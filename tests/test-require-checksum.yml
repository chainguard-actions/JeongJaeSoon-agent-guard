name: Test require-checksum enforcement
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure gitleaks is NOT on PATH (simulate fresh environment)
        run: |
          # Verify gitleaks is not pre-installed; if it is, skip this test
          if command -v gitleaks > /dev/null 2>&1; then
            echo "gitleaks is already installed; this test requires it to be absent"
            echo "Removing gitleaks from PATH for this test..."
            # We can't easily remove it, so we'll just note it and the action will skip install
            echo "SKIP_REASON=gitleaks_preinstalled" >> "$GITHUB_ENV"
          fi

      - name: Create clean test directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-checksum"
          echo "# test" > "$GITHUB_WORKSPACE/test-checksum/README.md"

      - id: action
        uses: .
        with:
          paths: "${{ github.workspace }}/test-checksum"
          require-checksum: "true"
          gitleaks-checksum: ""
        continue-on-error: true

      - name: Assert behavior based on gitleaks availability
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SKIP_REASON: ${{ env.SKIP_REASON }}
        run: |
          echo "action outcome: $OUTCOME"
          echo "skip reason: $SKIP_REASON"
          if [ "$SKIP_REASON" = "gitleaks_preinstalled" ]; then
            # If gitleaks was already installed, the action skips the install step
            # and proceeds to scan — so it should succeed on a clean directory
            echo "gitleaks was pre-installed; action skipped install and scanned clean dir"
            if [ "$OUTCOME" != "success" ]; then
              echo "FAIL: expected success when gitleaks is pre-installed and dir is clean, got: $OUTCOME"
              exit 1
            fi
            echo "PASS: action succeeded with pre-installed gitleaks"
          else
            # gitleaks not installed, require-checksum=true with no checksum should fail
            if [ "$OUTCOME" != "failure" ]; then
              echo "FAIL: expected action to fail when require-checksum=true and no checksum provided, got: $OUTCOME"
              exit 1
            fi
            echo "PASS: action correctly failed when require-checksum=true and no checksum provided"
          fi
