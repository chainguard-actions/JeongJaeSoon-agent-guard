name: Test require-checksum enforcement
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure gitleaks is NOT on PATH
        run: |
          # Verify gitleaks is not pre-installed (if it is, the checksum check is skipped)
          if command -v gitleaks > /dev/null 2>&1; then
            echo "gitleaks is already installed; this test requires it to be absent"
            echo "Removing from PATH for this test by creating a fake PATH"
            # We can't easily remove it, so skip by marking the test as skipped
            echo "SKIP=true" >> "$GITHUB_ENV"
          else
            echo "SKIP=false" >> "$GITHUB_ENV"
          fi

      - name: Run Agent Guard without checksum when require-checksum=true (expect failure)
        id: action
        if: env.SKIP == 'false'
        uses: .
        with:
          paths: /tmp
          gitleaks-version: "8.30.1"
          gitleaks-checksum: ""
          require-checksum: "true"
        continue-on-error: true

      - name: Assert action failed due to missing checksum
        if: env.SKIP == 'false'
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when gitleaks-checksum is empty and require-checksum=true, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when checksum was required but not provided"

      - name: Skip notice
        if: env.SKIP == 'true'
        run: |
          echo "SKIP: gitleaks was pre-installed; checksum enforcement test skipped"
          echo "PASS: test skipped (gitleaks already present, checksum check bypassed)"
