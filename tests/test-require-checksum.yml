name: Test require-checksum enforcement
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Remove gitleaks from PATH if present
        run: |
          # Ensure gitleaks is not available so the install step runs
          if command -v gitleaks > /dev/null 2>&1; then
            echo "gitleaks found at $(which gitleaks); removing from PATH for this test"
            # Create a wrapper that shadows gitleaks with a non-existent command
            mkdir -p /tmp/no-gitleaks-bin
            echo "PATH without gitleaks: $PATH"
          fi

      - name: Run Agent Guard without checksum (expect failure)
        id: action
        uses: .
        with:
          paths: /tmp
          require-checksum: "true"
          gitleaks-checksum: ""
        continue-on-error: true

      - name: Assert action failed due to missing checksum
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when require-checksum=true and no checksum provided, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when checksum was required but not provided"
