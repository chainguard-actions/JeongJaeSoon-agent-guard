name: Test secret detected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create directory containing a generated secret-like token
        run: |
          mkdir -p "$RUNNER_TEMP/leaky-scan"
          tok="$(head -c 512 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 36)"
          printf 'GITHUB_TOKEN=ghp_%s\n' "$tok" > "$RUNNER_TEMP/leaky-scan/config.env"
          echo "LEAKY_DIR=$RUNNER_TEMP/leaky-scan" >> "$GITHUB_ENV"
      - id: action
        uses: .
        continue-on-error: true
        with:
          paths: ${{ env.LEAKY_DIR }}
          require-checksum: "false"
      - name: Assert scan failed due to detection
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when a secret is present"
            exit 1
          fi
          if ! command -v gitleaks >/dev/null; then
            echo "FAIL: gitleaks was not installed, failure is not from detection"
            exit 1
          fi
          echo "PASS"
