name: Test secret detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mock gitleaks to avoid network download
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mock-bin"
          cp "$GITHUB_WORKSPACE/tests/fixtures/mock-gitleaks" "$RUNNER_TEMP/mock-bin/gitleaks"
          chmod +x "$RUNNER_TEMP/mock-bin/gitleaks"
          echo "$RUNNER_TEMP/mock-bin" >> "$GITHUB_PATH"

      - name: Verify mock gitleaks is on PATH
        run: |
          set -euo pipefail
          which gitleaks
          gitleaks version

      - name: Create a directory with a fake secret
        run: |
          mkdir -p "$GITHUB_WORKSPACE/secret-target"
          printf 'token=AGENT_GUARD_TEST_SECRET\n' \
            > "$GITHUB_WORKSPACE/secret-target/leaked.txt"

      - id: scan
        name: Run Agent Guard scan on directory with a secret (should fail)
        uses: .
        with:
          paths: "secret-target"
          require-checksum: "false"
        continue-on-error: true

      - name: Assert scan detected the secret and failed
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: agent-guard correctly detected the secret and failed"
          else
            echo "FAIL: expected agent-guard to fail when a secret is present, got outcome=$OUTCOME"
            exit 1
          fi
