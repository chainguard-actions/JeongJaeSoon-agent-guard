name: Test secret in scanned path fails the action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a leaky file at runtime
        run: |
          mkdir -p "$GITHUB_WORKSPACE/leaky-dir"
          prefix="gh""p_"
          body="Q7wZr3Tn9KpL2xVb8MfY4cHd6JsA1eUgR0oN"
          printf 'token = "%s%s"\n' "$prefix" "$body" > "$GITHUB_WORKSPACE/leaky-dir/config.txt"
          wc -c "$GITHUB_WORKSPACE/leaky-dir/config.txt"
      - id: action
        uses: .
        continue-on-error: true
        with:
          paths: leaky-dir
          require-checksum: "false"
      - name: Assert action failed because of the finding
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if ! command -v gitleaks >/dev/null; then
            echo "FAIL: gitleaks was not installed, failure is not from the scan"
            exit 1
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when a secret is present"
            exit 1
          fi
          echo "PASS"
