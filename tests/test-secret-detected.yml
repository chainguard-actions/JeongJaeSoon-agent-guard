name: Test secret in scanned path fails the action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create scan target containing a synthetic GitHub token
        run: |
          rm -rf scan-leak
          mkdir -p scan-leak
          tok="ghp_$(head -c 4000 /dev/urandom | tr -dc 'A-Za-z0-9' | head -c 36)"
          printf 'GITHUB_TOKEN=%s\n' "$tok" > scan-leak/config.env
          wc -c scan-leak/config.env
      - id: action
        uses: .
        continue-on-error: true
        with:
          paths: scan-leak
          require-checksum: "false"
      - name: Assert action failed on detected secret
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure because a secret is present"
            exit 1
          fi
          echo "PASS"
