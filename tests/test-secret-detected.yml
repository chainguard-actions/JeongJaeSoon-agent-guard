name: Test secret is detected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Baseline clean scan (installs gitleaks)
        id: clean
        uses: .
        with:
          paths: tests/fixtures/clean
          gitleaks-checksum: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
      - name: Create a file containing a freshly generated private key
        run: |
          mkdir -p "$GITHUB_WORKSPACE/leakscan"
          if command -v openssl >/dev/null; then
            openssl genrsa 2048 > "$GITHUB_WORKSPACE/leakscan/server.pem" 2>/dev/null
          else
            ssh-keygen -t rsa -b 2048 -m PEM -N "" -f "$GITHUB_WORKSPACE/leakscan/server.pem" -q
          fi
          head -1 "$GITHUB_WORKSPACE/leakscan/server.pem"
      - name: Scan the leaking directory
        id: action
        uses: .
        continue-on-error: true
        with:
          paths: leakscan
          gitleaks-checksum: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
      - name: Assert scan failed due to detected secret
        env:
          CLEAN: ${{ steps.clean.outcome }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "clean outcome: $CLEAN"
          echo "leak outcome: $OUTCOME"
          if [ "$CLEAN" != "success" ]; then
            echo "FAIL: baseline clean scan should succeed"
            exit 1
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the scan to fail on a private key"
            exit 1
          fi
          echo "PASS"
