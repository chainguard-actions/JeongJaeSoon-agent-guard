name: Test secret detection fails the scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a scan target containing a GitHub PAT-shaped secret
        run: |
          mkdir -p scan-secret
          tok="ghp_$(head -c 4000 /dev/urandom | tr -dc 'A-Za-z0-9' | head -c 36)"
          printf 'GITHUB_TOKEN=%s\n' "$tok" > scan-secret/config.env
          echo "token length: ${#tok}"
      - id: action
        uses: .
        continue-on-error: true
        with:
          paths: scan-secret
          require-checksum: "false"
      - name: Assert action failed due to detected secret
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when a secret is present"
            exit 1
          fi
          echo "PASS"
