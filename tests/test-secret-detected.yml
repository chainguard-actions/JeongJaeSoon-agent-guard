name: Test secret detection
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install detecting fake gitleaks on PATH so the action skips the download step
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-gitleaks-detecting" /usr/local/bin/gitleaks
          chmod +x /usr/local/bin/gitleaks
          gitleaks version

      - name: Create a file with a secret pattern that the fake gitleaks detects
        run: |
          set -euo pipefail
          mkdir -p /tmp/secret-scan-target
          printf 'AGENT_GUARD_TEST_SECRET=super-secret-value\n' \
            > /tmp/secret-scan-target/leaked.txt

      - name: Run Agent Guard scan on the directory containing the fake secret
        id: scan
        uses: .
        with:
          paths: "/tmp/secret-scan-target"
          require-checksum: "false"
        env:
          # Use the detecting fake gitleaks which reports AGENT_GUARD_TEST_SECRET
          AGENT_GUARD_GITLEAKS_BIN: "${{ github.workspace }}/tests/fixtures/fake-gitleaks-detecting"
        continue-on-error: true

      - name: Assert action detected the secret and failed
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly detected the secret and failed"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have detected the secret and failed"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
