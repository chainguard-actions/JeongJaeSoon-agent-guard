name: Test secret detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-install gitleaks so the action skips the download step
        run: |
          set -euo pipefail
          VERSION="8.30.1"
          OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64|amd64) ARCH="x64" ;;
            arm64|aarch64) ARCH="arm64" ;;
          esac
          ARCHIVE="gitleaks_${VERSION}_${OS}_${ARCH}.tar.gz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ARCHIVE}"
          TMP="$(mktemp -d)"
          curl -fsSL "$URL" -o "$TMP/$ARCHIVE"
          tar -xzf "$TMP/$ARCHIVE" -C "$TMP"
          sudo mv "$TMP/gitleaks" /usr/local/bin/gitleaks
          sudo chmod +x /usr/local/bin/gitleaks
          gitleaks version

      - name: Create a directory with a fake secret (AWS key shape)
        run: |
          mkdir -p /tmp/secret-scan-target
          # This is a fake AWS access key that matches the vendor-token shape rule:
          # AKIA followed by exactly 16 uppercase alphanumeric chars.
          # It does NOT end in EXAMPLE so it is NOT allowlisted by the agent-guard config.
          # The agent-guard-vendor-token-shape rule matches it by shape alone (no entropy gate).
          echo 'AWS_ACCESS_KEY_ID=AKIAABCDEFGHIJ123456' > /tmp/secret-scan-target/config.env

      - id: action
        uses: .
        with:
          paths: /tmp/secret-scan-target
          require-checksum: "false"
        continue-on-error: true

      - name: Assert action detected the secret and failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly detected the fake AWS key shape and failed"
          else
            echo "FAIL: expected action to fail (secret detected) but got outcome '$OUTCOME'"
            exit 1
          fi
