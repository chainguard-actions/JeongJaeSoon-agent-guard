name: Test secret detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="8.30.1"
          OS="linux"
          ARCH="x64"
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_${OS}_${ARCH}.tar.gz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ARCHIVE}"
          TMP=$(mktemp -d)
          curl -fsSL "$URL" -o "$TMP/$ARCHIVE"
          tar -xzf "$TMP/$ARCHIVE" -C "$TMP"
          sudo mv "$TMP/gitleaks" /usr/local/bin/gitleaks
          sudo chmod +x /usr/local/bin/gitleaks
          gitleaks version

      - name: Create a directory with a secret-like value
        run: |
          mkdir -p /tmp/dirty-scan
          # Write a fake RSA private key fixture (same pattern used in agent-guard smoke-test)
          BODY="AGENT-GUARD-FIXTURE-NEVER-A-REAL-KEY"
          BODY="${BODY}-${BODY}-${BODY}-${BODY}"
          {
            printf '%s%s\n' '-----BEGIN RSA ' 'PRIVATE KEY-----'
            printf '%s\n' "$BODY"
            printf '%s%s\n' '-----END RSA ' 'PRIVATE KEY-----'
          } > /tmp/dirty-scan/private-key-fixture.txt

      - name: Run Agent Guard on dirty directory (expect failure)
        id: action
        uses: .
        with:
          paths: /tmp/dirty-scan
          require-checksum: "false"
        continue-on-error: true

      - name: Assert action failed due to secret detection
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when a secret-like value is present, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly detected secret-like value and failed"
