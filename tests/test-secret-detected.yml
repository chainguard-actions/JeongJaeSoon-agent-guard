name: Test secret leak is detected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create scan target containing a GitHub-token-shaped secret
        run: |
          rm -rf "$GITHUB_WORKSPACE/ag-leak-target"
          mkdir -p "$GITHUB_WORKSPACE/ag-leak-target"
          suffix="$(head -c 4000 /dev/urandom | LC_ALL=C tr -dc 'A-Za-z0-9' | head -c 36)"
          printf 'config:\n  value: ghp_%s\n' "$suffix" > "$GITHUB_WORKSPACE/ag-leak-target/settings.yml"
          wc -c "$GITHUB_WORKSPACE/ag-leak-target/settings.yml"
      - id: action
        uses: .
        continue-on-error: true
        with:
          paths: ag-leak-target
          require-checksum: "false"
      - name: Assert action failed due to the leak
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when a secret is present"
            exit 1
          fi
          if ! command -v gitleaks >/dev/null; then
            echo "FAIL: gitleaks was not installed, so failure was not caused by a finding"
            exit 1
          fi
          echo "PASS"
