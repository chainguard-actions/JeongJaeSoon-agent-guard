name: Test secret detection causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-install gitleaks
        run: |
          set -euo pipefail
          if ! command -v gitleaks > /dev/null 2>&1; then
            VERSION="8.30.1"
            OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
            ARCH="$(uname -m)"
            case "$ARCH" in
              x86_64|amd64) ARCH="x64" ;;
              arm64|aarch64) ARCH="arm64" ;;
            esac
            ARCHIVE="gitleaks_${VERSION}_${OS}_${ARCH}.tar.gz"
            URL="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ARCHIVE}"
            TMP="$(mktemp -d)"
            curl -fsSL "$URL" -o "$TMP/$ARCHIVE"
            tar -xzf "$TMP/$ARCHIVE" -C "$TMP"
            sudo mv "$TMP/gitleaks" /usr/local/bin/gitleaks
            sudo chmod +x /usr/local/bin/gitleaks
          fi
          gitleaks version

      - name: Create a directory with a secret-like file
        run: |
          mkdir -p /tmp/dirty-scan-target
          # Write a fake RSA private key that gitleaks will detect
          # The body does not match any allowlist pattern (no "example", "dummy", "not-a-real", all-x, all-0)
          printf '%s\n' '-----BEGIN RSA PRIVATE KEY-----' > /tmp/dirty-scan-target/key.pem
          printf '%s\n' 'MIIEowIBAAKCAQEA2a2rwplBQLF29amygykEMmYz0+Kcj3bKBp29P2rFj7bBCRMo' >> /tmp/dirty-scan-target/key.pem
          printf '%s\n' 'HkBZBMgBe4GBpFGOfMBMtHvpBCMbSMZBMgBe4GBpFGOfMBMtHvpBCMbSMZBMgBe' >> /tmp/dirty-scan-target/key.pem
          printf '%s\n' '-----END RSA PRIVATE KEY-----' >> /tmp/dirty-scan-target/key.pem

      - name: Run Agent Guard on directory with secrets (expect failure)
        id: action
        uses: .
        with:
          paths: /tmp/dirty-scan-target
          require-checksum: "false"
        continue-on-error: true

      - name: Assert action failed (secret detected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when secrets are detected, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when secret-like content was detected"
