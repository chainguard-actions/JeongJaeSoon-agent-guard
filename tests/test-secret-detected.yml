name: Test secret detection blocks scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Pre-install the mock gitleaks which detects AGENT_GUARD_TEST_SECRET.
      # Under act, $GITHUB_WORKSPACE is the action directory itself.
      - name: Install mock gitleaks
        run: |
          mkdir -p "$RUNNER_TEMP/mock-bin"
          cp "$GITHUB_WORKSPACE/tests/fixtures/mock-gitleaks" \
             "$RUNNER_TEMP/mock-bin/gitleaks"
          chmod +x "$RUNNER_TEMP/mock-bin/gitleaks"
          echo "$RUNNER_TEMP/mock-bin" >> "$GITHUB_PATH"

      # Create a directory with a file containing a secret-like value
      - name: Create dirty scan target with secret
        run: |
          mkdir -p /tmp/dirty-target
          echo "AGENT_GUARD_TEST_SECRET=super-secret-value" > /tmp/dirty-target/secrets.env

      - name: Run Agent Guard on dirty path (expect failure)
        id: action
        uses: .
        with:
          paths: /tmp/dirty-target
          require-checksum: "false"
        continue-on-error: true

      - name: Assert action failed due to secret detection
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when a secret-like value is detected, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when secret-like value was detected"
