name: Test secret in path fails the scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create scan target containing a synthetic GitHub token
        run: |
          mkdir -p agent-guard-leak
          # Assemble the token at runtime so no secret-like literal is committed.
          tok="$(printf '%s%s' 'ghp_' 'Zq8Xv3Lm9Tr2Wk7Np4Hs6Jd1Fb5Gc0Ya8Ue3')"
          printf 'GITHUB_TOKEN=%s\n' "$tok" > agent-guard-leak/config.env
      - id: action
        uses: .
        continue-on-error: true
        with:
          paths: agent-guard-leak
          require-checksum: "false"
      - name: Assert scan failed due to finding
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the scan to fail on a leaked secret"
            exit 1
          fi
          echo "PASS"
