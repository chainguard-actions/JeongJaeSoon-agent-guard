name: Test secret detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a directory with a secret-like file
        run: |
          mkdir -p /tmp/dirty-scan-dir
          # Write a fake RSA private key that gitleaks will detect
          # The header is split across printf calls so this YAML file itself
          # does not trigger gitleaks when the workspace is scanned.
          BODY="AGENT-GUARD-FIXTURE-NEVER-A-REAL-KEY"
          BODY="${BODY}-${BODY}-${BODY}-${BODY}"
          {
            printf '%s%s\n' '-----BEGIN RSA ' 'PRIVATE KEY-----'
            printf '%s\n' "$BODY"
            printf '%s%s\n' '-----END RSA ' 'PRIVATE KEY-----'
          } > /tmp/dirty-scan-dir/key.pem

      - name: Run Agent Guard on dirty directory (expect failure)
        id: action
        uses: .
        with:
          paths: /tmp/dirty-scan-dir
          require-checksum: "false"
        continue-on-error: true

      - name: Assert secret was detected (action should have failed)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when a secret-like value is present, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: secret was correctly detected and action failed"
