name: Test secret detection (secrets found)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a directory with a file containing a fake secret pattern
      # Using a GitHub PAT-shaped token (ghp_ prefix + 36 alphanumeric chars)
      # which is detected by the agent-guard-vendor-token-shape rule
      - name: Create test directory with a secret-like value
        run: |
          mkdir -p /tmp/secret-test-dir
          # This is a fake token shaped like a GitHub PAT — detected by shape rule
          echo 'token = "ghp_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"' > /tmp/secret-test-dir/config.txt

      # Scan the directory; expect the action to fail because a secret was detected
      - id: action
        uses: .
        continue-on-error: true
        with:
          paths: "/tmp/secret-test-dir"
          gitleaks-version: "8.30.1"
          require-checksum: "false"

      - name: Assert action failed due to secret detection
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when a secret is detected, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly detected and reported a secret"
