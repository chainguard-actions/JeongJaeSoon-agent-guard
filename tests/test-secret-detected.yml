name: Test secret is detected and fails the step
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create scan target containing a secret
        run: |
          mkdir -p leaky-target
          # Build the token at runtime so no secret is committed.
          prefix="ghp"
          body="8kQz3VnR7tYp2LmX9wB4cJ6hF1dS5gA0eUiO"
          printf 'GITHUB_TOKEN=%s_%s\n' "$prefix" "$body" > leaky-target/.env
          printf 'token = "%s_%s"\n' "$prefix" "$body" > leaky-target/settings.py
      - id: action
        uses: .
        continue-on-error: true
        with:
          paths: leaky-target
          require-checksum: "false"
      - name: Assert action failed due to detection
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when a secret is present"
            exit 1
          fi
          if ! command -v gitleaks >/dev/null; then
            echo "FAIL: gitleaks should have been installed (failure must come from the scan)"
            exit 1
          fi
          echo "PASS"
