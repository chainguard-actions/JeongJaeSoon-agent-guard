name: Test secret detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a directory with a secret-like file
        run: |
          mkdir -p /tmp/dirty-scan-target
          # Write a fake RSA private key (same fixture format as agent-guard smoke test)
          {
            printf '%s\n' '-----BEGIN RSA PRIVATE KEY-----'
            printf '%s\n' 'AGENT-GUARD-FIXTURE-NEVER-A-REAL-KEY-AGENT-GUARD-FIXTURE-NEVER-A-REAL-KEY-AGENT-GUARD-FIXTURE-NEVER-A-REAL-KEY-AGENT-GUARD-FIXTURE-NEVER-A-REAL-KEY'
            printf '%s\n' '-----END RSA PRIVATE KEY-----'
          } > /tmp/dirty-scan-target/private-key.txt

      - name: Run Agent Guard on path with secret (expect failure)
        id: action
        uses: .
        with:
          paths: /tmp/dirty-scan-target
          require-checksum: "false"
        continue-on-error: true

      - name: Assert action failed (secret detected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when scanning a path with a secret-like value, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly detected secret-like value and failed"
