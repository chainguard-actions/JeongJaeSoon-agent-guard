name: Test secret leak is detected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Resolve official gitleaks checksum
        id: sum
        run: |
          set -euo pipefail
          version=8.30.1
          case "$(uname -m)" in
            x86_64|amd64) arch=x64 ;;
            arm64|aarch64) arch=arm64 ;;
          esac
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_checksums.txt" -o "$RUNNER_TEMP/gl-sums.txt"
          sum="$(awk -v f="gitleaks_${version}_linux_${arch}.tar.gz" '$2==f {print $1}' "$RUNNER_TEMP/gl-sums.txt")"
          echo "checksum: $sum"
          if [ -z "$sum" ]; then echo "FAIL: could not resolve checksum"; exit 1; fi
          echo "checksum=$sum" >> "$GITHUB_OUTPUT"
      - name: Create directory containing a synthetic secret
        run: |
          mkdir -p agent-guard-leak
          # Generate a random GitHub-PAT-shaped token at runtime (never committed).
          tok="ghp_$(LC_ALL=C tr -dc 'A-Za-z0-9' </dev/urandom | head -c 36)"
          printf 'GITHUB_TOKEN=%s\n' "$tok" > agent-guard-leak/settings.env
          printf 'export const token = "%s";\n' "$tok" > agent-guard-leak/client.js
      - id: action
        uses: .
        continue-on-error: true
        with:
          paths: agent-guard-leak
          gitleaks-checksum: ${{ steps.sum.outputs.checksum }}
      - name: Assert action failed because a secret was found
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the scan to fail on a leaked secret"
            exit 1
          fi
          if ! command -v gitleaks >/dev/null; then
            echo "FAIL: gitleaks was not installed, so failure was not due to detection"
            exit 1
          fi
          echo "PASS"
