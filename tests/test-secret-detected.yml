name: Test secret detected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare directories
        run: |
          rm -rf ag-secret ag-secret-clean
          mkdir -p ag-secret ag-secret-clean
          echo "nothing to see here" > ag-secret-clean/notes.txt
          # Build the token at runtime so the workflow file itself has no token.
          prefix="gh""p_"
          body="aB3dE5fG7h""J9kL1mN2pQ""4rS6tU8vW0""yZ1cD3"
          printf 'value = %s%s\n' "$prefix" "$body" > ag-secret/config.txt
      - name: Control scan on clean directory (must succeed)
        id: control
        uses: .
        with:
          paths: ag-secret-clean
          require-checksum: "false"
      - id: action
        uses: .
        continue-on-error: true
        with:
          paths: ag-secret
          require-checksum: "false"
      - name: Assert scan failed due to detection
        env:
          CONTROL: ${{ steps.control.outcome }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "control outcome: $CONTROL"
          echo "outcome: $OUTCOME"
          if [ "$CONTROL" != "success" ]; then
            echo "FAIL: control scan should succeed"
            exit 1
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure because a secret is present"
            exit 1
          fi
          echo "PASS"
      - name: Cleanup
        if: always()
        run: rm -rf ag-secret ag-secret-clean
