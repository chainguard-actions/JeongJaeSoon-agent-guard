name: Test secret detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a file with a fake secret
        run: |
          # Write a file containing a GitHub PAT-shaped token that gitleaks should detect.
          # This is a synthetic token that matches the vendor-prefix shape rule.
          mkdir -p /tmp/secret-test
          cat > /tmp/secret-test/leaked.txt <<'EOF'
          GITHUB_TOKEN=ghp_A1B2C3D4E5F6G7H8I9J0K1L2M3N4O5P6Q7R8
          EOF

      - name: Run Agent Guard on directory with secret
        id: scan
        uses: .
        with:
          paths: "/tmp/secret-test"
          require-checksum: "false"
        continue-on-error: true

      - name: Assert secret was detected (action should have failed)
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: Agent Guard correctly detected the secret and failed"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: Agent Guard should have detected the secret but succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
