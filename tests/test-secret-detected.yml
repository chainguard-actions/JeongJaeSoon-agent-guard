name: Test secret detected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a file containing a fake secret (built at runtime)
        run: |
          dir="$RUNNER_TEMP/agent-guard-secret"
          rm -rf "$dir"
          mkdir -p "$dir"
          p1="ghp_"
          p2="Zq8xT3mR7vB2nK9wL4pD6sF1hJ5gY0cA8eUo"
          a1="AKIA"
          a2="QYLPMN5HHRFTZ4W7"
          {
            echo "GITHUB_TOKEN=${p1}${p2}"
            echo "aws_access_key_id = ${a1}${a2}"
          } > "$dir/config.env"
          cat "$dir/config.env" | wc -l
      - id: action
        uses: .
        continue-on-error: true
        with:
          paths: ${{ runner.temp }}/agent-guard-secret
          require-checksum: "false"
      - name: Assert scan failed due to detected secret
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when a secret is present"
            exit 1
          fi
          echo "PASS"
