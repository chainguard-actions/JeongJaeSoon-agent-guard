name: Test secret detection - action fails when secrets found
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mock gitleaks that simulates secret detection (exits 1)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mock-bin"
          printf '#!/bin/sh\ncase "${1:-}" in\n  version) echo "v8.30.1" ;;\n  detect)  exit 1 ;;\n  *)       exit 1 ;;\nesac\n' > "$RUNNER_TEMP/mock-bin/gitleaks"
          chmod +x "$RUNNER_TEMP/mock-bin/gitleaks"
          echo "$RUNNER_TEMP/mock-bin" >> "$GITHUB_PATH"

      - name: Create a git repository to scan
        run: |
          set -euo pipefail
          rm -rf /tmp/secret-scan-target
          mkdir -p /tmp/secret-scan-target
          cd /tmp/secret-scan-target
          git init
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo "# A repository" > README.md
          git add .
          git commit -m "initial commit"

      - id: action
        uses: .
        with:
          paths: /tmp/secret-scan-target
          require-checksum: "false"
        continue-on-error: true

      - name: Assert action failed due to detected secret
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly detected the secret and failed"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have detected the secret and failed"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
