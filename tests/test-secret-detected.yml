name: Test secret is detected and fails the step
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create directory with secrets (generated at runtime)
        run: |
          d="$RUNNER_TEMP/leaky-dir"
          mkdir -p "$d"
          body="$(head -c 1200 /dev/urandom | base64 -w 64)"
          {
            echo "-----BEGIN RSA PRIVATE KEY-----"
            echo "$body"
            echo "-----END RSA PRIVATE KEY-----"
          } > "$d/id_rsa"
          gh="ghp_$(head -c 200 /dev/urandom | tr -dc 'A-Za-z0-9' | head -c 36)"
          aws="AKIA$(head -c 200 /dev/urandom | tr -dc 'A-Z2-7' | head -c 16)"
          printf 'GITHUB_TOKEN=%s\nAWS_ACCESS_KEY_ID=%s\n' "$gh" "$aws" > "$d/config.env"
      - id: action
        uses: .
        continue-on-error: true
        with:
          paths: ${{ runner.temp }}/leaky-dir
          require-checksum: "false"
      - name: Assert failure due to detection
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when secrets are present"
            exit 1
          fi
          echo "PASS"
