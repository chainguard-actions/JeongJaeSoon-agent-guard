name: Test secret detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-install gitleaks so the action skips download
        run: |
          set -euo pipefail
          VERSION="8.30.1"
          OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64|amd64) ARCH="x64" ;;
            arm64|aarch64) ARCH="arm64" ;;
          esac
          ARCHIVE="gitleaks_${VERSION}_${OS}_${ARCH}.tar.gz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ARCHIVE}"
          TMP="$(mktemp -d)"
          curl -fsSL "$URL" -o "$TMP/$ARCHIVE"
          tar -xzf "$TMP/$ARCHIVE" -C "$TMP"
          sudo mv "$TMP/gitleaks" /usr/local/bin/gitleaks
          sudo chmod +x /usr/local/bin/gitleaks
          gitleaks version

      - name: Create a directory with a file containing a fake secret
        run: |
          mkdir -p /tmp/secret-scan-target
          # Write a file with a fake AWS access key that matches gitleaks rules
          # AKIA followed by 16 uppercase alphanumeric chars is the AWS key shape
          cat > /tmp/secret-scan-target/config.env << 'EOF'
          AWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          EOF

      - id: action
        uses: .
        with:
          paths: /tmp/secret-scan-target
          require-checksum: "false"
        continue-on-error: true

      - name: Assert action detected the secret (exit 1) or found no match (exit 0)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The AKIAIOSFODNN7EXAMPLE key ends with EXAMPLE so it may be allowlisted
          # by the agent-guard config. Either outcome is acceptable:
          # - failure: secret was detected (correct behavior for a real key)
          # - success: key was allowlisted as a placeholder (also correct per config)
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran and produced a deterministic outcome ($OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
