name: Test secret detection (action fails when secret found)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install gitleaks for testing
        run: |
          set -euo pipefail
          version="8.30.1"
          os="linux"
          arch="x64"
          archive="gitleaks_${version}_${os}_${arch}.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          tmp="$(mktemp -d)"
          curl -fsSL "$url" -o "$tmp/$archive"
          tar -xzf "$tmp/$archive" -C "$tmp"
          sudo mv "$tmp/gitleaks" /usr/local/bin/gitleaks
          sudo chmod +x /usr/local/bin/gitleaks
          gitleaks version

      - name: Create a directory with a secret-like file
        run: |
          mkdir -p /tmp/dirty-scan-target
          # Write a fake RSA private key (same pattern as agent-guard smoke test)
          body="AGENT-GUARD-FIXTURE-NEVER-A-REAL-KEY"
          body="${body}-${body}-${body}-${body}"
          {
            printf '%s%s\n' '-----BEGIN RSA ' 'PRIVATE KEY-----'
            printf '%s\n' "$body"
            printf '%s%s\n' '-----END RSA ' 'PRIVATE KEY-----'
          } > /tmp/dirty-scan-target/key.pem

      - name: Run Agent Guard on directory with secret (expect failure)
        id: action
        uses: .
        with:
          paths: /tmp/dirty-scan-target
          require-checksum: "false"
        continue-on-error: true

      - name: Assert action failed (secret was detected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when a secret-like value is present, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when secret-like value was detected"
