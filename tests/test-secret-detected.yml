name: Test secret is detected and fails the action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Compute gitleaks archive checksum
        id: sum
        run: |
          set -euo pipefail
          version=8.30.1
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          case "$(uname -m)" in
            x86_64|amd64) arch=x64 ;;
            arm64|aarch64) arch=arm64 ;;
          esac
          archive="gitleaks_${version}_${os}_${arch}.tar.gz"
          tmp="$(mktemp -d)"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" -o "$tmp/$archive"
          sum="$(sha256sum "$tmp/$archive" | awk '{print $1}')"
          echo "checksum=$sum" >> "$GITHUB_OUTPUT"
      - name: Create a file containing a secret-like value (runtime only)
        run: |
          set -euo pipefail
          mkdir -p leaky
          token="ghp_$(head -c 400 /dev/urandom | tr -dc 'A-Za-z0-9' | head -c 36)"
          printf 'GITHUB_TOKEN=%s\n' "$token" > leaky/creds.env
          echo "created leaky/creds.env"
      - id: action
        uses: .
        continue-on-error: true
        with:
          paths: leaky
          gitleaks-checksum: ${{ steps.sum.outputs.checksum }}
      - name: Assert action failed due to detection
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the action to fail on a detected secret"
            exit 1
          fi
          echo "PASS"
