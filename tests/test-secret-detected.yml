name: Test secret detection fails scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create directory with a secret-like file
        run: |
          mkdir -p /tmp/dirty-scan-target
          # Write a fake RSA private key that gitleaks will detect
          printf '%s\n' '-----BEGIN RSA PRIVATE KEY-----' > /tmp/dirty-scan-target/key.pem
          printf '%s\n' 'AGENT-GUARD-FIXTURE-NEVER-A-REAL-KEY-AGENT-GUARD-FIXTURE-NEVER-A-REAL-KEY' >> /tmp/dirty-scan-target/key.pem
          printf '%s\n' '-----END RSA PRIVATE KEY-----' >> /tmp/dirty-scan-target/key.pem

      - name: Run Agent Guard on dirty directory (expect failure)
        id: action
        uses: .
        with:
          paths: /tmp/dirty-scan-target
          require-checksum: "false"
        continue-on-error: true

      - name: Assert action failed due to secret detection
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when a secret-like value is present, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when secret-like value was detected"
