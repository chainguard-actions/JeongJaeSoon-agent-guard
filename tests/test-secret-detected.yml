name: Test secret detection (action should fail)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a directory with a fake secret inside the workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/secret-scan-target"
          # Use a GitHub PAT-shaped token (ghp_ prefix + 36 mixed alphanumeric chars)
          # High-entropy token to pass gitleaks entropy filters and match the
          # agent-guard-vendor-token-shape rule: gh[opusr]_[0-9A-Za-z]{36}
          # Token: ghp_ + 36 mixed-case alphanumeric chars (high entropy, matches gh[opusr]_[0-9A-Za-z]{36})
          echo 'TOKEN=ghp_xK8mN2pQ5rT7vW9yA1bC3dE6fG0hJ4kL8nZp' > "$GITHUB_WORKSPACE/secret-scan-target/secrets.env"

      - id: action
        name: Run Agent Guard on directory with secret
        uses: .
        with:
          paths: secret-scan-target
          require-checksum: "false"
        continue-on-error: true

      - name: Assert scan failed (secret was detected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: Agent Guard correctly detected the secret and failed"
          else
            echo "FAIL: Expected Agent Guard to fail on secret detection, but outcome was '$OUTCOME'"
            exit 1
          fi
