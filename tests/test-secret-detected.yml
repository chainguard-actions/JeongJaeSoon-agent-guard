name: Test secret detection (action should fail)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a directory containing a secret-like value
        run: |
          mkdir -p "$RUNNER_TEMP/dirty-scan"
          # Write a fake RSA private key (same fixture pattern used by agent-guard smoke tests)
          body="AGENT-GUARD-FIXTURE-NEVER-A-REAL-KEY"
          body="${body}-${body}-${body}-${body}"
          {
            printf '%s%s\n' '-----BEGIN RSA ' 'PRIVATE KEY-----'
            printf '%s\n' "$body"
            printf '%s%s\n' '-----END RSA ' 'PRIVATE KEY-----'
          } > "$RUNNER_TEMP/dirty-scan/key.pem"
          echo "Created fixture key file:"
          cat "$RUNNER_TEMP/dirty-scan/key.pem"

      - name: Run Agent Guard on dirty path (expect failure)
        id: action
        uses: .
        with:
          paths: ${{ runner.temp }}/dirty-scan
          gitleaks-checksum: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        continue-on-error: true

      - name: Assert action failed due to secret detection
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when a secret-like value is present, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly detected secret-like value and failed"
