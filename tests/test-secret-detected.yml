name: Test secret in scanned path fails the action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create clean and leaky content
        run: |
          rm -rf .ag-test-clean .ag-test-leak
          mkdir -p .ag-test-clean .ag-test-leak
          printf 'Just some harmless text.\n' > .ag-test-clean/notes.txt
          # Build a GitHub PAT-shaped token at runtime so no literal is committed.
          prefix="ghp"
          body="aB3dE5fG7hJ9kL1mN3pQ5rS7tU9vW1xY3zA5"
          printf 'token = "%s_%s"\n' "$prefix" "$body" > .ag-test-leak/config.txt
      - id: clean
        name: Control scan of clean content (installs gitleaks)
        uses: .
        with:
          paths: .ag-test-clean
          require-checksum: "false"
      - id: action
        name: Scan leaky content
        uses: .
        continue-on-error: true
        with:
          paths: .ag-test-leak
          require-checksum: "false"
      - name: Assert control passed and leak scan failed
        env:
          CLEAN: ${{ steps.clean.outcome }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "clean outcome: $CLEAN"
          echo "leak outcome: $OUTCOME"
          if [ "$CLEAN" != "success" ]; then
            echo "FAIL: control scan should succeed"
            exit 1
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the leak scan to fail"
            exit 1
          fi
          echo "PASS"
