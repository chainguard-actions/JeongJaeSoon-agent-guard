name: Test secret is detected and fails the scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create directory containing a vendor-shaped token
        run: |
          set -euo pipefail
          mkdir -p ag-scan-leak
          rand="$(head -c 4096 /dev/urandom | tr -dc 'A-Za-z0-9' | head -c 36)"
          printf 'token = "ghp_%s"\n' "$rand" > ag-scan-leak/settings.txt
          wc -c ag-scan-leak/settings.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          paths: ag-scan-leak
          require-checksum: "false"
      - name: Assert the scan failed on the leaked token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the action to fail when a secret is present"
            exit 1
          fi
          if ! command -v gitleaks >/dev/null; then
            echo "FAIL: gitleaks was not installed, so failure was not due to detection"
            exit 1
          fi
          echo "PASS"
