name: Test default path scan (current directory)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-install gitleaks
        run: |
          set -euo pipefail
          if ! command -v gitleaks > /dev/null 2>&1; then
            VERSION="8.30.1"
            OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
            ARCH="$(uname -m)"
            case "$ARCH" in
              x86_64|amd64) ARCH="x64" ;;
              arm64|aarch64) ARCH="arm64" ;;
            esac
            ARCHIVE="gitleaks_${VERSION}_${OS}_${ARCH}.tar.gz"
            URL="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ARCHIVE}"
            TMP="$(mktemp -d)"
            curl -fsSL "$URL" -o "$TMP/$ARCHIVE"
            tar -xzf "$TMP/$ARCHIVE" -C "$TMP"
            sudo mv "$TMP/gitleaks" /usr/local/bin/gitleaks
            sudo chmod +x /usr/local/bin/gitleaks
          fi
          gitleaks version

      - name: Create a clean subdirectory to scan as default path
        run: |
          mkdir -p /tmp/default-path-scan
          echo "# Clean README" > /tmp/default-path-scan/README.md
          echo "version: 1.0.0" > /tmp/default-path-scan/config.yaml
          echo "console.log('hello');" > /tmp/default-path-scan/index.js

      - name: Run Agent Guard with explicit clean path (simulating default path usage)
        id: action
        uses: .
        with:
          paths: /tmp/default-path-scan
          require-checksum: "false"

      - name: Assert action succeeded scanning the path
        run: |
          echo "Action completed successfully scanning the path"
          echo "PASS: no secrets detected in clean directory"
