name: Test missing checksum fails when require-checksum is true (default)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Precondition - gitleaks not preinstalled
        id: pre
        run: |
          if command -v gitleaks >/dev/null; then
            echo "preinstalled=true" >> "$GITHUB_OUTPUT"
          else
            echo "preinstalled=false" >> "$GITHUB_OUTPUT"
          fi
      - id: action
        uses: .
        continue-on-error: true
        with:
          paths: tests/fixtures/clean
      - name: Assert action failed without a checksum
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PRE: ${{ steps.pre.outputs.preinstalled }}
        run: |
          echo "outcome: $OUTCOME preinstalled: $PRE"
          if [ "$PRE" = "true" ]; then
            if [ "$OUTCOME" != "success" ]; then
              echo "FAIL: gitleaks preinstalled, expected success"
              exit 1
            fi
            echo "PASS: gitleaks preinstalled, install step skipped"
            exit 0
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when checksum missing and required"
            exit 1
          fi
          if [ -x "$RUNNER_TEMP/agent-guard-bin/gitleaks" ]; then
            echo "FAIL: gitleaks should not have been installed"
            exit 1
          fi
          echo "PASS"
