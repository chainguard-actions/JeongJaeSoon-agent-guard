name: Test nonexistent config path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create clean directory
        run: |
          mkdir -p "$RUNNER_TEMP/clean-scan"
          echo "nothing here" > "$RUNNER_TEMP/clean-scan/file.txt"
          echo "CLEAN_DIR=$RUNNER_TEMP/clean-scan" >> "$GITHUB_ENV"
      - id: action
        uses: .
        continue-on-error: true
        with:
          paths: ${{ env.CLEAN_DIR }}
          require-checksum: "false"
          config-path: /nonexistent/agent-guard/gitleaks.toml
      - name: Assert failure with missing config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure with a nonexistent config path"
            exit 1
          fi
          if ! command -v gitleaks >/dev/null; then
            echo "FAIL: gitleaks install step did not succeed"
            exit 1
          fi
          echo "PASS"
