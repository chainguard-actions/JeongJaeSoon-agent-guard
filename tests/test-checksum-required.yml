name: Test missing checksum fails when gitleaks must be installed
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare clean directory and record gitleaks presence
        id: pre
        run: |
          mkdir -p "$RUNNER_TEMP/clean-dir"
          echo "nothing to see" > "$RUNNER_TEMP/clean-dir/a.txt"
          if command -v gitleaks >/dev/null; then
            echo "has_gitleaks=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_gitleaks=false" >> "$GITHUB_OUTPUT"
          fi
      - id: action
        uses: .
        continue-on-error: true
        with:
          paths: ${{ runner.temp }}/clean-dir
      - name: Assert outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
          HAS: ${{ steps.pre.outputs.has_gitleaks }}
        run: |
          echo "outcome: $OUTCOME has_gitleaks: $HAS"
          if [ "$HAS" = "true" ]; then
            if [ "$OUTCOME" != "success" ]; then
              echo "FAIL: gitleaks preinstalled, expected success"
              exit 1
            fi
          else
            if [ "$OUTCOME" != "failure" ]; then
              echo "FAIL: expected failure without gitleaks-checksum"
              exit 1
            fi
            if [ -x "$RUNNER_TEMP/agent-guard-bin/gitleaks" ]; then
              echo "FAIL: gitleaks should not have been installed"
              exit 1
            fi
          fi
          echo "PASS"
