name: Test checksum required enforcement
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure gitleaks is not on PATH for this test
        run: |
          # Remove gitleaks from common locations so the action must install it
          sudo rm -f /usr/local/bin/gitleaks /usr/bin/gitleaks /opt/hostedtoolcache/gitleaks 2>/dev/null || true
          # Verify it's gone
          if command -v gitleaks >/dev/null 2>&1; then
            GITLEAKS_PATH="$(command -v gitleaks)"
            echo "gitleaks found at $GITLEAKS_PATH — removing"
            sudo rm -f "$GITLEAKS_PATH" || true
          fi
          echo "gitleaks availability: $(command -v gitleaks 2>/dev/null || echo 'not found')"

      - name: Run Agent Guard with require-checksum=true and no checksum (should fail)
        id: action
        uses: .
        with:
          paths: "."
          gitleaks-version: "8.30.1"
          gitleaks-checksum: ""
          require-checksum: "true"
        continue-on-error: true

      - name: Assert action failed due to missing checksum
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when require-checksum=true and no checksum provided, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when checksum was required but not provided"
