name: Test checksum required enforcement
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-install gitleaks to bypass download step
        run: |
          # Install gitleaks so the action uses the pre-installed binary
          # and skips the download/checksum step entirely
          version="8.30.1"
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m)"
          case "$arch" in
            x86_64|amd64) arch="x64" ;;
            arm64|aarch64) arch="arm64" ;;
          esac
          archive="gitleaks_${version}_${os}_${arch}.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          tmp="$(mktemp -d)"
          curl -fsSL "$url" -o "$tmp/$archive"
          tar -xzf "$tmp/$archive" -C "$tmp"
          sudo mv "$tmp/gitleaks" /usr/local/bin/gitleaks
          sudo chmod +x /usr/local/bin/gitleaks
          gitleaks version

      - name: Create a clean directory to scan
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/clean-dir2"
          echo "# Hello World" > "$GITHUB_WORKSPACE/tests/fixtures/clean-dir2/README.md"

      - id: action
        name: Run Agent Guard with pre-installed gitleaks (no checksum needed)
        uses: .
        with:
          paths: tests/fixtures/clean-dir2
          require-checksum: "true"
          # No gitleaks-checksum provided, but gitleaks is pre-installed so
          # the download step is skipped and checksum enforcement is bypassed

      - name: Assert action succeeded
        run: |
          echo "PASS: Agent Guard completed successfully with pre-installed gitleaks"
