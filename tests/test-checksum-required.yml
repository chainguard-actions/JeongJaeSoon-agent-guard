name: Test checksum required enforcement
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure gitleaks is NOT on PATH (so action tries to install it)
        run: |
          # Verify gitleaks is not pre-installed; if it is, skip this test gracefully
          if command -v gitleaks > /dev/null 2>&1; then
            echo "gitleaks is already installed at $(which gitleaks); this test requires it to be absent"
            echo "Removing from PATH for this test..."
            # We can't easily remove a system binary, so we'll shadow it with a fake that exits non-zero
            # Actually, the action checks 'command -v gitleaks' and exits early if found.
            # If gitleaks is already installed, the checksum check is skipped entirely.
            # In that case, we just verify the action succeeds (not the checksum path).
            echo "SKIP_CHECKSUM_TEST=true" >> "$GITHUB_ENV"
          fi

      - id: action
        name: Run Agent Guard without checksum (require-checksum=true by default)
        uses: .
        with:
          paths: "."
          gitleaks-checksum: ""
          require-checksum: "true"
        continue-on-error: true

      - name: Assert action failed due to missing checksum (or succeeded if gitleaks pre-installed)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SKIP: ${{ env.SKIP_CHECKSUM_TEST }}
        run: |
          echo "outcome: $OUTCOME"
          echo "skip_checksum_test: $SKIP"
          if [ "$SKIP" = "true" ]; then
            echo "PASS: gitleaks was pre-installed, checksum enforcement was bypassed (expected)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when checksum is required but not provided"
          else
            echo "FAIL: expected action to fail when require-checksum=true and no checksum given"
            exit 1
          fi
