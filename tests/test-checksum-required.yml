name: Test checksum required (default behavior)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # When gitleaks is not installed and require-checksum=true (default),
      # the action must fail because no checksum was provided.
      - id: action
        uses: .
        continue-on-error: true
        with:
          paths: "."
          gitleaks-version: "8.30.1"
          gitleaks-checksum: ""
          require-checksum: "true"

      - name: Assert action failed with checksum error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when require-checksum=true and no checksum provided, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when checksum was missing"
