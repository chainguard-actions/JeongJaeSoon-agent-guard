name: Test checksum required (default behavior)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure gitleaks is NOT on PATH
        run: |
          # Verify gitleaks is not pre-installed so the install step runs
          if command -v gitleaks > /dev/null 2>&1; then
            echo "gitleaks is already installed at $(which gitleaks); removing for test"
            sudo rm -f "$(which gitleaks)" || true
          fi
          echo "gitleaks not on PATH — install step will run"

      - id: action
        name: Run agent-guard without checksum (should fail)
        uses: .
        with:
          paths: "."
          gitleaks-version: "8.30.1"
          gitleaks-checksum: ""
          require-checksum: "true"
        continue-on-error: true

      - name: Assert action failed due to missing checksum
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when checksum is required but not provided"
          else
            echo "FAIL: expected action to fail when require-checksum=true and no checksum given, got: $OUTCOME"
            exit 1
          fi
