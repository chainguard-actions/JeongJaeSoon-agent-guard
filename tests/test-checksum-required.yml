name: Test missing checksum fails when require-checksum is true
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Record whether gitleaks is preinstalled
        id: pre
        run: |
          if command -v gitleaks >/dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
          mkdir -p clean-dir
          echo "nothing secret here" > clean-dir/readme.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          paths: clean-dir
      - name: Assert install was refused without checksum
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PRESENT: ${{ steps.pre.outputs.present }}
        run: |
          echo "outcome: $OUTCOME, gitleaks preinstalled: $PRESENT"
          if [ "$PRESENT" = "true" ]; then
            if [ "$OUTCOME" != "success" ]; then
              echo "FAIL: gitleaks preinstalled, install should be skipped and clean scan succeed"
              exit 1
            fi
            echo "PASS: gitleaks preinstalled; install skipped"
            exit 0
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when checksum is missing and required"
            exit 1
          fi
          if [ -x "$RUNNER_TEMP/agent-guard-bin/gitleaks" ]; then
            echo "FAIL: gitleaks should not have been installed"
            exit 1
          fi
          echo "PASS"
